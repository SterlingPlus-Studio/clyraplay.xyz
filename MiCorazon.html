<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Holograma 3D · Neco, te amo mucho</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;1,300&family=Inter:wght@200;300&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05000c;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    cursor: grab;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body:active { cursor: grabbing; }

  #bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 55%, rgba(255,40,140,0.20) 0%, rgba(0,120,180,0.14) 38%, rgba(4,0,12,1) 80%),
      radial-gradient(ellipse at 50% 100%, rgba(255,80,180,0.14) 0%, transparent 58%);
    pointer-events: none;
  }

  canvas#scene {
    display: block; position: relative; z-index: 2;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .scanlines {
    position: fixed; inset: -100px 0 0 0; z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 120, 200, 0.05) 0px,
      rgba(0, 255, 255, 0.05) 1px,
      transparent 1px,
      transparent 4px
    );
    mix-blend-mode: screen;
    animation: scanMove 6s linear infinite;
  }
  @keyframes scanMove { from { transform: translateY(0); } to { transform: translateY(100px); } }

  .vignette {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.82) 100%);
  }

  .hud {
    position: fixed; top: 20px; left: 22px; z-index: 5;
    color: #ffd8f0; pointer-events: none;
    animation: flicker 5s infinite;
    line-height: 1.45;
    max-width: calc(100vw - 130px);
  }
  .hud .line1 {
    font-family: "Montserrat", sans-serif;
    font-weight: 400;
    font-size: 14px; letter-spacing: 5px;
    text-transform: uppercase;
    color: #ff8fd0;
    text-shadow: 0 0 14px rgba(255,60,160,0.95), 0 0 34px rgba(255,60,160,0.5);
    white-space: nowrap;
  }
  .hud .line2 {
    font-family: "Montserrat", sans-serif;
    font-weight: 300;
    font-size: 10px; letter-spacing: 6px;
    text-transform: uppercase;
    color: #9ff6ff;
    text-shadow: 0 0 12px rgba(0,255,255,0.9);
    margin-top: 4px;
    padding-left: 19px;
    white-space: nowrap;
  }
  .hud .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: #ff2f8b; box-shadow: 0 0 14px #ff2f8b, 0 0 30px #ff2f8b;
    margin-right: 10px; vertical-align: middle;
    animation: pulse 1.05s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: .35; transform: scale(.62); }
  }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: .4; } 94% { opacity: 1; }
    96% { opacity: .55; } 97% { opacity: 1; }
  }

  #sub {
    position: fixed; bottom: 42px; left: 50%; transform: translateX(-50%);
    z-index: 5; width: 88%; max-width: 760px; text-align: center;
    font-family: "Montserrat", sans-serif;
    font-weight: 200;
    color: #ffe4f5; font-size: clamp(13px, 2.2vw, 18px);
    letter-spacing: 2.5px;
    text-shadow: 0 0 18px rgba(255,80,180,0.95), 0 0 44px rgba(0,200,255,0.45);
    transition: opacity .45s ease;
    pointer-events: none;
  }

  .hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 5;
    font-family: "Montserrat", sans-serif;
    font-weight: 300;
    color: rgba(255,150,220,0.45); font-size: 10px;
    letter-spacing: 4px; text-transform: uppercase; pointer-events: none;
    white-space: nowrap;
  }

  .controls {
    position: fixed; top: 20px; right: 20px; z-index: 6;
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
    align-items: center;
  }
  .holo-btn {
    font-family: "Montserrat", sans-serif;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffe4f5;
    background: linear-gradient(135deg,
      rgba(255,47,139,0.18) 0%,
      rgba(0,229,255,0.18) 100%);
    border: 1px solid rgba(159,249,255,0.55);
    border-radius: 999px;
    padding: 9px 16px 9px 14px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow:
      0 0 14px rgba(0,229,255,0.35),
      inset 0 0 12px rgba(255,95,176,0.22);
    transition: all .28s ease;
    outline: none;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    line-height: 1;
  }
  .holo-btn .btn-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    flex: 0 0 auto;
    color: #ff8fd0;
    filter: drop-shadow(0 0 6px rgba(255,60,160,0.65));
    transition: color .28s ease, filter .28s ease;
  }
  .holo-btn .btn-icon svg {
    width: 100%; height: 100%;
    display: block;
    stroke: currentColor;
  }
  .holo-btn:hover {
    color: #ffffff;
    border-color: rgba(255,143,208,0.95);
    box-shadow:
      0 0 22px rgba(255,60,160,0.65),
      0 0 38px rgba(0,229,255,0.35),
      inset 0 0 18px rgba(255,95,176,0.35);
    transform: translateY(-1px);
  }
  .holo-btn:hover .btn-icon {
    color: #ffffff;
    filter: drop-shadow(0 0 8px rgba(255,120,200,0.95));
  }
  .holo-btn:active { transform: translateY(0) scale(.97); }

  .modal {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: max(20px, env(safe-area-inset-top)) 16px
             max(30px, env(safe-area-inset-bottom));
    background: rgba(4,0,14,0.20);
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: auto;
  }
  .modal.open { display: flex; }
  .modal.visible { opacity: 1; }

  .modal-content {
    position: relative;
    width: 100%; max-width: 520px;
    margin: auto 0;
    background: linear-gradient(160deg,
      rgba(24,6,36,0.55) 0%,
      rgba(8,4,22,0.68) 100%);
    border: 1px solid rgba(159,249,255,0.45);
    border-radius: 22px;
    padding: 30px 22px 26px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-shadow:
      0 0 40px rgba(255,60,160,0.35),
      0 0 80px rgba(0,229,255,0.22),
      inset 0 0 40px rgba(255,95,176,0.08);
    transform: scale(0.94);
    transition: transform .38s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal.visible .modal-content { transform: scale(1); }

  .modal-close {
    position: absolute; top: 12px; right: 14px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255,47,139,0.22);
    border: 1px solid rgba(255,143,208,0.5);
    color: #ff9fd8;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .25s ease;
    backdrop-filter: blur(4px);
    z-index: 1;
    padding: 0;
  }
  .modal-close svg {
    width: 14px; height: 14px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    fill: none;
  }
  .modal-close:hover {
    background: rgba(255,47,139,0.45);
    color: #ffffff;
    box-shadow: 0 0 18px rgba(255,60,160,0.7);
  }

  .modal-title {
    font-family: "Montserrat", sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #ff9fd8;
    text-align: center;
    margin: 0 0 6px 0;
    text-shadow: 0 0 14px rgba(255,60,160,1), 0 0 30px rgba(255,60,160,0.6);
  }
  .modal-subtitle {
    font-family: "Montserrat", sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #9ff6ff;
    text-align: center;
    margin: 0 0 20px 0;
    text-shadow: 0 0 10px rgba(0,255,255,0.95);
  }

  .game-wrap {
    width: 100%;
    max-width: min(400px, 78vw);
    margin: 0 auto;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(159,249,255,0.4);
    box-shadow:
      0 0 24px rgba(0,229,255,0.28),
      inset 0 0 24px rgba(255,95,176,0.10);
    background: radial-gradient(circle at 50% 40%,
      rgba(30,6,50,0.55) 0%,
      rgba(6,2,18,0.72) 100%);
    position: relative;
    backdrop-filter: blur(3px);
  }
  #gameCanvas {
    display: block; width: 100%; height: 100%;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .game-hud {
    display: flex; justify-content: space-between;
    font-family: "Montserrat", sans-serif;
    font-weight: 400;
    font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase;
    color: #9ff6ff;
    padding: 14px 4px 6px;
    text-shadow: 0 0 10px rgba(0,255,255,0.9);
  }
  .game-hud .score { color: #ff9fd8; text-shadow: 0 0 10px rgba(255,60,160,1); }
  .game-hud .time  { color: #ffd166; text-shadow: 0 0 10px rgba(255,210,80,0.95); }

  /* Leyenda de ítems */
  .game-legend {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-family: "Montserrat", sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: #ffe4f5;
    text-shadow: 0 0 8px rgba(255,80,180,0.7);
  }
  .game-legend .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .game-legend .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex: 0 0 auto;
  }
  .game-legend .legend-dot.pink {
    background: #ff4fa3;
    box-shadow: 0 0 10px #ff4fa3, 0 0 18px rgba(255,79,163,0.6);
  }
  .game-legend .legend-dot.gold {
    background: #ffd166;
    box-shadow: 0 0 10px #ffd166, 0 0 18px rgba(255,209,102,0.6);
  }
  .game-legend .legend-dot.blue {
    background: #5f8fff;
    box-shadow: 0 0 10px #5f8fff, 0 0 18px rgba(95,143,255,0.6);
  }

  .game-msg {
    text-align: center;
    font-family: "Montserrat", sans-serif;
    font-weight: 300;
    font-size: 12px; letter-spacing: 2px;
    color: #ffe4f5;
    padding: 12px 6px 2px;
    text-shadow: 0 0 12px rgba(255,80,180,0.9);
    min-height: 20px;
    line-height: 1.5;
  }

  .poem {
    font-family: "Montserrat", sans-serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(13px, 3.4vw, 17px);
    line-height: 1.9;
    color: #ffffff;
    text-align: center;
    letter-spacing: 0.4px;
    text-shadow:
      0 0 14px rgba(255,80,180,0.85),
      0 0 30px rgba(0,229,255,0.5),
      0 2px 8px rgba(0,0,0,0.85);
    padding: 4px 2px;
  }
  .poem p {
    margin: 0 0 20px 0;
    opacity: 0;
    animation: fadeUp 1s ease forwards;
  }
  .poem p:nth-child(1) { animation-delay: .15s; }
  .poem p:nth-child(2) { animation-delay: .35s; }
  .poem p:nth-child(3) { animation-delay: .55s; }
  .poem p:nth-child(4) { animation-delay: .75s; }
  .poem p:nth-child(5) { animation-delay: .95s; }
  .poem .firma {
    font-style: normal;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #ff9fd8;
    margin-top: 8px;
    text-shadow: 0 0 14px rgba(255,60,160,1);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 560px) {
    .hud { top: 14px; left: 16px; max-width: calc(100vw - 108px); }
    .hud .line1 { font-size: 11px; letter-spacing: 3px; }
    .hud .line2 { font-size: 8px;  letter-spacing: 4px; padding-left: 15px; }
    .hud .dot   { width: 7px; height: 7px; margin-right: 8px; }

    .controls { top: 14px; right: 12px; gap: 8px; }

    .holo-btn {
      width: 40px; height: 40px;
      padding: 0; border-radius: 50%; gap: 0;
    }
    .holo-btn .btn-icon { width: 17px; height: 17px; }
    .holo-btn .btn-text { display: none; }

    .modal { padding: max(12px, env(safe-area-inset-top)) 12px
                     max(20px, env(safe-area-inset-bottom)); }
    .modal-content { padding: 26px 16px 22px; border-radius: 18px; }
    .poem { font-size: 13.5px; line-height: 1.85; }
    .poem p { margin-bottom: 16px; }
    .game-wrap { max-width: 88vw; }
  }

  @media (max-width: 360px) {
    .hud .line1 { font-size: 10px; letter-spacing: 2.5px; }
    .hud .line2 { font-size: 7.5px; letter-spacing: 3.5px; }
    .holo-btn { width: 36px; height: 36px; }
    .holo-btn .btn-icon { width: 15px; height: 15px; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="scene"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="hud">
  <div class="line1"><span class="dot"></span>Neco, te amo mucho</div>
  <div class="line2">Feliz primer aniversario</div>
</div>

<div class="controls">
  <button id="btnGame" class="holo-btn" aria-label="Mini Juego">
    <span class="btn-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </span>
    <span class="btn-text">Mini Juego</span>
  </button>

  <button id="btnPoem" class="holo-btn" aria-label="Poema">
    <span class="btn-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
        <line x1="16" y1="8" x2="2" y2="22"/>
        <line x1="17.5" y1="15" x2="9" y2="15"/>
      </svg>
    </span>
    <span class="btn-text">Poema</span>
  </button>
</div>

<div id="sub"></div>
<div class="hint">Arrastra para girar la proyección</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

/* ============================================================
   1. RENDERER / ESCENA / CÁMARA
   ============================================================ */
const canvas   = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 700);

let camTheta  = 0.35;
let camPhi    = 0.10;
let camRadius = 68;

/* ============================================================
   2. CORAZÓN BÉZIER
   ============================================================ */
const heartShape = new THREE.Shape();
const SC = 0.36;
const CX = 50, CY = 44;
const P  = (x, y) => [ (x - CX) * SC, -(y - CY) * SC ];

heartShape.moveTo(...P(50, 88));
heartShape.bezierCurveTo(...P(20, 65), ...P(0, 45),  ...P(0, 25));
heartShape.bezierCurveTo(...P(0, 10),  ...P(12, 0),  ...P(25, 0));
heartShape.bezierCurveTo(...P(37, 0),  ...P(45, 8),  ...P(50, 18));
heartShape.bezierCurveTo(...P(55, 8),  ...P(63, 0),  ...P(75, 0));
heartShape.bezierCurveTo(...P(88, 0),  ...P(100, 10),...P(100, 25));
heartShape.bezierCurveTo(...P(100, 45),...P(80, 65), ...P(50, 88));

/* ============================================================
   3. EXTRUIDO + INFLADO
   ============================================================ */
const heartGeo = new THREE.ExtrudeGeometry(heartShape, {
  depth: 3.0, bevelEnabled: true, bevelSegments: 8,
  bevelSize: 1.0, bevelThickness: 1.2, curveSegments: 24
});
heartGeo.center();
heartGeo.computeVertexNormals();

(function inflateHeart(geo, strength = 2.6) {
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  let maxR = 0;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const r = Math.sqrt(v.x * v.x + v.y * v.y);
    if (r > maxR) maxR = r;
  }
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const r = Math.sqrt(v.x * v.x + v.y * v.y);
    const t = Math.min(r / maxR, 1);
    const puff = Math.pow(1 - t, 1.35);
    v.z *= 1 + puff * strength;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
})(heartGeo, 2.6);

/* ============================================================
   4. CORAZÓN ÚNICO
   ============================================================ */
const heartGroup = new THREE.Group();
scene.add(heartGroup);

const coreMat = new THREE.MeshBasicMaterial({
  color: 0xff2f8b, transparent: true, opacity: 0.20,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
});
heartGroup.add(new THREE.Mesh(heartGeo, coreMat));

const innerMat = new THREE.MeshBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.10,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
});
const innerMesh = new THREE.Mesh(heartGeo, innerMat);
innerMesh.scale.setScalar(0.55);
heartGroup.add(innerMesh);

const wireMat = new THREE.MeshBasicMaterial({
  color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.16,
  blending: THREE.AdditiveBlending, depthWrite: false
});
heartGroup.add(new THREE.Mesh(heartGeo, wireMat));

const edgeMat = new THREE.LineBasicMaterial({
  color: 0xc8fdff, transparent: true, opacity: 0.7,
  blending: THREE.AdditiveBlending, depthWrite: false
});
heartGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(heartGeo, 30), edgeMat));

const dotMat = new THREE.PointsMaterial({
  color: 0xffd6f0, size: 0.32, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
heartGroup.add(new THREE.Points(heartGeo.clone(), dotMat));

/* ============================================================
   5. ANILLOS
   ============================================================ */
function makeRing(radius, tube, color, opacity) {
  const geo = new THREE.TorusGeometry(radius, tube, 6, 140);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  return new THREE.Mesh(geo, mat);
}
const ringA = makeRing(19, 0.05, 0x00e5ff, 0.30);
ringA.rotation.x = Math.PI / 2;
scene.add(ringA);

const ringB = makeRing(22, 0.04, 0xff5fb5, 0.24);
ringB.rotation.x = Math.PI / 2.6;
ringB.rotation.z = 0.5;
scene.add(ringB);

/* ============================================================
   6. RESPLANDOR
   ============================================================ */
function radialGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128,128,0, 128,128,128);
  grd.addColorStop(0.00, 'rgba(255,180,230,0.95)');
  grd.addColorStop(0.22, 'rgba(255,60,160,0.55)');
  grd.addColorStop(0.48, 'rgba(0,200,255,0.22)');
  grd.addColorStop(1.00, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: radialGlowTexture(), transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
glow.scale.set(40, 40, 1);

function makeTextSprite(text, color = '#9ff9ff') {
  const displayText = text.toUpperCase();
  const c = document.createElement('canvas');
  let ctx = c.getContext('2d');
  const FONT = `400 56px ${HUD_FONT}`;
  ctx.font = FONT;
  const textW = Math.ceil(ctx.measureText(displayText).width);
  c.width  = Math.min(2048, THREE.MathUtils.ceilPowerOfTwo(textW + 260));
  c.height = 130;

  ctx = c.getContext('2d');
  ctx.font = FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const tracking = 7;
  const chars = [...displayText];
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const totalW = widths.reduce((a,b)=>a+b,0) + tracking * (chars.length - 1);

  ctx.shadowColor = color;
  ctx.shadowBlur  = 28;
  ctx.fillStyle   = color;
  let x = (c.width - totalW) / 2;
  for (let i = 0; i < chars.length; i++) {
    ctx.fillText(chars[i], x + widths[i]/2, c.height/2);
    x += widths[i] + tracking;
  }
  ctx.shadowBlur = 12;
  x = (c.width - totalW) / 2;
  for (let i = 0; i < chars.length; i++) {
    ctx.fillText(chars[i], x + widths[i]/2, c.height/2);
    x += widths[i] + tracking;
  }
  ctx.shadowBlur = 5;
  ctx.fillStyle  = '#ffffff';
  x = (c.width - totalW) / 2;
  for (let i = 0; i < chars.length; i++) {
    ctx.fillText(chars[i], x + widths[i]/2, c.height/2);
    x += widths[i] + tracking;
  }

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  tex.minFilter  = THREE.LinearFilter;

  const mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const sprite = new THREE.Sprite(mat);
  const K = 0.021;
  sprite.scale.set(c.width * K, c.height * K, 1);
  sprite.userData.baseScale = new THREE.Vector2(c.width * K, c.height * K);
  return sprite;
}

function buildRing(list, radius, yAmp, color, phase) {
  const grp = new THREE.Group();
  list.forEach((txt, i) => {
    const sp = makeTextSprite(txt, color);
    const a  = (i / list.length) * Math.PI * 2 + phase;
    sp.position.set(
      Math.sin(a) * radius,
      Math.sin(a * 2.6) * yAmp,
      Math.cos(a) * radius
    );
    grp.add(sp);
  });
  scene.add(grp);
  return grp;
}

  g.bezierCurveTo(x - size/2, y + (size + topCurveHeight)/2, x, y + (size + topCurveHeight)/1.4, x, y + size);
  g.bezierCurveTo(x, y + (size + topCurveHeight)/1.4, x + size/2, y + (size + topCurveHeight)/2, x + size/2, y + topCurveHeight);

function startDrag(x, y) { isDragging = true; lastX = x; lastY = y; }
function moveDrag(x, y) {
  if (!isDragging) return;
  const dx = x - lastX, dy = y - lastY;
  lastX = x; lastY = y;
  camTheta -= dx * 0.006;
  camPhi    = THREE.MathUtils.clamp(camPhi - dy * 0.005, -0.55, 0.85);
}
function endDrag() { isDragging = false; }

canvas.addEventListener('pointerdown', e => {

  if (e.pointerType === 'touch') return;
  moveDrag(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', e => {
  if (e.pointerType === 'touch') return;
  endDrag();
});
canvas.addEventListener('pointercancel', () => endDrag());

canvas.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  e.preventDefault();
  startDrag(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

   14. ANIMACIÓN
   ============================================================ */
const clock   = new THREE.Clock();
const camDir  = new THREE.Vector3();
const worldPos = new THREE.Vector3();

function heartbeat(x) {
  return Math.exp(-Math.pow((x - 0.05) / 0.055, 2))
       + 0.55 * Math.exp(-Math.pow((x - 0.20) / 0.075, 2));
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  if (!isDragging) camTheta += dt * 0.13;

  camera.position.set(
    Math.sin(camTheta) * Math.cos(camPhi) * camRadius,
    Math.sin(camPhi) * camRadius,
    Math.cos(camTheta) * Math.cos(camPhi) * camRadius
  );
  camera.lookAt(0, 0, 0);
  camDir.copy(camera.position).normalize();

  const hb = heartbeat((t * 1.15) % 1);
  const beatScale = 1 + hb * 0.075;

  heartGroup.rotation.y += dt * 0.75;
  heartGroup.rotation.x  = Math.sin(t * 0.6) * 0.13;
  heartGroup.position.y  = Math.sin(t * 0.9) * 0.8;
  heartGroup.scale.setScalar(beatScale);

  ringA.rotation.z += dt * 0.55;
  ringA.position.y  = Math.sin(t * 0.8) * 1.5;
  ringB.rotation.z -= dt * 0.38;
  ringB.position.y  = Math.cos(t * 0.7) * 2.0;

  ringInner.rotation.y -= dt * 0.38;
  ringInner.rotation.x  = Math.sin(t * 0.4) * 0.06;
  ringOuter.rotation.y += dt * 0.26;
  ringOuter.rotation.x  = Math.cos(t * 0.35) * 0.05;

  const processRing = (grp) => {
    for (const sp of grp.children) {
      sp.getWorldPosition(worldPos);
      const d = worldPos.dot(camDir) / 32;
      const f = THREE.MathUtils.clamp((d + 1) / 2, 0, 1);
      const e = Math.pow(f, 2.4);
      sp.material.opacity = 0.06 + e * 0.94;
      const bs = sp.userData.baseScale;
      const k  = 0.78 + e * 0.45;
      sp.scale.set(bs.x * k, bs.y * k, 1);
    }
  };
  processRing(ringInner);
  processRing(ringOuter);

  for (const sp of floatingHearts) {
    sp.position.y += sp.userData.speed * dt;
    const wob = Math.sin(t * 1.6 + sp.userData.phase) * 0.35;
    sp.position.x += wob * dt;
    sp.position.z += Math.cos(t * 1.3 + sp.userData.phase) * 0.3 * dt;

    const p = (sp.position.y - FH_RANGE.minY) / (FH_RANGE.maxY - FH_RANGE.minY);
    const fadeIn  = THREE.MathUtils.clamp(p / 0.18, 0, 1);
    const fadeOut = THREE.MathUtils.clamp((1 - p) / 0.28, 0, 1);
    sp.material.opacity = 0.85 * fadeIn * fadeOut;

    const s = sp.userData.baseS * (1 + Math.sin(t * 3 + sp.userData.phase) * 0.08);
    sp.scale.set(s, s, 1);

    if (sp.position.y > FH_RANGE.maxY) resetFloatingHeart(sp, false);
  }

  wireMat.opacity  = 0.16 + Math.sin(t * 12.0) * 0.05;
  edgeMat.opacity  = 0.62 + Math.sin(t * 9.0)  * 0.16;
  coreMat.opacity  = 0.18 + Math.sin(t * 5.0)  * 0.04 + hb * 0.06;
  dotMat.opacity   = 0.72 + Math.sin(t * 7.0)  * 0.16;
  innerMat.opacity = 0.08 + hb * 0.10;

  glow.material.opacity = 0.42 + Math.sin(t * 2.0) * 0.08 + hb * 0.16;
  glow.scale.setScalar(40 + hb * 5);

  beam.material.opacity = 0.04 + Math.sin(t * 3.0) * 0.014;

  stars.rotation.y += dt * 0.02;
  stars.rotation.x  = Math.sin(t * 0.2) * 0.05;

  renderer.render(scene, camera);
}

animate();

const GAME_DURATION = 60000;   // 60 segundos

function startGame() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('gScore');
  const timeEl  = document.getElementById('gTime');
  const msgEl   = document.getElementById('gMsg');

  const W = 400, H = 400;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const state = {
    running: true,
    score: 0,
    player: { x: W/2, y: H - 42, targetX: W/2 },
    items: [],
    particles: [],
    spawnAcc: 0,
    spawnEvery: 640,
    lastT: performance.now(),
    endAt: performance.now() + GAME_DURATION,
    keys: {},
    hurtFlash: 0,
    bonusFlash: 0
  };

  function onKey(e, down) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = down;
    if (e.key === 'ArrowRight'|| e.key === 'd' || e.key === 'D') state.keys.right = down;
  }
  const kd = e => onKey(e, true);
  const ku = e => onKey(e, false);
  window.addEventListener('keydown', kd);
  window.addEventListener('keyup', ku);

  const playerHalf = 32;
  function pointerMove(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * W;
    state.player.targetX = Math.max(playerHalf, Math.min(W - playerHalf, x));
  }
  const pm = e => { e.preventDefault(); pointerMove(e.clientX); };
  const tm = e => {
    if (e.touches[0]) { e.preventDefault(); pointerMove(e.touches[0].clientX); }
  };
  canvas.addEventListener('pointermove', pm, { passive: false });
  canvas.addEventListener('pointerdown', pm, { passive: false });
  canvas.addEventListener('touchmove',  tm, { passive: false });
  canvas.addEventListener('touchstart', tm, { passive: false });

  gameCleanup = () => {
    state.running = false;
    window.removeEventListener('keydown', kd);
    window.removeEventListener('keyup', ku);
    canvas.removeEventListener('pointermove', pm);
    canvas.removeEventListener('pointerdown', pm);
    canvas.removeEventListener('touchmove', tm);
    canvas.removeEventListener('touchstart', tm);
  };

  // Tipos de ítem: 'good' (rosa +1), 'time' (oro +5s), 'broken' (azul -5s)
  function spawnItem() {
    const r = Math.random();
    let type;
    if (r < 0.16)       type = 'time';      // 16%  estrella dorada
    else if (r < 0.42)  type = 'broken';    // 26%  corazón roto
    else                type = 'good';      // 58%  corazón rosa

    state.items.push({
      x: 30 + Math.random() * (W - 60),
      y: -30,
      vy: 1.6 + Math.random() * 1.6,
      size: type === 'time' ? 26 : 20 + Math.random() * 8,
      type,
      rot: (Math.random() - 0.5) * 0.02,
      angle: 0
    });
  }

  function burst(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 3;
      state.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.5,
        life: 1, color
      });
    }
  }

  function drawHeart(x, y, size, color, broken, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    const s = size / 100;
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, -30);
    ctx.bezierCurveTo(-50, -80, -100, -20, 0, 50);
    ctx.bezierCurveTo(100, -20, 50, -80, 0, -30);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.fill();
    if (broken) {
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(0,0,0,0.65)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-6, -55); ctx.lineTo(4, -20);
      ctx.lineTo(-8, 6);   ctx.lineTo(6, 32);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Estrella dorada para el bono de tiempo
  function drawStar(x, y, size, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    const spikes = 5;
    const outerR = size;
    const innerR = size * 0.44;
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = (i * Math.PI) / spikes - Math.PI / 2;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else         ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 22;
    ctx.fill();

    // núcleo blanco
    ctx.shadowBlur = 8;
    ctx.globalAlpha = alpha * 0.65;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = (i % 2 === 0 ? outerR : innerR) * 0.55;
      const a = (i * Math.PI) / spikes - Math.PI / 2;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else         ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  const CATCH_RADIUS = 24;
  const CATCH_DY     = -14;

  function loop(now) {
    if (!state.running) return;

    const dt = Math.min((now - state.lastT) / 16.67, 3);
    state.lastT = now;

    const remain = Math.max(0, state.endAt - now);
    timeEl.textContent = Math.ceil(remain / 1000);

    if (state.keys.left)  state.player.targetX -= 5.2 * dt;
    if (state.keys.right) state.player.targetX += 5.2 * dt;
    state.player.targetX = Math.max(playerHalf, Math.min(W - playerHalf, state.player.targetX));
    state.player.x += (state.player.targetX - state.player.x) * 0.22 * dt;

    state.spawnAcc += dt * 16.67;
    if (state.spawnAcc > state.spawnEvery) {
      state.spawnAcc = 0;
      spawnItem();
    }

    // Colisiones
    for (let i = state.items.length - 1; i >= 0; i--) {
      const it = state.items[i];
      it.y += it.vy * dt;
      it.angle += it.rot * dt;

      const cx = state.player.x;
      const cy = state.player.y + CATCH_DY;
      const dx = it.x - cx;
      const dy = it.y - cy;
      const itR = it.size * 0.42;
      const limit = CATCH_RADIUS + itR;

      if (dx*dx + dy*dy < limit * limit) {
        if (it.type === 'broken') {
          // -5 segundos + flash rojo
          state.endAt -= 5000;
          state.hurtFlash = 1;
          burst(it.x, it.y, 'rgba(255,80,120,0.95)', 14);
        } else if (it.type === 'time') {
          // +5 segundos + flash dorado
          state.endAt += 5000;
          state.bonusFlash = 1;
          burst(it.x, it.y, 'rgba(255,210,80,0.98)', 18);
        } else {
          // +1 punto
          state.score += 1;
          scoreEl.textContent = state.score;
          burst(it.x, it.y, 'rgba(255,143,208,0.95)', 12);
        }
        state.items.splice(i, 1);
        continue;
      }

      if (it.y > H + 40) state.items.splice(i, 1);
    }

    // Partículas
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 0.08 * dt; p.life -= 0.025 * dt;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    // ---- Render ----
    ctx.clearRect(0, 0, W, H);

    // estrellas de fondo
    ctx.save();
    ctx.globalAlpha = 0.45;
    for (let i = 0; i < 22; i++) {
      const sx = (i * 73) % W;
      const sy = (i * 131 + now * 0.02) % H;
      ctx.fillStyle = 'rgba(120,240,255,0.35)';
      ctx.fillRect(sx, sy, 1.4, 1.4);
    }
    ctx.restore();

    // ítems
    for (const it of state.items) {
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.angle);
      if (it.type === 'broken') {
        drawHeart(0, 0, it.size, '#5f8fff', true, 0.92);
      } else if (it.type === 'time') {
        drawStar(0, 0, it.size * 0.95, '#ffd166', 0.95);
      } else {
        drawHeart(0, 0, it.size, '#ff4fa3', false, 0.95);
      }
      ctx.restore();
    }

    // partículas
    for (const p of state.particles) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // cesta
    drawHeart(state.player.x, state.player.y, 62, '#00e5ff', false, 0.95);

    // aura cesta
    ctx.save();
    ctx.globalAlpha = 0.5;
    const grad = ctx.createRadialGradient(
      state.player.x, state.player.y + 22, 4,
      state.player.x, state.player.y + 22, 40);
    grad.addColorStop(0, 'rgba(0,229,255,0.55)');
    grad.addColorStop(1, 'rgba(0,229,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(state.player.x - 50, state.player.y - 6, 100, 60);
    ctx.restore();

    // Flashes de feedback
    if (state.hurtFlash > 0) {
      ctx.fillStyle = `rgba(255,60,100,${state.hurtFlash * 0.38})`;
      ctx.fillRect(0, 0, W, H);
      state.hurtFlash = Math.max(0, state.hurtFlash - 0.028 * dt);
    }
    if (state.bonusFlash > 0) {
      ctx.fillStyle = `rgba(255,210,80,${state.bonusFlash * 0.32})`;
      ctx.fillRect(0, 0, W, H);
      state.bonusFlash = Math.max(0, state.bonusFlash - 0.028 * dt);
    }

    // Fin de partida
    if (remain <= 0) {
      state.running = false;
      let mensaje;
      if (state.score >= 45)      mensaje = `¡${state.score} puntos! Eres perfecta para mí, Neco`;
      else if (state.score >= 30) mensaje = `¡${state.score} puntos! Increíble, te amo más`;
      else if (state.score >= 15) mensaje = `${state.score} puntos. ¡Bien! Eres mi corazón`;
      else if (state.score >= 6)  mensaje = `${state.score} puntos. Sigue intentando, mi amor`;
      else                        mensaje = `${state.score} puntos. Igual te amo muchísimo`;

      msgEl.innerHTML = `${mensaje}<br><span style="opacity:.75;font-size:11px;letter-spacing:2px;">Toca la pantalla para volver a jugar</span>`;

      const restart = (e) => {
        if (e) e.preventDefault();
        canvas.removeEventListener('pointerdown', restart);
        canvas.removeEventListener('touchstart', restart);
        state.running = true;
        state.score = 0;
        state.items = [];
        state.particles = [];
        state.spawnAcc = 0;
        state.hurtFlash = 0;
        state.bonusFlash = 0;
        state.endAt = performance.now() + GAME_DURATION;
        state.lastT = performance.now();
        scoreEl.textContent = 0;
        timeEl.textContent  = 60;
        msgEl.textContent = 'Mueve la cesta con el dedo, mouse o ← →';
        loop(performance.now());
      };
      setTimeout(() => {
        canvas.addEventListener('pointerdown', restart, { passive: false });
        canvas.addEventListener('touchstart', restart, { passive: false });
      }, 400);
      return;
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
}
</script>
