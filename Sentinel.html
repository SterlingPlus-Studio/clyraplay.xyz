<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0f">
<title>SentinelCollection</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preload" as="font" type="font/ttf" href="https://raw.githubusercontent.com/SterlingPlus-Studio/clyraplay.xyz/main/Fuente/fuente.ttf" crossorigin>
<style>
  @font-face {
    font-family: 'ClyraPlay';
    src: url('https://raw.githubusercontent.com/SterlingPlus-Studio/clyraplay.xyz/main/Fuente/fuente.ttf') format('truetype');
    font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'ClyraPlay', -apple-system, sans-serif !important; }
  :root{
    --pink:#ec4899; --purple:#8b5cf6; --cyan:#06b6d4; --gold:#f59e0b;
    --bg:#0a0a0f; --surface:rgba(20,20,30,0.85); --surface-2:#191920; --surface-3:#212129;
    --border:rgba(255,255,255,0.07); --border-2:rgba(255,255,255,0.12);
    --text:#f5f5f7; --text-2:#c7c7d2; --muted:#8b8b9e;
    --comun:#ffb6c1; --rara:#fb7185; --epica:#a78bfa; --legendaria:#fbbf24; --exclusiva:#22d3ee;
    --sidebar-w: 240px;
    --radius: 10px; --radius-lg: 16px; --radius-xl: 20px;
    --shadow: 0 4px 20px rgba(0,0,0,.35);
    --shadow-glow: 0 4px 16px rgba(236,72,153,.25);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes shimmer { 0%{background-position: -200% 0} 100%{background-position: 200% 0} }

  html, body { overflow-x: hidden; }
  body {
    color: var(--text); background: var(--bg); min-height: 100vh;
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    transform: translateZ(0);
    will-change: transform;
    background-image:
      radial-gradient(ellipse 800px 600px at 12% 8%, rgba(236,72,153,.18), transparent 60%),
      radial-gradient(ellipse 700px 500px at 88% 12%, rgba(139,92,246,.22), transparent 60%),
      radial-gradient(ellipse 600px 500px at 50% 100%, rgba(6,182,212,.10), transparent 60%);
  }

  .screen { display: none; width: 100%; min-height: 100vh; }
  .screen.active { display: block; animation: fadeIn .25s ease; }

  /* ============ LOADING ============ */
  .loading-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .loading-spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: var(--pink);
    border-right-color: var(--purple);
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  .loading-label { font-size: 11px; color: var(--muted); letter-spacing: .25em; text-transform: uppercase; font-weight: 700; }

  /* ============ LOGIN / CODE ============ */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card {
    background: rgba(22,22,32,0.94);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 32px;
    width: 100%; max-width: 420px;
    box-shadow: var(--shadow);
  }
  .logo-hero { text-align: center; margin-bottom: 28px; }
  .logo-hero .l1 {
    font-size: 26px; font-weight: 900;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan), var(--pink));
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
    text-transform: uppercase; letter-spacing: -0.01em;
  }
  .logo-hero .l2 { font-size: 10px; color: var(--muted); margin-top: 8px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; }

  label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; letter-spacing: .05em; }

  input {
    width: 100%; padding: 12px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: rgba(0,0,0,.3);
    color: var(--text);
    font-size: 15px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }

  button {
    padding: 11px 18px;
    border-radius: var(--radius);
    border: none;
    background: var(--surface-2);
    color: var(--text);
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    transition: transform .18s, background .18s, border-color .18s, box-shadow .18s, color .18s, opacity .18s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  button.btn-primary {
    width: 100%; margin-top: 16px;
    padding: 13px 18px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff;
    box-shadow: 0 4px 14px rgba(236,72,153,.25);
  }
  button.btn-primary:hover:not(:disabled) {
    box-shadow: 0 6px 20px rgba(236,72,153,.4);
  }
  button.btn-secondary {
    width: 100%; margin-top: 8px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
  }
  button.btn-secondary:hover:not(:disabled) {
    background: rgba(255,255,255,.08);
    border-color: var(--border-2);
  }

  .msg {
    margin-top: 14px; padding: 11px 14px;
    border-radius: var(--radius);
    font-size: 13px; display: none;
    font-weight: 600;
    border: 1px solid;
    line-height: 1.4;
  }
  .msg.err { display: block; background: rgba(239,68,68,.1); color: #fca5a5; border-color: rgba(239,68,68,.25); }
  .msg.ok { display: block; background: rgba(16,185,129,.1); color: #6ee7b7; border-color: rgba(16,185,129,.25); }

  .code-inputs { display: flex; gap: 8px; justify-content: center; margin: 22px 0; }
  .code-inputs input {
    width: 46px; height: 56px;
    text-align: center;
    font-size: 22px; font-weight: 800;
    padding: 0;
  }

  /* ============ LAYOUT ============ */
  .layout { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    background: rgba(15,15,23,.95);
    border-right: 1px solid var(--border);
    position: fixed; top: 0; bottom: 0;
    padding: 20px 14px;
    z-index: 100;
    display: flex; flex-direction: column; gap: 16px;
  }

  .sidebar-brand {
    padding: 4px 8px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-brand .logo {
    font-size: 15px; font-weight: 900;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.01em;
  }

  .sidebar-user {
    display: flex; align-items: center; gap: 10px;
    padding: 10px;
    background: rgba(255,255,255,.03);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .avatar-sm {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    overflow: hidden; flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,.15);
  }
  .avatar-sm img { width: 100%; height: 100%; object-fit: cover; }
  .sidebar-user .info { flex: 1; min-width: 0; }
  .sidebar-user .uname {
    font-weight: 700; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }
  .sidebar-user .utag {
    color: var(--muted); font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .nav-group {
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(0,0,0,.2);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: var(--radius);
    padding: 6px;
  }

  .nav-item {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    border: none;
    justify-content: flex-start;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    margin: 0;
    text-align: left;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .nav-item.active {
    background: linear-gradient(135deg, rgba(236,72,153,.18), rgba(139,92,246,.18));
    color: var(--text);
    border-left: 3px solid var(--pink);
    padding-left: 9px;
  }
  .nav-item.active .icon { color: var(--pink); }

  .icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; flex-shrink: 0;
    color: inherit;
  }
  .icon svg { width: 100%; height: 100%; display: block; }

  .btn-logout {
    background: rgba(239,68,68,.08);
    border: 1px solid rgba(239,68,68,.25);
    color: #fca5a5;
    margin-top: auto;
    padding: 10px 12px;
    justify-content: flex-start;
    font-weight: 600;
    font-size: 13px;
  }
  .btn-logout:hover {
    background: rgba(239,68,68,.16);
    border-color: rgba(239,68,68,.4);
  }

  /* ============ MAIN ============ */
  .main {
    flex: 1;
    margin-left: var(--sidebar-w);
    padding: 24px 28px;
    width: 100%; max-width: 1280px;
    margin-right: auto;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn .2s ease; }

  .profile-header {
    display: flex; align-items: center; gap: 16px;
    background: rgba(22,22,32,0.92);
    padding: 18px 20px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
  }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800;
    border: 2px solid rgba(255,255,255,.2);
    overflow: hidden; flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(236,72,153,.25);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-info { flex: 1; min-width: 0; }
  .profile-info .name {
    font-size: 18px; font-weight: 800;
    letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .profile-info .tag {
    font-size: 13px; color: var(--muted);
    margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .section-title {
    font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 24px 0 12px 0;
    font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 3px; height: 12px;
    background: linear-gradient(180deg, var(--pink), var(--purple));
    border-radius: 3px;
    flex-shrink: 0;
  }
  #tab-collection .section-title,
  #tab-shop .section-title { margin-top: 0; margin-bottom: 14px; }

  .inline-logout-btn {
    display: none;
    width: 32px; height: 32px;
    margin: 0 0 0 auto;
    padding: 0;
    border-radius: 50%;
    background: rgba(239,68,68,.15);
    border: 1px solid rgba(239,68,68,.35);
    color: #fca5a5;
    align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, border-color .15s, transform .15s;
    flex-shrink: 0;
  }
  .inline-logout-btn:hover {
    background: rgba(239,68,68,.28);
    border-color: rgba(239,68,68,.55);
    transform: scale(.94);
  }
  .inline-logout-btn .icon,
  .inline-logout-btn .icon svg { width: 16px; height: 16px; }

  /* ============ STATS ============ */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat-box {
    background: rgba(22,22,32,0.92);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 8px;
    justify-content: center;
    min-height: 92px;
    position: relative;
    overflow: hidden;
    transition: border-color .2s;
  }
  .stat-box::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, currentColor, transparent 70%);
    opacity: .08;
    pointer-events: none;
  }
  .stat-box:hover { border-color: var(--border-2); }
  .stat-lbl {
    font-size: 11px; color: var(--text-2);
    text-transform: uppercase; font-weight: 700;
    letter-spacing: .06em;
    display: flex; align-items: center; gap: 8px;
    position: relative;
  }
  .stat-lbl .icon { width: 16px; height: 16px; }
  .stat-lbl .icon svg { width: 16px; height: 16px; }
  .stat-num {
    font-size: 28px; font-weight: 900;
    letter-spacing: -0.02em; line-height: 1;
    color: var(--text);
    position: relative;
  }

  /* ============ MINERALES ============ */
  .minerals-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: rgba(22,22,32,0.92);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .mineral-cell {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px;
    border-right: 1px solid var(--border);
    transition: background .15s;
  }
  .mineral-cell:hover { background: rgba(255,255,255,.02); }
  .mineral-cell:last-child { border-right: none; }
  .mineral-cell .icon { width: 22px; height: 22px; flex-shrink: 0; }
  .mineral-cell .icon svg { width: 22px; height: 22px; }
  .mineral-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .mineral-val {
    font-size: 17px; font-weight: 800;
    letter-spacing: -0.01em; line-height: 1.15;
    color: var(--text);
  }
  .mineral-lbl {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em; font-weight: 700;
  }

  /* ============ FILTROS / SUBTABS ============ */
  .filters {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .filters button {
    width: auto; margin: 0;
    padding: 6px 14px;
    border-radius: 100px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px; font-weight: 700;
    cursor: pointer; transition: background .15s, color .15s, border-color .15s;
  }
  .filters button:hover {
    background: rgba(255,255,255,.08);
    color: var(--text);
    border-color: var(--border-2);
  }
  .filters button.active {
    background: linear-gradient(135deg, rgba(236,72,153,.2), rgba(139,92,246,.2));
    color: var(--text);
    border-color: rgba(236,72,153,.4);
  }

  .subtabs {
    display: inline-flex; gap: 4px;
    margin-bottom: 16px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 5px;
    overflow: hidden;
  }
  .subtab {
    padding: 8px 18px;
    border-radius: 11px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background .15s, color .15s, box-shadow .15s;
    margin: 0; width: auto;
  }
  .subtab:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .subtab.active {
    background: linear-gradient(135deg, rgba(236,72,153,.28), rgba(139,92,246,.28));
    color: var(--text);
    box-shadow: 0 2px 8px rgba(236,72,153,.18);
  }

  .shop-header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .shop-header-row .subtabs { margin-bottom: 0; }
  .shop-header-row .shop-toggles { margin-bottom: 0; }
  .shop-header-row .filters { margin-bottom: 0; }

  /* ============ SHOP TOGGLES ============ */
  .shop-toggles {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .toggle-switch {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 16px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 100px;
    cursor: pointer;
    font-size: 12px; font-weight: 700;
    color: var(--muted);
    user-select: none;
    transition: background .15s, border-color .15s;
    margin: 0;
    text-transform: none;
    letter-spacing: 0;
  }
  .toggle-switch:hover {
    background: rgba(255,255,255,.06);
    border-color: var(--border-2);
  }
  .toggle-switch input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 0; height: 0;
    padding: 0; margin: 0;
  }
  .toggle-switch .toggle-slider {
    position: relative;
    width: 32px; height: 18px;
    background: rgba(255,255,255,.12);
    border-radius: 100px;
    transition: background .2s;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .toggle-switch .toggle-slider::before {
    content: '';
    position: absolute;
    top: 1px; left: 1px;
    width: 14px; height: 14px;
    background: var(--muted);
    border-radius: 50%;
    transition: transform .2s, background .2s;
  }
  .toggle-switch input:checked + .toggle-slider {
    background: linear-gradient(135deg, rgba(236,72,153,.35), rgba(139,92,246,.35));
    border-color: rgba(236,72,153,.4);
  }
  .toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(14px);
    background: #fff;
  }
  .toggle-switch input:checked ~ .toggle-label {
    color: var(--text);
  }

  /* ============ SEARCH ============ */
  .shop-search { position: relative; margin-bottom: 12px; }
  .shop-search input {
    padding-left: 42px; padding-right: 42px;
    font-size: 14px;
    background: rgba(0,0,0,.3);
    border-radius: 16px;
    border: 1px solid var(--border);
  }
  .shop-search input:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(139,92,246,.15);
  }
  .shop-search::before {
    content: '🔍';
    position: absolute;
    left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 14px;
    pointer-events: none; opacity: .65; z-index: 1;
  }
  .shop-search .clear-btn {
    position: absolute;
    right: 10px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px;
    margin: 0; padding: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: none;
    color: var(--muted);
    font-size: 13px; font-weight: 700;
    display: none;
    align-items: center; justify-content: center;
    z-index: 2;
  }
  .shop-search .clear-btn:hover { background: rgba(255,255,255,.16); color: var(--text); transform: translateY(-50%) scale(1.05); }
  .shop-search .clear-btn.visible { display: flex; }

  /* ============ GRID + CARDS ============ */
  .waifu-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  @media (max-width: 1100px) { .waifu-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 850px)  { .waifu-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 550px)  { .waifu-grid { grid-template-columns: repeat(2, 1fr); } }

  .waifu-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: transform .2s, border-color .2s, box-shadow .2s;
    position: relative;
    display: flex; flex-direction: column;
    content-visibility: auto;
    contain-intrinsic-size: auto 340px;
    contain: layout style;
  }
  .waifu-card:hover {
    transform: translateY(-3px);
    border-color: var(--border-2);
    box-shadow: var(--shadow);
  }

  .waifu-img {
    width: 100%; aspect-ratio: 3/4;
    background: #111;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    position: relative; overflow: hidden;
  }
  .waifu-img img {
    width: 100%; height: 100%;
    object-fit: cover; opacity: 0;
    transition: opacity .3s ease;
  }
  .waifu-img img.loaded { opacity: 1; }

  .waifu-badge {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,.88);
    padding: 4px 9px;
    border-radius: 100px;
    font-size: 11px; font-weight: 800;
    border: 1px solid var(--border-2);
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }

  .waifu-rarity-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(0,0,0,.88);
    padding: 4px 9px;
    border-radius: 100px;
    font-size: 10px; font-weight: 800;
    border: 1px solid var(--border-2);
    z-index: 2;
    text-transform: uppercase;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
    letter-spacing: .06em;
  }

  .waifu-seller-badge {

  .waifu-info {

  .btn-buy, .btn-sell, .btn-toggle {
    padding: 8px 10px;
    font-size: 11px; font-weight: 700;
    border-radius: 8px;
    cursor: pointer;

  .btn-sell {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    border-color: #fbbf24;
    color: #fff;
  }

  .btn-toggle.active {
    background: linear-gradient(135deg, #10b981, #059669);
    border-color: #34d399;
    color: #fff;
  }
  .btn-toggle.active:hover {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border-color: #f87171;
  }
  .btn-toggle.inactive {
    background: rgba(255,255,255,.08);
    border-color: var(--border-2);
    color: var(--muted);
  }
  .btn-toggle.inactive:hover {
    background: linear-gradient(135deg, #10b981, #059669);
    border-color: #34d399;
    color: #fff;
  }

  .waifu-card[data-r="comun"]      .waifu-rarity-badge { color: var(--comun); }
  .waifu-card[data-r="rara"]       .waifu-rarity-badge { color: var(--rara); }
  .waifu-card[data-r="epica"]      .waifu-rarity-badge { color: var(--epica); }
  .waifu-card[data-r="legendaria"] .waifu-rarity-badge { color: var(--legendaria); }
  .waifu-card[data-r="exclusiva"]  .waifu-rarity-badge { color: var(--exclusiva); }

  .waifu-card[data-r="legendaria"]:hover { border-color: rgba(251,191,36,.4); box-shadow: 0 4px 16px rgba(251,191,36,.15); }
  .waifu-card[data-r="exclusiva"]:hover  { border-color: rgba(34,211,238,.4); box-shadow: 0 4px 16px rgba(34,211,238,.15); }
  .waifu-card[data-r="epica"]:hover      { border-color: rgba(167,139,250,.4); box-shadow: 0 4px 16px rgba(167,139,250,.15); }

  /* ============ MOBILE NAV ============ */
  .mobile-nav {
    display: none;
    position: fixed;
    bottom: 12px; left: 12px; right: 12px;
    z-index: 300;
    background: rgba(18,18,28,.97);

  .mnav-btn .icon,
  .mnav-btn .icon svg { width: 20px; height: 20px; }

  /* ============================================================
     RESPONSIVE — Mobile base (≤768px)
     ============================================================ */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; padding: 16px 12px 90px; }
    .mobile-nav { display: flex; padding: 5px; bottom: 10px; left: 10px; right: 10px; border-radius: 18px; }
    .inline-logout-btn { display: flex; width: 28px; height: 28px; }
    .inline-logout-btn .icon,
    .inline-logout-btn .icon svg { width: 14px; height: 14px; }

    .profile-header { padding: 12px 14px; gap: 10px; border-radius: 12px; }

    .profile-info .tag { font-size: 11px; }

    .section-title { font-size: 10px; margin-top: 18px; margin-bottom: 10px; gap: 6px; }
    .section-title::before { height: 10px; width: 2px; }

    .filters { gap: 5px; margin-bottom: 12px; }

    .shop-search::before { left: 12px; font-size: 13px; }

    .waifu-grid { gap: 8px; }
    .waifu-info { padding: 8px 6px; min-height: 62px; gap: 6px; }

    .btn-buy, .btn-sell, .btn-toggle { padding: 7px 8px; font-size: 10px; border-radius: 7px; }
    .waifu-badge { font-size: 10px; padding: 3px 8px; top: 6px; right: 6px; }

    .waifu-seller-badge { font-size: 9px; padding: 3px 7px; bottom: 6px; left: 6px; }

    .mnav-btn { padding: 7px 3px; font-size: 9px; gap: 2px; border-radius: 14px; }

    .toast-container { bottom: 85px; }
    .toast { font-size: 12px; padding: 10px 18px; }
    .modal-box { padding: 20px; }
    .modal-title { font-size: 16px; }
    .modal-desc { font-size: 12px; margin-bottom: 14px; }
    .modal-input { padding: 10px; font-size: 15px; margin-bottom: 14px; }
    .modal-btn { padding: 10px 14px; font-size: 12px; }

    .login-card { padding: 24px 20px; }
    .logo-hero .l1 { font-size: 22px; }
    .logo-hero .l2 { font-size: 9px; }
    .code-inputs { gap: 6px; margin: 18px 0; }
    .code-inputs input { width: 40px; height: 48px; font-size: 18px; }
  }

  /* ============================================================
     RESPONSIVE — Stats + minerales compactos (≤640px)
     Aquí empieza la adaptación real del PERFIL:
       - stats en fila horizontal (icono+texto ← → número)
       - minerales en 3 columnas verticales compactas
     ============================================================ */
  @media (max-width: 640px) {
    /* --- Stats: fila horizontal compacta --- */
    .stats-grid {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .stat-box {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      padding: 12px 16px;
      gap: 12px;
      border-radius: 12px;
    }
    .stat-lbl {
      font-size: 12px;
      gap: 8px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .stat-lbl .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .stat-lbl .icon svg { width: 18px; height: 18px; }
    .stat-num {
      font-size: 20px;
      flex-shrink: 0;
      text-align: right;
    }

    /* --- Minerales: 3 columnas verticales compactas --- */
    .minerals-bar {
      grid-template-columns: repeat(3, 1fr);
      border-radius: 12px;
    }
    .mineral-cell {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 6px;
      gap: 5px;
      border-right: 1px solid var(--border);
      border-bottom: none;
    }
    .mineral-cell:last-child { border-right: none; }
    .mineral-cell .icon { width: 20px; height: 20px; }
    .mineral-cell .icon svg { width: 20px; height: 20px; }
    .mineral-info { align-items: center; gap: 2px; }
    .mineral-val { font-size: 14px; }
    .mineral-lbl { font-size: 8px; letter-spacing: .04em; }
  }

  /* ============================================================
     RESPONSIVE — Móvil pequeño (≤480px)
     ============================================================ */
  @media (max-width: 480px) {
    .main { padding: 12px 10px 85px; }

    .profile-header { padding: 10px 12px; gap: 8px; }
    .profile-info .name { font-size: 14px; }
    .profile-info .tag { font-size: 10px; }
    .avatar { width: 38px; height: 38px; font-size: 13px; border-width: 1.5px; }
    .inline-logout-btn { width: 26px; height: 26px; }
    .inline-logout-btn .icon,
    .inline-logout-btn .icon svg { width: 13px; height: 13px; }

    /* Stats aún más compactas */
    .stat-box { min-height: 48px; padding: 10px 14px; gap: 10px; }
    .stat-lbl { font-size: 11px; gap: 6px; }
    .stat-lbl .icon,
    .stat-lbl .icon svg { width: 16px; height: 16px; }
    .stat-num { font-size: 18px; }

    /* Minerales aún más compactos */
    .mineral-cell { padding: 10px 4px; gap: 4px; }
    .mineral-cell .icon,
    .mineral-cell .icon svg { width: 16px; height: 16px; }
    .mineral-val { font-size: 13px; }
    .mineral-lbl { font-size: 7px; letter-spacing: .02em; }

    .waifu-grid { gap: 6px; }
    .waifu-info { padding: 6px 5px; min-height: 54px; gap: 5px; }
    .waifu-name { font-size: 10px; }
    .btn-buy, .btn-sell, .btn-toggle { padding: 6px 6px; font-size: 9px; border-radius: 6px; }
    .waifu-badge { font-size: 9px; padding: 2px 6px; top: 5px; right: 5px; }
    .waifu-rarity-badge { font-size: 8px; padding: 2px 6px; bottom: 5px; right: 5px; letter-spacing: .04em; }
    .waifu-seller-badge { font-size: 8px; padding: 2px 6px; bottom: 5px; left: 5px; }

    .filters button { padding: 4px 9px; font-size: 10px; }
    .subtab { padding: 6px 11px; font-size: 11px; }

    .toast-container { bottom: 80px; }
    .toast { font-size: 11px; padding: 9px 16px; }

    .modal-box { padding: 18px; border-radius: 16px; }
    .modal-title { font-size: 15px; }
    .modal-btn { padding: 9px 12px; font-size: 11px; }

    .login-card { padding: 22px 18px; border-radius: 16px; }
    .logo-hero .l1 { font-size: 20px; }
    .code-inputs { gap: 5px; }
    .code-inputs input { width: 38px; height: 46px; font-size: 17px; }
  }

  /* ============================================================
     RESPONSIVE — Móvil muy pequeño (≤380px)
     ============================================================ */
  @media (max-width: 380px) {
    .profile-header { padding: 8px 10px; gap: 8px; }
    .avatar { width: 34px; height: 34px; font-size: 12px; }
    .profile-info .name { font-size: 13px; }
    .profile-info .tag { font-size: 9px; }
    .inline-logout-btn { width: 24px; height: 24px; }
    .inline-logout-btn .icon,
    .inline-logout-btn .icon svg { width: 12px; height: 12px; }

    .section-title { font-size: 9px; gap: 5px; margin-top: 16px; margin-bottom: 8px; }
    .section-title::before { height: 9px; width: 2px; }

    .stat-box { min-height: 44px; padding: 9px 12px; gap: 8px; }
    .stat-lbl { font-size: 10px; gap: 5px; }
    .stat-lbl .icon,
    .stat-lbl .icon svg { width: 14px; height: 14px; }
    .stat-num { font-size: 16px; }

    .mineral-cell { padding: 8px 3px; gap: 3px; }
    .mineral-cell .icon,
    .mineral-cell .icon svg { width: 14px; height: 14px; }
    .mineral-val { font-size: 12px; }
    .mineral-lbl { font-size: 7px; letter-spacing: 0; }

    .waifu-info { min-height: 50px; padding: 5px 4px; }
    .waifu-name { font-size: 9px; }
    .btn-buy, .btn-sell, .btn-toggle { padding: 5px 5px; font-size: 8px; }
    .waifu-badge, .waifu-rarity-badge { font-size: 8px; padding: 2px 5px; }
    .waifu-seller-badge { font-size: 7px; padding: 2px 5px; }

    .mobile-nav { padding: 4px; bottom: 8px; left: 8px; right: 8px; }
    .mnav-btn { font-size: 8px; padding: 6px 2px; }
    .mnav-btn .icon,
    .mnav-btn .icon svg { width: 16px; height: 16px; }

    .filters button { padding: 3px 8px; font-size: 9px; }
    .subtab { padding: 5px 9px; font-size: 10px; }
  }

  /* ============ MODALES ============ */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal-overlay.active { display: flex; animation: fadeIn .18s ease; }
  .modal-box {
    background: rgba(22,22,32,0.97);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-xl);
    padding: 24px;
    width: 100%; max-width: 400px;
    box-shadow: var(--shadow);
    animation: slideUp .22s ease;
  }
  .modal-title {
    font-size: 18px; font-weight: 800;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .modal-desc {
    font-size: 13px; color: var(--text-2);
    margin-bottom: 16px;
    line-height: 1.6;
    white-space: pre-line;
  }
  .modal-input {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: rgba(0,0,0,.3);
    color: var(--text);
    margin-bottom: 16px;
    font-size: 16px;
    outline: none;
  }
  .modal-input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(236,72,153,.15); }
  .modal-actions { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1;
    padding: 11px 16px;
    border-radius: var(--radius);
    font-size: 13px; font-weight: 700;
    cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s;
    border: none; margin: 0;
  }
  .modal-btn.cancel {
    background: rgba(255,255,255,.1);
    color: var(--text);
  }
  .modal-btn.cancel:hover { background: rgba(255,255,255,.16); }
  .modal-btn.accept {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff;
    box-shadow: 0 3px 10px rgba(236,72,153,.3);
  }
  .modal-btn.accept:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(236,72,153,.4); }

  /* ============ TOASTS ============ */
  .toast-container {
    position: fixed;
    bottom: 100px; left: 50%; transform: translateX(-50%);
    z-index: 2000;
    display: flex; flex-direction: column; gap: 10px;
    align-items: center;
    pointer-events: none;
    width: calc(100% - 32px); max-width: 400px;
  }
  .toast {
    background: rgba(22,22,32,0.97);
    border: 1px solid var(--border-2);
    padding: 11px 22px;
    border-radius: 100px;
    font-size: 13px; font-weight: 700;
    color: #fff;
    box-shadow: var(--shadow);
    animation: slideUp .28s ease;
    transition: opacity .25s, transform .25s;
    text-align: center;
  }
  .toast.error { border-color: #ef4444; color: #fca5a5; }
  .toast.success { border-color: #10b981; color: #6ee7b7; }

  @media (min-width: 769px) { .toast-container { bottom: 24px; } }
</style>
</head>
<body>

<div id="custom-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Título</div>
    <div class="modal-desc" id="modal-desc">Mensaje</div>
    <input type="number" id="modal-input" class="modal-input" style="display:none;">
    <div class="modal-actions">
      <button id="modal-cancel" class="modal-btn cancel">Cancelar</button>
      <button id="modal-accept" class="modal-btn accept">Aceptar</button>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>

<div id="screen-loading" class="screen active">
  <div class="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-label">Cargando</div>
  </div>
</div>

  <div class="login-wrap">

      <div class="logo-hero">
        <div class="l1">SentinelCollection</div>
        <div class="l2">◢ Web Edition ◣</div>

      <button id="btn-request" class="btn-primary">✨ Enviar código</button>
      <div id="msg-login" class="msg"></div>
    </div>
  </div>
</div>

<div id="screen-code" class="screen">
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-hero">
        <div class="l1">Verificación</div>
        <div class="l2">Ingresa el código</div>
      </div>
      <div class="code-inputs" id="code-inputs">
        <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
      </div>
      <button id="btn-verify" class="btn-primary">🔓 Verificar</button>
      <button id="btn-back" class="btn-secondary">Volver</button>
      <div id="msg-code" class="msg"></div>
    </div>
  </div>
</div>

<div id="screen-panel" class="screen">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="logo">SentinelCollection</div></div>
      <div class="sidebar-user">
        <div class="avatar-sm" id="sb-avatar">?</div>
        <div class="info">
          <div class="uname" id="sb-name">Cargando...</div>
          <div class="utag" id="sb-tag">—</div>
        </div>
      </div>

      <div class="nav-group">
        <button class="nav-item active" data-tab="profile"><span class="icon" data-icon="user"></span> Perfil</button>
        <button class="nav-item" data-tab="collection"><span class="icon" data-icon="package"></span> Mi Colección</button>
        <button class="nav-item" data-tab="shop"><span class="icon" data-icon="store"></span> Tienda</button>
      </div>

    </aside>

    <div class="main">

      <div id="tab-profile" class="tab-content active">
        <div class="profile-header">
          <div class="avatar" id="p-avatar">?</div>

            <span class="icon" data-icon="logout"></span>
          </button>

        <div class="section-title">Resumen</div>

          <div class="stat-box" style="color:var(--gold)">
            <div class="stat-lbl"><span class="icon" data-icon="coin"></span> Monedas</div>
            <div class="stat-num" id="stat-coins" style="color:var(--gold)">0</div>
          </div>
          <div class="stat-box" style="color:var(--pink)">
            <div class="stat-lbl"><span class="icon" data-icon="layers"></span> Personajes totales</div>
            <div class="stat-num" id="stat-waifus" style="color:var(--pink)">0</div>
          </div>

              <div class="mineral-lbl">Hierro</div>
            </div>
          </div>
          <div class="mineral-cell">

            <div class="mineral-info">
              <div class="mineral-val" id="stat-oro">0</div>
              <div class="mineral-lbl">Oro</div>
            </div>
          </div>
          <div class="mineral-cell">

      else if (scope === 'shop') renderShop();

  // ================= ICONOS 3D =================
  let __icSeq = 0;
  function ico(name, size = 18) {
    const u = 'i3d' + (++__icSeq) + '_';
    const L = (id, c1, c2, dir) => {
      if (dir === 'h') return `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
      if (dir === 'r') return `<radialGradient id="${id}" cx=".5" cy=".35" r=".78"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient>`;
      return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
    };
    const D = (s) => `<defs>${s}</defs>`;
    let b = '';

    switch (name) {
      case 'user': b = D(L(u+'a','#c4b5fd','#7c3aed') + L(u+'b','#ddd6fe','#a78bfa')) + `<circle cx="12" cy="7.5" r="3.8" fill="url(#${u}b)"/><path d="M4.5 21v-1.5a4.5 4.5 0 0 1 4.5-4.5h6a4.5 4.5 0 0 1 4.5 4.5V21z" fill="url(#${u}a)"/>`; break;
      case 'package': b = D(L(u+'a','#d4a373','#a16207') + L(u+'b','#fcd34d','#ca8a04') + L(u+'c','#fde68a','#eab308','h')) + `<path d="M3 7l9-4 9 4v10l-9 4-9-4z" fill="url(#${u}a)"/><path d="M3 7l9 4 9-4M12 11v10" stroke="url(#${u}b)" stroke-width="1.5" fill="none"/><path d="M7.5 5L16.5 9" stroke="url(#${u}c)" stroke-width="1.5"/>`; break;
      case 'store': b = D(L(u+'a','#a78bfa','#6d28d9') + L(u+'b','#fcd34d','#f59e0b')) + `<path d="M4 9l1-5h14l1 5v3a2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 1-2 2 2 2 0 0 1-2-2z" fill="url(#${u}b)"/><rect x="4" y="11" width="16" height="10" fill="url(#${u}a)"/><rect x="9" y="14" width="6" height="7" fill="url(#${u}b)"/>`; break;
      case 'logout': b = D(L(u+'a','#fca5a5','#dc2626') + L(u+'b','#fecaca','#f87171')) + `<path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5" fill="none" stroke="url(#${u}b)" stroke-width="2.2" stroke-linecap="round"/><path d="M10 12h11M16 7l5 5-5 5" stroke="url(#${u}a)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`; break;
      case 'coin': b = D(L(u+'a','#fef3c7','#b45309','r') + L(u+'b','#fde047','#d97706')) + `<circle cx="12" cy="12" r="9" fill="url(#${u}a)"/><circle cx="12" cy="12" r="6" fill="url(#${u}b)"/><circle cx="9" cy="9" r="2" fill="#fff" opacity=".55"/>`; break;
      case 'gear': b = D(L(u+'a','#d1d5db','#4b5563','r') + L(u+'b','#f3f4f6','#9ca3af')) + `<circle cx="12" cy="12" r="8" fill="url(#${u}a)"/><circle cx="12" cy="12" r="3.5" fill="url(#${u}b)"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="url(#${u}a)" stroke-width="2.5" stroke-linecap="round"/>`; break;
      case 'medal': b = D(L(u+'a','#fef3c7','#d97706','r') + L(u+'b','#fbbf24','#b45309') + L(u+'c','#fcd34d','#f59e0b')) + `<path d="M8 14l-2 8 6-3 6 3-2-8" fill="url(#${u}b)"/><circle cx="12" cy="9" r="6.5" fill="url(#${u}a)" stroke="url(#${u}b)" stroke-width=".7"/><circle cx="12" cy="9" r="3.5" fill="url(#${u}c)" opacity=".85"/>`; break;
      case 'diamond': b = D(L(u+'a','#67e8f9','#0891b2') + L(u+'b','#cffafe','#06b6d4')) + `<path d="M6 3h12l4 6-10 12L2 9z" fill="url(#${u}a)"/><path d="M2 9h20M12 21L8 9l4-6 4 6z" stroke="url(#${u}b)" stroke-width=".8" fill="none"/><path d="M9 9l3-6 3 6z" fill="url(#${u}b)" opacity=".6"/>`; break;
      case 'layers': b = D(L(u+'a','#c4b5fd','#7c3aed') + L(u+'b','#a78bfa','#6d28d9') + L(u+'c','#e9d5ff','#8b5cf6')) + `<path d="M12 3l9 5-9 5-9-5z" fill="url(#${u}c)"/><path d="M3 12l9 5 9-5" stroke="url(#${u}b)" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M3 17l9 5 9-5" stroke="url(#${u}a)" stroke-width="2" fill="none" stroke-linejoin="round"/>`; break;
      case 'sparkles': b = D(L(u+'a','#a5f3fc','#06b6d4') + L(u+'b','#e9d5ff','#8b5cf6')) + `<path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z" fill="url(#${u}a)"/><path d="M19 3v3M20.5 4.5h-3" stroke="url(#${u}b)" stroke-width="1.5" stroke-linecap="round"/><path d="M5 18v2M4 19h2" stroke="url(#${u}b)" stroke-width="1.2" stroke-linecap="round"/>`; break;
      default: b = `<circle cx="12" cy="12" r="9" fill="#8b5cf6"/>`;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${b}</svg>`;
  }

  function hydrateIcons() {
    document.querySelectorAll('[data-icon]').forEach(el => {
      el.innerHTML = ico(el.dataset.icon, 18);
    });
  }
  hydrateIcons();

  // ================= CACHÉ PERSISTENTE =================
  const IMG_CACHE_DB = 'jinx_imgs_v1';
  const IMG_CACHE_STORE = 'data';
  let imgDBPromise = null;

  function getImgDB() {
    if (imgDBPromise) return imgDBPromise;
    imgDBPromise = new Promise((resolve) => {
      try {
        if (typeof indexedDB === 'undefined') return resolve(null);
        const req = indexedDB.open(IMG_CACHE_DB, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(IMG_CACHE_STORE)) {
            req.result.createObjectStore(IMG_CACHE_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch { resolve(null); }
    });
    return imgDBPromise;
  }

  async function idbGetImg(key) {
    const db = await getImgDB();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(IMG_CACHE_STORE, 'readonly');
        const req = tx.objectStore(IMG_CACHE_STORE).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      } catch { resolve(null); }
    });
  }

  async function idbSetImg(key, dataUrl) {
    const db = await getImgDB();
    if (!db) return;
    try {
      const tx = db.transaction(IMG_CACHE_STORE, 'readwrite');
      tx.objectStore(IMG_CACHE_STORE).put(dataUrl, key);
    } catch {}
  }

  // ================= LAZY LOAD =================
  const imageCache = new Map();
  const pendingRequests = new Map();

  function loadImageForContainer(imgContainer, attempt = 1) {
    if (!imgContainer || !imgContainer.isConnected) return;
    const imgTag = imgContainer.querySelector('img');
    if (imgTag && imgTag.classList.contains('loaded')) return;

    const type = imgContainer.dataset.type || 'waifu';
    const name = imgContainer.dataset.name;
    if (!name) return;

    getLocalImage(type, name).then(url => {
      if (!imgContainer.isConnected) return;
      if (url) {
        let img = imgContainer.querySelector('img');
        if (!img) {
          img = document.createElement('img');
          img.decoding = 'async';
          img.loading = 'lazy';
          img.draggable = false;
          img.alt = '';
          imgContainer.insertBefore(img, imgContainer.firstChild);
        }
        if (img.getAttribute('src') !== url) img.src = url;
        if (img.complete && img.naturalWidth > 0) img.classList.add('loaded');
        else img.onload = () => img.classList.add('loaded');
      } else if (attempt < 3 && !imageCache.has(`${type}_${name}`)) {
        setTimeout(() => loadImageForContainer(imgContainer, attempt + 1), 2000 * attempt);
      }
    });
  }

  const imageLoadObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      imageLoadObserver.unobserve(entry.target);
      loadImageForContainer(entry.target);
    }
  }, { rootMargin: '1000px 0px' });

  async function getLocalImage(type, target) {
    const cacheKey = `${type}_${target}`;

    if (imageCache.has(cacheKey)) return imageCache.get(cacheKey);
    if (pendingRequests.has(cacheKey)) return pendingRequests.get(cacheKey);

    const promise = (async () => {
      try {
        const stored = await idbGetImg(cacheKey);
        if (stored) { imageCache.set(cacheKey, stored); return stored; }
      } catch {}

      return new Promise((resolve) => {
        const reqId  = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        const reqRef = ref(db, 'image_requests/'  + reqId);
        const resRef = ref(db, 'image_responses/' + reqId);

        let done = false, unsub = null;

        const finish = (url, cacheNull) => {
          if (done) return;
          done = true;
          try { unsub && unsub(); } catch {}
          if (url) { imageCache.set(cacheKey, url); idbSetImg(cacheKey, url); }
          else if (cacheNull) { imageCache.set(cacheKey, null); }
          set(resRef, null).catch(() => {});
          resolve(url || null);
        };

        unsub = onValue(resRef, (snap) => {
          const res = snap.val();
          if (!res) return;
          if (res.success && res.base64) finish(`data:image/${res.mime};base64,${res.base64}`, false);
          else finish(null, true);
        });

        set(reqRef, { type, target, createdAt: Date.now() }).catch(() => finish(null, false));
        setTimeout(() => finish(null, false), 8000);
      });
    })();

    pendingRequests.set(cacheKey, promise);
    try { return await promise; } finally { pendingRequests.delete(cacheKey); }
  }

  async function requestSync(uid) {
    await set(ref(db, 'sync_requests/' + uid), { userId: uid, createdAt: Date.now() }).catch(()=>{});
  }

  function observeImg(el) {
    imageLoadObserver.observe(el);
  }

  onAuthStateChanged(auth, (user) => {

      signInAnonymously(auth).catch(e => { setMsg('msg-login', e.message, 'err'); show('screen-login'); });

  $('btn-request').onclick = async () => {
    const raw = $('identifier').value.trim();
    if (!raw) return setMsg('msg-login', 'Escribe tu usuario.', 'err');
    $('btn-request').disabled = true;
    $('btn-request').textContent = 'Enviando...';
    setMsg('msg-login', '');
    try {
      const username = raw.replace(/^@+/, '').toLowerCase();
      currentRequestId = (crypto.randomUUID && crypto.randomUUID()) || ('r_' + Date.now());
      await set(ref(db, 'login_requests/' + currentRequestId), {
        owner: auth.currentUser.uid, username, status: 'pending', createdAt: Date.now()
      });
      show('screen-code');
      $('code-inputs').querySelector('input').focus();
      listenToRequest();
    } catch (e) {
      setMsg('msg-login', "Error: " + e.message, 'err');
      $('btn-request').disabled = false;
      $('btn-request').textContent = '✨ Enviar código';
    }
  };

  function listenToRequest() {
    if (unsubRequest) unsubRequest();
    unsubRequest = onValue(ref(db, 'login_requests/' + currentRequestId), (snap) => {
      const d = snap.val();
      if (!d) return;
      if (d.status === 'ready') setMsg('msg-code', '✅ Código enviado.', 'ok');
      if (d.status === 'error') {
        setMsg('msg-code', '❌ ' + d.error, 'err');
        $('btn-verify').disabled = false;
      }
      if (d.status === 'verified' && d.customToken) {
        unsubRequest();
        $('btn-verify').textContent = 'Ingresando...';
        signInWithCustomToken(auth, d.customToken).catch(e => {
          setMsg('msg-code', '❌ ' + e.message, 'err'); $('btn-verify').disabled = false;
        });
      }
    });
  }

  $('btn-verify').onclick = async () => {
    const code = [...$('code-inputs').querySelectorAll('input')].map(i => i.value).join('');
    if (code.length !== 6) return setMsg('msg-code', 'Faltan dígitos.', 'err');
    $('btn-verify').disabled = true;
    setMsg('msg-code', '⏳ Verificando...', 'ok');
    try {
      await update(ref(db, 'login_requests/' + currentRequestId), { userCode: code, status: 'checking' });
      setMsg('msg-code', '⏳ Esperando validación...', 'ok');
    } catch (e) {
      setMsg('msg-code', 'Error: ' + e.message, 'err'); $('btn-verify').disabled = false;
    }
  };

  $('btn-back').onclick = () => {
    if (unsubRequest) unsubRequest();
    currentRequestId = null; show('screen-login');
  };

  // ================= DASHBOARD =================
  function loadDashboard(uid) {
    show('screen-panel');

    getLocalImage('avatar', uid).then(dataUrl => {
      const imgHtml = dataUrl ? `<img src="${dataUrl}" decoding="async" alt="">` : '?';
      $('p-avatar').innerHTML = imgHtml;
      $('sb-avatar').innerHTML = imgHtml;
    });

    if (unsubProfile) unsubProfile();
    unsubProfile = onValue(ref(db, 'users/' + uid + '/profile'), (snap) => {
      const p = snap.val() || {};
      const fullName = [p.firstName, p.lastName].filter(Boolean).join(' ') || 'Usuario';
      const tagText = p.username ? '@' + p.username : 'ID: ' + uid.slice(0, 8) + '…';
      const tagFull = p.username ? '@' + p.username : uid;
      $('p-name').textContent = fullName;
      $('p-tag').textContent = tagText;
      $('p-tag').title = tagFull;
      $('sb-name').textContent = fullName;
      $('sb-tag').textContent = tagText;
      $('sb-tag').title = tagFull;
    });

    if (unsubGameData) unsubGameData();
    unsubGameData = onValue(ref(db, 'users/' + uid + '/gameData'), (snap) => {
      const data = snap.val() || {};

      if ((!data.waifusList || !data.skinsList) && !syncRequested) {
        syncRequested = true;
        myGameData = data;
        requestSync(uid);
        return;
      }

      if (data.updatedAt && data.updatedAt === lastGameDataUpdatedAt) return;
      lastGameDataUpdatedAt = data.updatedAt;
      myGameData = data;

      $('stat-coins').textContent   = NUM_FMT.format(Number(data.coins || 0));
      $('stat-waifus').textContent  = NUM_FMT.format(Number(data.waifusTotal || 0));
      $('stat-unique').textContent  = NUM_FMT.format(Number(data.waifusUnique || 0));
      const m = data.minerals || {};
      $('stat-hierro').textContent  = NUM_FMT.format(Number(m.hierro || 0));
      $('stat-oro').textContent     = NUM_FMT.format(Number(m.oro || 0));
      $('stat-diamante').textContent= NUM_FMT.format(Number(m.diamante || 0));

      markCollectionDirty();
      markShopDirty();
    });

    if (unsubShopData) unsubShopData();
    unsubShopData = onValue(ref(db, 'shop_data'), (snap) => {
      const data = snap.val() || { waifus: [], skins: [] };
      if (data.updatedAt && data.updatedAt === lastShopUpdatedAt) return;
      lastShopUpdatedAt = data.updatedAt;
      shopData = data;
      markShopDirty();
    });
  }

  // ================= RENDER COLECCIÓN =================
  function renderCollection(force = false) {
    const grid = $('collection-grid');
    const filters = $('coll-filters-wrap');
    if (!grid) return;

    if (!force && !$('tab-collection').classList.contains('active')) {
      collectionDirty = true;
      return;
    }
    collectionDirty = false;

    cleanupGridObservers(grid);
    grid.innerHTML = '';

    if (collectionTab === 'waifus') {
      filters.style.display = '';

      let list = myGameData?.waifusList || [];
      if (currentFilter !== 'all') list = list.filter(w => w.rarity === currentFilter);

      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted); font-size:13px;">🎴 No hay personajes en esta categoría.</div>`;
        return;
      }

      const order = { exclusiva:0, legendaria:1, epica:2, rara:3, comun:4 };
      list = [...list].sort((a,b) => (order[a.rarity]||9) - (order[b.rarity]||9));

      const frag = document.createDocumentFragment();
      list.forEach(w => {
        const card = document.createElement('div');
        card.className = 'waifu-card';
        card.dataset.r = w.rarity;

        const imgDiv = document.createElement('div');
        imgDiv.className = 'waifu-img';
        imgDiv.dataset.name = w.name;
        imgDiv.dataset.type = 'waifu';

        const badge = document.createElement('div');
        badge.className = 'waifu-badge';
        badge.textContent = `x${w.count}`;
        imgDiv.appendChild(badge);

        const rBadge = document.createElement('div');
        rBadge.className = 'waifu-rarity-badge';
        rBadge.textContent = w.rarity;
        imgDiv.appendChild(rBadge);

        const infoDiv = document.createElement('div');
        infoDiv.className = 'waifu-info';
        const sellLabel = w.count > 1 ? `💰 Vender 1 (de ${w.count})` : '💰 Vender';
        infoDiv.innerHTML = `
          <div class="waifu-name" title="${w.name}">${w.name}</div>
          <button class="btn-sell" data-name="${w.name}" data-rarity="${w.rarity}" data-count="${w.count}">${sellLabel}</button>
        `;

        card.appendChild(imgDiv);
        card.appendChild(infoDiv);
        frag.appendChild(card);
        observeImg(imgDiv);
      });
      grid.appendChild(frag);

      grid.querySelectorAll('.btn-sell').forEach(btn => {
        btn.onclick = async () => {
          const name = btn.dataset.name;
          const count = parseInt(btn.dataset.count, 10) || 1;
          const countMsg = count > 1 ? `\n\n📦 Tienes ${count} copias. Solo se venderá 1.` : '';

          showModal(
            '💰 Vender personaje',
            `¿Por cuánto quieres vender a ${name}?${countMsg}\n(Mínimo: 100 · Máximo: 3500)`,
            true, 'Ej: 500', '100',
            async (priceStr) => {
              if (!priceStr) return;
              const price = parseInt(priceStr, 10);
              if (isNaN(price) || price < 100 || price > 3500) {
                return showToast('⚠️ Precio inválido. Debe estar entre 100 y 3500.', 'error');
              }
              btn.disabled = true;
              btn.textContent = '...';

              const reqId = 'sell_' + Date.now();
              const reqRef = ref(db, 'sell_waifu_requests/' + reqId);
              const unsub = onValue(reqRef, (snap) => {
                const res = snap.val();
                if (!res) return;
                if (res.status === 'done') {
                  unsub();
                  const copiesLeft = (typeof res.copiesAfter === 'number') ? res.copiesAfter : Math.max(0, count - 1);
                  const soldName = res.waifuName || name;
                  showToast(copiesLeft > 0
                    ? `✅ ¡Vendiste 1 ${soldName}! Quedan ${copiesLeft}`
                    : `🎉 ¡${soldName} vendida! (última copia)`, 'success');
                  requestSync(auth.currentUser.uid);
                } else if (res.status === 'error') {
                  unsub();
                  showToast('❌ ' + res.error, 'error');
                  btn.disabled = false;
                  btn.textContent = count > 1 ? `💰 Vender 1 (de ${count})` : '💰 Vender';
                }
              });

              await set(reqRef, {
                userId: auth.currentUser.uid,
                userName: $('p-name').textContent,
                username: $('p-tag').textContent.replace('@',''),
                waifuName: name, price, status: 'pending', createdAt: Date.now()
              }).catch(err => {
                showToast('❌ ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = count > 1 ? `💰 Vender 1 (de ${count})` : '💰 Vender';
                unsub();
              });
            }
          );
        };
      });

    } else if (collectionTab === 'skins') {
      filters.style.display = 'none';
      const skinsList = myGameData?.skinsList || [];

      if (skinsList.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted); font-size:13px;">🎨 No tienes skins todavía.<br><span style="font-size:12px;">Compra algunas en la tienda.</span></div>`;
        return;
      }

      const frag = document.createDocumentFragment();
      skinsList.forEach(s => {
        const isActive = s.active !== false;
        const card = document.createElement('div');
        card.className = 'waifu-card';
        card.dataset.r = s.rarity;

        const imgDiv = document.createElement('div');
        imgDiv.className = 'waifu-img';
        imgDiv.dataset.name = s.id;
        imgDiv.dataset.type = 'skin';

        const rBadge = document.createElement('div');
        rBadge.className = 'waifu-rarity-badge';
        rBadge.textContent = s.rarity;
        imgDiv.appendChild(rBadge);

        const infoDiv = document.createElement('div');
        infoDiv.className = 'waifu-info';
        infoDiv.innerHTML = `
          <div class="waifu-name" title="${s.waifuName}">${s.waifuName}</div>
          <button class="btn-toggle ${isActive ? 'active' : 'inactive'}" data-id="${s.id}" data-active="${isActive}">
            ${isActive ? '✓ Desactivar' : '○ Activar'}
          </button>
        `;

        card.appendChild(imgDiv);
        card.appendChild(infoDiv);
        frag.appendChild(card);
        observeImg(imgDiv);
      });
      grid.appendChild(frag);

      grid.querySelectorAll('.btn-toggle').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          const isActive = btn.dataset.active === 'true';
          btn.disabled = true;
          btn.textContent = '...';

          const reqId = 'tog_' + Date.now();
          const reqRef = ref(db, 'skin_toggle_requests/' + reqId);
          const unsub = onValue(reqRef, (snap) => {
            const res = snap.val();
            if (!res) return;
            if (res.status === 'done') {
              unsub(); requestSync(auth.currentUser.uid); set(reqRef, null).catch(()=>{});
            } else if (res.status === 'error') {
              unsub();
              showToast('❌ ' + res.error, 'error');
              btn.disabled = false;
              btn.textContent = isActive ? '✓ Desactivar' : '○ Activar';
              set(reqRef, null).catch(()=>{});
            }
          });

          await set(reqRef, {
            userId: auth.currentUser.uid, skinId: id, activate: !isActive, status: 'pending', createdAt: Date.now()
          });
        };
      });
    }
  }

  // ================= TIENDA =================
  function renderShop(force = false) {
    const grid = $('shop-grid');
    if (!grid) return;

    if (!force && !$('tab-shop').classList.contains('active')) {
      shopDirty = true;
      return;
    }
    shopDirty = false;

    cleanupGridObservers(grid);
    grid.innerHTML = '';

    const currentUserId = auth.currentUser?.uid;
    const owned = getOwnedSets();

    let items = shopFilter === 'waifus' ? (shopData.waifus || []) : (shopData.skins || []);

    items = items.filter(item => {
      if (hideMine && String(item.sellerId) === String(currentUserId)) return false;
      if (shopFilter === 'skins') {
        if (owned.skins.has(String(item.id))) return false;
      } else {
        if (hideOwned && owned.waifus.has(String(item.name).toLowerCase())) return false;
      }
      return true;
    });

    const q = shopSearchQuery.trim().toLowerCase();
    if (q) {
      items = items.filter(item => String(item.waifuName || item.name || '').toLowerCase().includes(q));
    }

    if (items.length === 0) {
      let emptyMsg;
      if (q) {
        emptyMsg = `🔍 Sin resultados para "<b>${escapeHtml(shopSearchQuery)}</b>".<br><span style="font-size:12px;">Prueba con otro nombre.</span>`;
      } else {
        const activeFilters = [];
        if (hideMine) activeFilters.push('tus ventas');
        if (shopFilter === 'skins') activeFilters.push('skins ya poseídas');
        else if (hideOwned) activeFilters.push('personajes ya poseídos');
        const filterNote = activeFilters.length
          ? `<br><span style="font-size:12px;">(Ocultando ${activeFilters.join(' y ')})</span>`
          : '';
        emptyMsg = `🛒 No hay artículos disponibles.${filterNote}`;
      }
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted); font-size:13px;">${emptyMsg}</div>`;
      return;
    }

    const frag = document.createDocumentFragment();
    items.forEach(item => {
      const isSkin = shopFilter === 'skins';
      const nameToImg = isSkin ? item.id : item.name;

      const card = document.createElement('div');
      card.className = 'waifu-card';
      card.dataset.r = item.rarity;

      const imgDiv = document.createElement('div');
      imgDiv.className = 'waifu-img';
      imgDiv.dataset.name = nameToImg;
      imgDiv.dataset.type = isSkin ? 'skin' : 'waifu';

      const priceBadge = document.createElement('div');
      priceBadge.className = 'waifu-badge';
      priceBadge.style.color = 'var(--gold)';
      priceBadge.textContent = `🪙 ${item.price}`;
      imgDiv.appendChild(priceBadge);

      const rBadge = document.createElement('div');
      rBadge.className = 'waifu-rarity-badge';
      rBadge.textContent = item.rarity;
      imgDiv.appendChild(rBadge);

      const sellerBadge = document.createElement('div');
      sellerBadge.className = 'waifu-seller-badge';
      sellerBadge.textContent = item.seller;
      sellerBadge.title = `Vendedor: ${item.seller}`;
      imgDiv.appendChild(sellerBadge);

      const infoDiv = document.createElement('div');
      infoDiv.className = 'waifu-info shop-info';
      infoDiv.innerHTML = `
        <div class="waifu-name" title="${item.waifuName || item.name}">${item.waifuName || item.name}${isSkin ? ' · Skin' : ''}</div>
        <button class="btn-buy" data-id="${item.id}" data-type="${isSkin ? 'skin' : 'waifu'}" data-name="${item.waifuName || item.name}" data-price="${item.price}">🛍️ Comprar</button>
      `;

      card.appendChild(imgDiv);
      card.appendChild(infoDiv);
      frag.appendChild(card);
      observeImg(imgDiv);
    });
    grid.appendChild(frag);

    grid.querySelectorAll('.btn-buy').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const type = btn.dataset.type;
        const name = btn.dataset.name;
        const price = Number(btn.dataset.price);

        if (!myGameData || myGameData.coins < price) return showToast('⚠️ No tienes suficientes monedas.', 'error');

        showModal('🛍️ Confirmar compra', `¿Comprar a ${name} por ${price} monedas?`, false, '', '', async () => {
          btn.disabled = true;
          btn.textContent = '...';

          const reqId = 'buy_' + Date.now();
          const resRef = ref(db, 'shop_buy_requests/' + reqId);
          const unsub = onValue(resRef, (snap) => {
            const res = snap.val();
            if (!res) return;
            if (res.status === 'done') {
              unsub();
              showToast('🎉 ¡Compra exitosa!', 'success');
              requestSync(auth.currentUser.uid);
              const card = btn.closest('.waifu-card');
              if (card) {
                card.style.transition = 'opacity .3s, transform .3s';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                setTimeout(() => {
                  try { cleanupGridObservers(card.parentElement); } catch {}
                  card.remove();
                }, 300);
              }
              set(resRef, null).catch(()=>{});
            } else if (res.status === 'error') {
              unsub();
              showToast('❌ ' + res.error, 'error');
              btn.disabled = false;
              btn.textContent = '🛍️ Comprar';
              set(resRef, null).catch(()=>{});
            }
          });

          await set(resRef, {
            itemId: id, itemName: name, type, price,
            buyerId: auth.currentUser.uid, buyerName: $('p-name').textContent,
            buyerUsername: $('p-tag').textContent.replace('@',''),
            status: 'pending', createdAt: Date.now()
          }).catch(err => {
            showToast('❌ ' + err.message, 'error');
            btn.disabled = false; btn.textContent = '🛍️ Comprar'; unsub();
          });
        });
      };
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  // ================= NAVEGACIÓN =================
  function switchTab(tab) {
    if (tab === 'collection' && collectionDirty) renderCollection(true);
    if (tab === 'shop' && shopDirty) renderShop(true);

    document.querySelectorAll('.nav-item[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.mnav-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    const el = $('tab-' + tab);
    if (el) el.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.querySelectorAll('.nav-item[data-tab], .mnav-btn[data-tab]').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.tab);
  });

  document.querySelectorAll('#coll-subtabs .subtab').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#coll-subtabs .subtab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      collectionTab = btn.dataset.coll;
      renderCollection(true);
    };
  });

  document.querySelectorAll('#coll-filters button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#coll-filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.f;
      renderCollection(true);
    };
  });

  document.querySelectorAll('#shop-filters .subtab').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#shop-filters .subtab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      shopFilter = btn.dataset.shop;

      $('toggle-hide-owned-wrap').style.display = shopFilter === 'skins' ? 'none' : '';

      renderShop(true);
    };
  });

  // ================= TOGGLES DE FILTROS EN TIENDA =================
  $('toggle-hide-mine').addEventListener('change', (e) => {
    hideMine = e.target.checked;
    markShopDirty();
  });

  $('toggle-hide-owned').addEventListener('change', (e) => {
    hideOwned = e.target.checked;
    markShopDirty();
  });

  const shopSearchInput = $('shop-search');
  const shopSearchClear = $('shop-search-clear');
  let searchDebounceTimer = null;

  shopSearchInput.addEventListener('input', (e) => {
    shopSearchQuery = e.target.value;
    if (shopSearchQuery.length > 0) shopSearchClear.classList.add('visible');
    else shopSearchClear.classList.remove('visible');

    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => markShopDirty(), 200);
  });

  shopSearchClear.addEventListener('click', () => {
    shopSearchInput.value = '';
    shopSearchQuery = '';
    shopSearchClear.classList.remove('visible');
    shopSearchInput.focus();
    clearTimeout(searchDebounceTimer);
    markShopDirty();
  });

  // ================= LOGOUT =================
  function doLogout() {
    try {
      if (unsubProfile) unsubProfile();
      if (unsubGameData) unsubGameData();
      if (unsubShopData) unsubShopData();
      imageCache.clear();
      pendingRequests.clear();
    } catch (e) {}
    signOut(auth).catch(() => {}).finally(() => window.location.reload());
  }

  $('btn-logout').onclick = doLogout;
  document.querySelectorAll('.inline-logout-btn[data-logout]').forEach(btn => { btn.onclick = doLogout; });

  const codeInputs = [...$('code-inputs').querySelectorAll('input')];
  codeInputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
      if (inp.value && i < codeInputs.length - 1) codeInputs[i + 1].focus();
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !inp.value && i > 0) codeInputs[i - 1].focus();
    });
  });
</script>
</body>
</html>
