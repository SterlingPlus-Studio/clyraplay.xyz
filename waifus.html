<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0f">
<title>Jinx Waifus Web</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preload" as="font" type="font/ttf" href="https://raw.githubusercontent.com/SterlingPlus-Studio/clyraplay.xyz/main/Fuente/fuente.ttf" crossorigin>
<style>
  @font-face {
    font-family: 'ClyraPlay';
    src: url('https://raw.githubusercontent.com/SterlingPlus-Studio/clyraplay.xyz/main/Fuente/fuente.ttf') format('truetype');
    font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'ClyraPlay', -apple-system, sans-serif !important; }
  :root{
    --pink:#ec4899; --purple:#8b5cf6; --cyan:#06b6d4; --gold:#f59e0b;
    --bg:#0a0a0f; --surface:rgba(20,20,30,0.85);
    --border:rgba(255,255,255,0.07); --border-2:rgba(255,255,255,0.12);
    --text:#f5f5f7; --text-2:#c7c7d2; --muted:#8b8b9e;
    --comun:#ffb6c1; --rara:#fb7185; --epica:#a78bfa; --legendaria:#fbbf24; --exclusiva:#22d3ee;
    --sidebar-w: 260px;
    --radius: 14px; --radius-lg: 20px;
    --shadow: 0 4px 20px rgba(0,0,0,.35);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes shimmer { 0%{background-position: -200% 0} 100%{background-position: 200% 0} }

  html, body { overflow-x: hidden; }
  body {
    color: var(--text); background: var(--bg); min-height: 100vh;
  }
  /* ⚡ Gradientes como pseudo-elemento fixed (evita jank de background-attachment:fixed) */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      radial-gradient(ellipse 800px 600px at 12% 8%, rgba(236,72,153,.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 88% 12%, rgba(139,92,246,.20), transparent 60%);
  }

  .screen { display: none; width: 100%; min-height: 100vh; }
  .screen.active { display: block; animation: slideUp .35s ease; }

  .loading-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .loading-spinner { width: 64px; height: 64px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--pink); border-right-color: var(--purple); animation: spin 1s linear infinite; margin-bottom: 20px; }
  
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 440px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: var(--shadow); }
  .logo-hero { text-align: center; margin-bottom: 24px; }
  .logo-hero .l1 { font-size: 34px; font-weight: 900; background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan), var(--pink)); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 4s linear infinite; text-transform: uppercase; }
  
  label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
  input { width: 100%; padding: 13px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: rgba(0,0,0,.3); color: var(--text); font-size: 15px; outline: none; }
  input:focus { border-color: var(--purple); }
  button { width: 100%; padding: 14px; border: none; border-radius: var(--radius); background: linear-gradient(135deg, var(--pink), var(--purple)); color: white; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 16px; display: flex; align-items: center; justify-content: center; transition: .2s; }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(236,72,153,.3); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { margin-top: 14px; padding: 12px; border-radius: var(--radius); font-size: 13px; display: none; font-weight: 600; }
  .msg.err { display: block; background: rgba(239,68,68,.1); color: #fca5a5; }
  .msg.ok { display: block; background: rgba(16,185,129,.1); color: #6ee7b7; }
  .code-inputs { display: flex; gap: 6px; justify-content: center; margin: 20px 0; }
  .code-inputs input { width: 46px; height: 58px; text-align: center; font-size: 22px; font-weight: 800; padding: 0; }

  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: var(--sidebar-w); background: rgba(15,15,23,.95); border-right: 1px solid var(--border); position: fixed; top: 0; bottom: 0; padding: 20px 14px; z-index: 100; display: flex; flex-direction: column; }
  .sidebar-brand { padding: 0 10px 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .sidebar-brand .logo { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, var(--pink), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(255,255,255,.03); border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--border); }
  .sidebar-user .avatar-sm { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--pink), var(--purple)); display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; }
  .sidebar-user .avatar-sm img { width: 100%; height: 100%; object-fit: cover; }
  .sidebar-user .info { flex: 1; min-width: 0; }
  .sidebar-user .uname { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .sidebar-user .utag { color: var(--muted); font-size: 11px; }

  .nav-group { display: flex; flex-direction: column; gap: 2px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.06); border-radius: var(--radius); padding: 6px; margin-bottom: 20px; }
  .nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 8px; background: transparent; color: var(--text-2); border: none; justify-content: flex-start; font-size: 14px; cursor: pointer; font-weight: 600; transition: .2s; margin: 0; }
  .nav-item:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .nav-item.active { background: linear-gradient(135deg, rgba(236,72,153,.15), rgba(139,92,246,.15)); color: var(--text); border-left: 3px solid var(--pink); }
  
  .icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0; }

  .btn-logout { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; margin-top: auto; border-radius: var(--radius); padding: 12px 14px; }
  .btn-logout:hover { background: rgba(239,68,68,.2); }

  .main { flex: 1; margin-left: var(--sidebar-w); padding: 24px 30px; width: 100%; max-width: 1200px; margin-right: auto; }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: slideUp .3s ease; }
  
  .profile-header { display: flex; align-items: center; gap: 16px; background: var(--surface); padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--pink), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; border: 2px solid rgba(255,255,255,.2); overflow: hidden; flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-info { flex: 1; min-width: 0; }
  .profile-info .name { font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .profile-info .tag { font-size: 14px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .section-title { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 24px 0 12px 0; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; width: 3px; height: 12px; background: linear-gradient(180deg, var(--pink), var(--purple)); border-radius: 3px; flex-shrink: 0; }
  #tab-collection .section-title, #tab-shop .section-title { margin-top: 0; margin-bottom: 10px; }

  .inline-logout-btn {
    display: none;
    width: 34px; height: 34px;
    margin: 0 0 0 auto; padding: 0;
    border-radius: 50%;
    background: rgba(239,68,68,.15);
    border: 1px solid rgba(239,68,68,.4);
    color: #fca5a5;
    align-items: center; justify-content: center;
    cursor: pointer; transition: all .2s;
    flex-shrink: 0;
  }
  .inline-logout-btn:hover { background: rgba(239,68,68,.3); border-color: rgba(239,68,68,.65); }
  .inline-logout-btn .icon { width: 18px; height: 18px; }
  .inline-logout-btn .icon svg { width: 18px; height: 18px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .stat-num { font-size: 24px; font-weight: 800; color: var(--text); }
  .stat-lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 600; display: flex; align-items: center; gap: 6px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .filters button { width: auto; margin: 0; padding: 6px 14px; border-radius: 100px; background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; transition: all .2s; }
  .filters button:hover, .filters button.active { background: rgba(255,255,255,.1); color: var(--text); border-color: var(--border-2); }

  .subtabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .subtab { flex: 1; padding: 10px; border-radius: var(--radius); background: rgba(255,255,255,.03); border: 1px solid var(--border); color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; transition: .2s; text-align: center; }
  .subtab:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .subtab.active { background: linear-gradient(135deg, rgba(236,72,153,.2), rgba(139,92,246,.2)); color: var(--text); border-color: var(--pink); }

  .shop-search { position: relative; margin-bottom: 12px; }
  .shop-search input { padding-left: 42px; padding-right: 42px; font-size: 14px; }
  .shop-search::before { content: '🔍'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; pointer-events: none; opacity: .65; z-index: 1; }
  .shop-search .clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; margin: 0; padding: 0; border-radius: 50%; background: rgba(255,255,255,.08); color: var(--muted); font-size: 14px; font-weight: 700; display: none; align-items: center; justify-content: center; z-index: 2; }
  .shop-search .clear-btn:hover { background: rgba(255,255,255,.16); color: var(--text); }
  .shop-search .clear-btn.visible { display: flex; }

  .waifu-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  @media (max-width: 1100px) { .waifu-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 850px) { .waifu-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 550px) { .waifu-grid { grid-template-columns: repeat(2, 1fr); } }

  /* ⚡ Optimización: content-visibility salta paint de tarjetas fuera de pantalla */
  .waifu-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; transition: border-color .2s, box-shadow .2s;
    position: relative; display: flex; flex-direction: column;
    content-visibility: auto;
    contain-intrinsic-size: auto 350px;
  }
  .waifu-card:hover { border-color: var(--border-2); box-shadow: var(--shadow); }
  
  .waifu-img { width: 100%; aspect-ratio: 3/4; background: #111; display: flex; align-items: center; justify-content: center; color: var(--muted); position: relative; overflow: hidden; }
  .waifu-img img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s ease; }
  .waifu-img img.loaded { opacity: 1; }
  
  .waifu-badge { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.85); padding: 4px 8px; border-radius: 100px; font-size: 11px; font-weight: 800; border: 1px solid var(--border-2); z-index: 2; }
  .waifu-rarity-badge { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.85); padding: 4px 8px; border-radius: 100px; font-size: 10px; font-weight: 800; border: 1px solid var(--border-2); z-index: 2; text-transform: uppercase; letter-spacing: 0.5px; }
  .waifu-seller-badge { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,.85); color: var(--gold); padding: 4px 8px; border-radius: 100px; font-size: 10px; font-weight: 700; border: 1px solid var(--border-2); z-index: 2; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .waifu-info { padding: 8px 6px; text-align: center; border-top: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; gap: 8px; min-height: 64px; flex-shrink: 0; }
  .waifu-info.shop-info { min-height: 64px; justify-content: space-between; padding: 8px 6px; }

  .waifu-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; line-height: 1.2; display: block; }
  
  .btn-buy, .btn-sell, .btn-toggle { padding: 8px; font-size: 11px; margin-top: 0; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; width: 100%; transition: border-color .2s, background .2s; border: 1.5px solid transparent; }
  .btn-buy { background: linear-gradient(135deg, #10b981, #059669); border-color: #34d399; }
  .btn-buy:hover { border-color: #6ee7b7; }
  .btn-sell { background: linear-gradient(135deg, #f59e0b, #d97706); border-color: #fbbf24; }
  .btn-sell:hover { border-color: #fcd34d; }
  .btn-toggle.active { background: linear-gradient(135deg, #10b981, #059669); border-color: #34d399; }
  .btn-toggle.inactive { background: rgba(255,255,255,.1); border-color: var(--border-2); color: var(--muted); }
  .btn-toggle.inactive:hover { background: linear-gradient(135deg, #10b981, #059669); border-color: #34d399; color: white; }

  .waifu-card[data-r="comun"] .waifu-rarity-badge { color: var(--comun); }
  .waifu-card[data-r="rara"] .waifu-rarity-badge { color: var(--rara); }
  .waifu-card[data-r="epica"] .waifu-rarity-badge { color: var(--epica); }
  .waifu-card[data-r="legendaria"] .waifu-rarity-badge { color: var(--legendaria); }
  .waifu-card[data-r="exclusiva"] .waifu-rarity-badge { color: var(--exclusiva); }

  .mobile-nav {
    display: none;
    position: fixed; bottom: 14px; left: 14px; right: 14px; z-index: 300;
    background: rgba(18,18,28,.98);
    border: 1px solid var(--border-2);
    border-radius: 22px; padding: 6px; gap: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  .mnav-btn { flex: 1; margin: 0; padding: 8px 4px; border-radius: 16px; background: transparent; color: var(--muted); border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 700; cursor: pointer; transition: all .2s; letter-spacing: .3px; }
  .mnav-btn .icon { width: 22px; height: 22px; }
  .mnav-btn .icon svg { width: 22px; height: 22px; }
  .mnav-btn.active { background: linear-gradient(135deg, rgba(236,72,153,.22), rgba(139,92,246,.22)); color: var(--text); }

  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; padding: 20px 15px; padding-bottom: 110px; }
    .mobile-nav { display: flex; }
    .inline-logout-btn { display: flex; }
    .profile-info .name { font-size: 18px; }
    .avatar { width: 60px; height: 60px; font-size: 22px; }
  }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-overlay.active { display: flex; animation: slideUp .2s ease; }
  .modal-box { background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 400px; box-shadow: var(--shadow); }
  .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; background: linear-gradient(90deg, var(--pink), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .modal-desc { font-size: 14px; color: var(--text-2); margin-bottom: 16px; line-height: 1.5; white-space: pre-line; }
  .modal-input { width: 100%; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); background: rgba(0,0,0,.3); color: var(--text); margin-bottom: 16px; font-size: 16px; }
  .modal-input:focus { border-color: var(--pink); outline: none; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-btn { flex: 1; padding: 12px; border-radius: var(--radius); font-weight: 700; cursor: pointer; border: none; transition: .2s; margin: 0; font-size: 14px; }
  .modal-btn.cancel { background: rgba(255,255,255,.1); color: var(--text); }
  .modal-btn.cancel:hover { background: rgba(255,255,255,.2); }
  .modal-btn.accept { background: linear-gradient(135deg, var(--pink), var(--purple)); color: white; }
  .modal-btn.accept:hover { transform: translateY(-1px); }

  .toast-container { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; width: calc(100% - 32px); max-width: 380px; }
  .toast { background: var(--surface); border: 1px solid var(--border-2); padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 700; color: white; box-shadow: var(--shadow); animation: slideUp .3s ease; transition: opacity .3s, transform .3s; text-align: center; }
  .toast.error { border-color: #ef4444; color: #fca5a5; }
  .toast.success { border-color: #10b981; color: #6ee7b7; }

  @media (min-width: 769px) { .toast-container { bottom: 20px; } }
</style>
</head>
<body>

<div id="custom-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Título</div>
    <div class="modal-desc" id="modal-desc">Mensaje</div>
    <input type="number" id="modal-input" class="modal-input" style="display:none;">
    <div class="modal-actions">
      <button id="modal-cancel" class="modal-btn cancel">Cancelar</button>
      <button id="modal-accept" class="modal-btn accept">Aceptar</button>
    </div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>

<div id="screen-loading" class="screen active">
  <div class="loading-screen">
    <div class="loading-spinner"></div>
    <div style="font-size:12px; color:var(--muted); letter-spacing:2px;">CARGANDO...</div>
  </div>
</div>

<div id="screen-login" class="screen">
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-hero"><div class="l1">Jinx Waifus</div><div class="l2" style="text-align:center;font-size:11px;color:var(--muted);margin-top:6px;">◢ Web Edition ◣</div></div>
      <label for="identifier">@Usuario de Telegram</label>
      <input id="identifier" type="text" placeholder="@tunombre" autocomplete="username">
      <button id="btn-request">Enviar código</button>
      <div id="msg-login" class="msg"></div>
    </div>
  </div>
</div>

<div id="screen-code" class="screen">
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-hero"><div class="l1">Verificación</div></div>
      <div class="code-inputs" id="code-inputs">
        <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
      </div>
      <button id="btn-verify">Verificar</button>
      <button id="btn-back" style="background:rgba(255,255,255,.05); margin-top:8px;">Volver</button>
      <div id="msg-code" class="msg"></div>
    </div>
  </div>
</div>

<div id="screen-panel" class="screen">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="logo">Jinx Waifus</div></div>
      <div class="sidebar-user">
        <div class="avatar-sm" id="sb-avatar">?</div>
        <div class="info">
          <div class="uname" id="sb-name">Cargando...</div>
          <div class="utag" id="sb-tag">—</div>
        </div>
      </div>
      
      <div class="nav-group">
        <button class="nav-item active" data-tab="profile"><span class="icon" data-icon="user"></span> Perfil</button>
        <button class="nav-item" data-tab="collection"><span class="icon" data-icon="package"></span> Mi Colección</button>
        <button class="nav-item" data-tab="shop"><span class="icon" data-icon="store"></span> Tienda</button>
      </div>

      <button class="nav-item btn-logout" id="btn-logout"><span class="icon" data-icon="logout"></span> Cerrar Sesión</button>
    </aside>

    <div class="main">
      
      <div id="tab-profile" class="tab-content active">
        <div class="profile-header">
          <div class="avatar" id="p-avatar">?</div>
          <div class="profile-info">
            <div class="name" id="p-name">Cargando...</div>
            <div class="tag" id="p-tag">—</div>
          </div>
          <button class="inline-logout-btn" data-logout aria-label="Cerrar sesión" title="Cerrar sesión">
            <span class="icon" data-icon="logout"></span>
          </button>
        </div>

        <div class="section-title">Estadísticas de Jinx</div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-num" id="stat-coins" style="color:var(--gold)">0</div>

  function scheduleRender(scope) {
    if (rafPending[scope]) return;
    rafPending[scope] = true;
    requestAnimationFrame(() => {
      rafPending[scope] = false;
      if (scope === 'collection') renderCollection();
      else if (scope === 'shop') renderShop();
    });
  }
  function markCollectionDirty() { collectionDirty = true; scheduleRender('collection'); }
  function markShopDirty() { shopDirty = true; scheduleRender('shop'); }

    container.appendChild(toast);

  // ================= ICONOS 3D =================
  let __icSeq = 0;
  function ico(name, size = 18) {
    const u = 'i3d' + (++__icSeq) + '_';
    const L = (id, c1, c2, dir) => {
      if (dir === 'h') return `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
      if (dir === 'r') return `<radialGradient id="${id}" cx=".5" cy=".35" r=".78"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient>`;
      return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
    };
    const D = (s) => `<defs>${s}</defs>`;
    let b = '';

    switch (name) {
      case 'user': b = D(L(u+'a','#c4b5fd','#7c3aed') + L(u+'b','#ddd6fe','#a78bfa')) + `<circle cx="12" cy="7.5" r="3.8" fill="url(#${u}b)"/><path d="M4.5 21v-1.5a4.5 4.5 0 0 1 4.5-4.5h6a4.5 4.5 0 0 1 4.5 4.5V21z" fill="url(#${u}a)"/>`; break;
      case 'package': b = D(L(u+'a','#d4a373','#a16207') + L(u+'b','#fcd34d','#ca8a04') + L(u+'c','#fde68a','#eab308','h')) + `<path d="M3 7l9-4 9 4v10l-9 4-9-4z" fill="url(#${u}a)"/><path d="M3 7l9 4 9-4M12 11v10" stroke="url(#${u}b)" stroke-width="1.5" fill="none"/><path d="M7.5 5L16.5 9" stroke="url(#${u}c)" stroke-width="1.5"/>`; break;
      case 'store': b = D(L(u+'a','#a78bfa','#6d28d9') + L(u+'b','#fcd34d','#f59e0b')) + `<path d="M4 9l1-5h14l1 5v3a2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 1-2 2 2 2 0 0 1-2-2z" fill="url(#${u}b)"/><rect x="4" y="11" width="16" height="10" fill="url(#${u}a)"/><rect x="9" y="14" width="6" height="7" fill="url(#${u}b)"/>`; break;
      case 'logout': b = D(L(u+'a','#fca5a5','#dc2626') + L(u+'b','#fecaca','#f87171')) + `<path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5" fill="none" stroke="url(#${u}b)" stroke-width="2.2" stroke-linecap="round"/><path d="M10 12h11M16 7l5 5-5 5" stroke="url(#${u}a)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`; break;
      case 'coin': b = D(L(u+'a','#fef3c7','#b45309','r') + L(u+'b','#fde047','#d97706')) + `<circle cx="12" cy="12" r="9" fill="url(#${u}a)"/><circle cx="12" cy="12" r="6" fill="url(#${u}b)"/><circle cx="9" cy="9" r="2" fill="#fff" opacity=".55"/>`; break;
      case 'gear': b = D(L(u+'a','#d1d5db','#4b5563','r') + L(u+'b','#f3f4f6','#9ca3af')) + `<circle cx="12" cy="12" r="8" fill="url(#${u}a)"/><circle cx="12" cy="12" r="3.5" fill="url(#${u}b)"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="url(#${u}a)" stroke-width="2.5" stroke-linecap="round"/>`; break;
      case 'medal': b = D(L(u+'a','#fef3c7','#d97706','r') + L(u+'b','#fbbf24','#b45309') + L(u+'c','#fcd34d','#f59e0b')) + `<path d="M8 14l-2 8 6-3 6 3-2-8" fill="url(#${u}b)"/><circle cx="12" cy="9" r="6.5" fill="url(#${u}a)" stroke="url(#${u}b)" stroke-width=".7"/><circle cx="12" cy="9" r="3.5" fill="url(#${u}c)" opacity=".85"/>`; break;
      case 'diamond': b = D(L(u+'a','#67e8f9','#0891b2') + L(u+'b','#cffafe','#06b6d4')) + `<path d="M6 3h12l4 6-10 12L2 9z" fill="url(#${u}a)"/><path d="M2 9h20M12 21L8 9l4-6 4 6z" stroke="url(#${u}b)" stroke-width=".8" fill="none"/><path d="M9 9l3-6 3 6z" fill="url(#${u}b)" opacity=".6"/>`; break;
      case 'layers': b = D(L(u+'a','#c4b5fd','#7c3aed') + L(u+'b','#a78bfa','#6d28d9') + L(u+'c','#e9d5ff','#8b5cf6')) + `<path d="M12 3l9 5-9 5-9-5z" fill="url(#${u}c)"/><path d="M3 12l9 5 9-5" stroke="url(#${u}b)" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M3 17l9 5 9-5" stroke="url(#${u}a)" stroke-width="2" fill="none" stroke-linejoin="round"/>`; break;
      case 'sparkles': b = D(L(u+'a','#a5f3fc','#06b6d4') + L(u+'b','#e9d5ff','#8b5cf6')) + `<path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z" fill="url(#${u}a)"/><path d="M19 3v3M20.5 4.5h-3" stroke="url(#${u}b)" stroke-width="1.5" stroke-linecap="round"/><path d="M5 18v2M4 19h2" stroke="url(#${u}b)" stroke-width="1.2" stroke-linecap="round"/>`; break;
      default: b = `<circle cx="12" cy="12" r="9" fill="#8b5cf6"/>`;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${b}</svg>`;
  }

  function hydrateIcons() {
    document.querySelectorAll('[data-icon]').forEach(el => {
      el.innerHTML = ico(el.dataset.icon, 18);
    });
  }
  hydrateIcons();

  // ================= CACHÉ PERSISTENTE (IndexedDB) =================
  const IMG_CACHE_DB = 'jinx_imgs_v1';
  const IMG_CACHE_STORE = 'data';
  let imgDBPromise = null;

  function getImgDB() {
    if (imgDBPromise) return imgDBPromise;
    imgDBPromise = new Promise((resolve) => {
      try {
        if (typeof indexedDB === 'undefined') return resolve(null);
        const req = indexedDB.open(IMG_CACHE_DB, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(IMG_CACHE_STORE)) {
            req.result.createObjectStore(IMG_CACHE_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch { resolve(null); }
    });
    return imgDBPromise;
  }

  async function idbGetImg(key) {
    const db = await getImgDB();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(IMG_CACHE_STORE, 'readonly');
        const req = tx.objectStore(IMG_CACHE_STORE).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      } catch { resolve(null); }
    });
  }

  async function idbSetImg(key, dataUrl) {
    const db = await getImgDB();
    if (!db) return;
    try {
      const tx = db.transaction(IMG_CACHE_STORE, 'readwrite');
      tx.objectStore(IMG_CACHE_STORE).put(dataUrl, key);
    } catch {}
  }

  // ================= LAZY LOAD & CACHE =================
  const imageCache = new Map();
  const pendingRequests = new Map();

  function loadImageForContainer(imgContainer, attempt = 1) {
    if (!imgContainer || !imgContainer.isConnected) return;
    const imgTag = imgContainer.querySelector('img');
    if (imgTag && imgTag.classList.contains('loaded')) return;

    const type = imgContainer.dataset.type || 'waifu';
    const name = imgContainer.dataset.name;
    if (!name) return;

    getLocalImage(type, name).then(url => {
      if (!imgContainer.isConnected) return;
      if (url) {
        let img = imgContainer.querySelector('img');
        if (!img) {
          img = document.createElement('img');
          img.decoding = 'async';
          imgContainer.insertBefore(img, imgContainer.firstChild);
        }
        if (img.getAttribute('src') !== url) img.src = url;
        if (img.complete && img.naturalWidth > 0) img.classList.add('loaded');
        else img.onload = () => img.classList.add('loaded');
      } else if (attempt < 3 && !imageCache.has(`${type}_${name}`)) {
        setTimeout(() => loadImageForContainer(imgContainer, attempt + 1), 2000 * attempt);
      }
    });
  }

  const imageLoadObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) loadImageForContainer(entry.target); });
  }, { rootMargin: '800px' });

  const imageUnloadObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) return;
      const imgTag = entry.target.querySelector('img');
      if (imgTag && imgTag.classList.contains('loaded')) imgTag.remove();
    });
  }, { rootMargin: '1600px' });

  async function getLocalImage(type, target) {
    const cacheKey = `${type}_${target}`;

    if (imageCache.has(cacheKey)) return imageCache.get(cacheKey);
    if (pendingRequests.has(cacheKey)) return pendingRequests.get(cacheKey);

    const promise = (async () => {
      try {
        const stored = await idbGetImg(cacheKey);
        if (stored) { imageCache.set(cacheKey, stored); return stored; }
      } catch {}

      return new Promise((resolve) => {
        const reqId  = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        const reqRef = ref(db, 'image_requests/'  + reqId);
        const resRef = ref(db, 'image_responses/' + reqId);

        let done = false, unsub = null;

        const finish = (url, cacheNull) => {
          if (done) return;
          done = true;
          try { unsub && unsub(); } catch {}
          if (url) { imageCache.set(cacheKey, url); idbSetImg(cacheKey, url); }
          else if (cacheNull) { imageCache.set(cacheKey, null); }
          set(resRef, null).catch(() => {});
          resolve(url || null);
        };

        unsub = onValue(resRef, (snap) => {
          const res = snap.val();
          if (!res) return;
          if (res.success && res.base64) finish(`data:image/${res.mime};base64,${res.base64}`, false);
          else finish(null, true);
        });

        set(reqRef, { type, target, createdAt: Date.now() }).catch(() => finish(null, false));
        setTimeout(() => finish(null, false), 8000);
      });
    })();

    pendingRequests.set(cacheKey, promise);
    try { return await promise; } finally { pendingRequests.delete(cacheKey); }
  }

  async function requestSync(uid) {
    await set(ref(db, 'sync_requests/' + uid), { userId: uid, createdAt: Date.now() }).catch(()=>{});
  }

  function observeImg(el) {
    imageLoadObserver.observe(el);
    imageUnloadObserver.observe(el);
  }

  function cleanupGridObservers(grid) {
    if (!grid) return;
    grid.querySelectorAll('.waifu-img').forEach(el => {
      try { imageLoadObserver.unobserve(el); } catch {}
      try { imageUnloadObserver.unobserve(el); } catch {}
    });
  }

  // ================= AUTH & LOGIN =================
  onAuthStateChanged(auth, (user) => {
    if (user && !user.isAnonymous) {
      loadDashboard(user.uid);
    } else if (user && user.isAnonymous) {

      signInAnonymously(auth).catch(e => { setMsg('msg-login', e.message, 'err'); show('screen-login'); });
    }

  $('btn-request').onclick = async () => {
    const raw = $('identifier').value.trim();
    if (!raw) return setMsg('msg-login', 'Escribe tu usuario.', 'err');
    $('btn-request').disabled = true;
    $('btn-request').textContent = 'Enviando...';
    setMsg('msg-login', '');
    try {
      const username = raw.replace(/^@+/, '').toLowerCase();
      currentRequestId = (crypto.randomUUID && crypto.randomUUID()) || ('r_' + Date.now());
      await set(ref(db, 'login_requests/' + currentRequestId), {
        owner: auth.currentUser.uid, username, status: 'pending', createdAt: Date.now()
      });
      show('screen-code');
      $('code-inputs').querySelector('input').focus();
      listenToRequest();
    } catch (e) {
      setMsg('msg-login', "Error: " + e.message, 'err');
      $('btn-request').disabled = false;
      $('btn-request').textContent = 'Enviar código';
    }
  };

  function listenToRequest() {
    if (unsubRequest) unsubRequest();
    unsubRequest = onValue(ref(db, 'login_requests/' + currentRequestId), (snap) => {
      const d = snap.val();
      if (!d) return;
      if (d.status === 'ready') setMsg('msg-code', '✅ Código enviado.', 'ok');
      if (d.status === 'error') {
        setMsg('msg-code', '❌ ' + d.error, 'err');
        $('btn-verify').disabled = false;
      }
      if (d.status === 'verified' && d.customToken) {
        unsubRequest();
        $('btn-verify').textContent = 'Ingresando...';
        signInWithCustomToken(auth, d.customToken).catch(e => {
          setMsg('msg-code', '❌ ' + e.message, 'err'); $('btn-verify').disabled = false;
        });
      }
    });
  }

  $('btn-verify').onclick = async () => {
    const code = [...$('code-inputs').querySelectorAll('input')].map(i => i.value).join('');
    if (code.length !== 6) return setMsg('msg-code', 'Faltan dígitos.', 'err');
    $('btn-verify').disabled = true;
    setMsg('msg-code', 'Verificando...', 'ok');
    try {
      await update(ref(db, 'login_requests/' + currentRequestId), { userCode: code, status: 'checking' });
      setMsg('msg-code', '⏳ Esperando validación...', 'ok');
    } catch (e) {
      setMsg('msg-code', "Error: " + e.message, 'err'); $('btn-verify').disabled = false;
    }
  };

  $('btn-back').onclick = () => {
    if (unsubRequest) unsubRequest();
    currentRequestId = null; show('screen-login');
  };

  // ================= DASHBOARD =================
  function loadDashboard(uid) {
    show('screen-panel');

    getLocalImage('avatar', uid).then(dataUrl => {
      const imgHtml = dataUrl ? `<img src="${dataUrl}">` : '?';
      $('p-avatar').innerHTML = imgHtml;
      $('sb-avatar').innerHTML = imgHtml;
    });

    if (unsubProfile) unsubProfile();
    unsubProfile = onValue(ref(db, 'users/' + uid + '/profile'), (snap) => {
      const p = snap.val() || {};
      const fullName = [p.firstName, p.lastName].filter(Boolean).join(' ') || 'Usuario';
      $('p-name').textContent = fullName;
      $('p-tag').textContent = p.username ? '@' + p.username : 'ID: ' + uid;
      $('sb-name').textContent = fullName;
      $('sb-tag').textContent = p.username ? '@' + p.username : 'ID: ' + uid;
    });

    if (unsubGameData) unsubGameData();
    unsubGameData = onValue(ref(db, 'users/' + uid + '/gameData'), (snap) => {
      const data = snap.val() || {};

      if ((!data.waifusList || !data.skinsList) && !syncRequested) {
        syncRequested = true;
        myGameData = data;
        requestSync(uid);
        return;
      }

      // ⚡ Skip si no cambió (updatedAt es barato de comparar)
      if (data.updatedAt && data.updatedAt === lastGameDataUpdatedAt) return;
      lastGameDataUpdatedAt = data.updatedAt;
      myGameData = data;

      // Stats (solo 6 elementos, rápido)
      $('stat-coins').textContent   = NUM_FMT.format(Number(data.coins || 0));
      $('stat-waifus').textContent  = NUM_FMT.format(Number(data.waifusTotal || 0));
      $('stat-unique').textContent  = NUM_FMT.format(Number(data.waifusUnique || 0));
      const m = data.minerals || {};
      $('stat-hierro').textContent  = NUM_FMT.format(Number(m.hierro || 0));
      $('stat-oro').textContent     = NUM_FMT.format(Number(m.oro || 0));
      $('stat-diamante').textContent= NUM_FMT.format(Number(m.diamante || 0));

      markCollectionDirty();
      markShopDirty();
    });

    if (unsubShopData) unsubShopData();
    unsubShopData = onValue(ref(db, 'shop_data'), (snap) => {
      const data = snap.val() || { waifus: [], skins: [] };
      if (data.updatedAt && data.updatedAt === lastShopUpdatedAt) return;
      lastShopUpdatedAt = data.updatedAt;
      shopData = data;
      markShopDirty();
    });
  }

  // ================= RENDER COLECCIÓN =================
  function renderCollection(force = false) {
    const grid = $('collection-grid');
    const filters = $('coll-filters-wrap');
    if (!grid) return;

    // ⚡ Si la pestaña no está activa y no se fuerza, marcar dirty y salir
    if (!force && !$('tab-collection').classList.contains('active')) {
      collectionDirty = true;
      return;
    }
    collectionDirty = false;

    cleanupGridObservers(grid);
    grid.innerHTML = '';

    if (collectionTab === 'waifus') {
      filters.style.display = 'block';

      let list = myGameData?.waifusList || [];
      if (currentFilter !== 'all') list = list.filter(w => w.rarity === currentFilter);

      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted);">No hay waifus en esta categoría.</div>`;
        return;
      }

      const order = { exclusiva:0, legendaria:1, epica:2, rara:3, comun:4 };
      list = [...list].sort((a,b) => (order[a.rarity]||9) - (order[b.rarity]||9));

      const frag = document.createDocumentFragment();
      list.forEach(w => {
        const card = document.createElement('div');
        card.className = 'waifu-card';
        card.dataset.r = w.rarity;

        const imgDiv = document.createElement('div');
        imgDiv.className = 'waifu-img';
        imgDiv.dataset.name = w.name;
        imgDiv.dataset.type = 'waifu';

        const badge = document.createElement('div');
        badge.className = 'waifu-badge';
        badge.textContent = `x${w.count}`;
        imgDiv.appendChild(badge);

        const rBadge = document.createElement('div');
        rBadge.className = 'waifu-rarity-badge';
        rBadge.textContent = w.rarity;
        imgDiv.appendChild(rBadge);

        const infoDiv = document.createElement('div');
        infoDiv.className = 'waifu-info';
        const sellLabel = w.count > 1 ? `Vender 1 (de ${w.count})` : 'Vender';
        infoDiv.innerHTML = `
          <div class="waifu-name" title="${w.name}">${w.name}</div>
          <button class="btn-sell" data-name="${w.name}" data-rarity="${w.rarity}" data-count="${w.count}">${sellLabel}</button>
        `;

        card.appendChild(imgDiv);
        card.appendChild(infoDiv);
        frag.appendChild(card);

        observeImg(imgDiv);
      });
      grid.appendChild(frag);

      grid.querySelectorAll('.btn-sell').forEach(btn => {
        btn.onclick = async () => {
          const name = btn.dataset.name;
          const count = parseInt(btn.dataset.count, 10) || 1;
          const countMsg = count > 1 ? `\n\n📦 Tienes ${count} copias. Solo se venderá 1 copia.` : '';

          showModal(
            'Vender 1 copia',
            `¿Por cuánto quieres vender a ${name}?${countMsg}\n(Mínimo: 100 | Máximo: 3500)`,
            true, 'Ej: 500', '100',
            async (priceStr) => {
              if (!priceStr) return;
              const price = parseInt(priceStr, 10);
              if (isNaN(price) || price < 100 || price > 3500) {
                return showToast('Precio inválido. Debe estar entre 100 y 3500.', 'error');
              }
              btn.disabled = true;
              btn.textContent = '...';

              const reqId = 'sell_' + Date.now();
              const reqRef = ref(db, 'sell_waifu_requests/' + reqId);
              const unsub = onValue(reqRef, (snap) => {
                const res = snap.val();
                if (!res) return;
                if (res.status === 'done') {
                  unsub();
                  const copiesLeft = (typeof res.copiesAfter === 'number') ? res.copiesAfter : Math.max(0, count - 1);
                  const soldName = res.waifuName || name;
                  showToast(copiesLeft > 0
                    ? `¡1 copia de ${soldName} vendida! Te quedan ${copiesLeft}.`
                    : `¡${soldName} vendida! (última copia)`, 'success');
                  requestSync(auth.currentUser.uid);
                } else if (res.status === 'error') {
                  unsub();
                  showToast('Error: ' + res.error, 'error');
                  btn.disabled = false;
                  btn.textContent = count > 1 ? `Vender 1 (de ${count})` : 'Vender';
                }
              });

              await set(reqRef, {
                userId: auth.currentUser.uid,
                userName: $('p-name').textContent,
                username: $('p-tag').textContent.replace('@',''),
                waifuName: name, price, status: 'pending', createdAt: Date.now()
              }).catch(err => {
                showToast('Error: ' + err.message, 'error');
                btn.disabled = false;
                btn.textContent = count > 1 ? `Vender 1 (de ${count})` : 'Vender';
                unsub();
              });
            }
          );
        };
      });

    } else if (collectionTab === 'skins') {
      filters.style.display = 'none';
      const skinsList = myGameData?.skinsList || [];

      if (skinsList.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted);">No tienes skins todavía.<br>Compra algunas en la tienda.</div>`;
        return;
      }

      const frag = document.createDocumentFragment();
      skinsList.forEach(s => {
        const isActive = s.active !== false;
        const card = document.createElement('div');
        card.className = 'waifu-card';
        card.dataset.r = s.rarity;

        const imgDiv = document.createElement('div');
        imgDiv.className = 'waifu-img';
        imgDiv.dataset.name = s.id;
        imgDiv.dataset.type = 'skin';

        const rBadge = document.createElement('div');
        rBadge.className = 'waifu-rarity-badge';
        rBadge.textContent = s.rarity;
        imgDiv.appendChild(rBadge);

        const infoDiv = document.createElement('div');
        infoDiv.className = 'waifu-info';
        infoDiv.innerHTML = `
          <div class="waifu-name" title="${s.waifuName}">${s.waifuName}</div>
          <button class="btn-toggle ${isActive ? 'active' : 'inactive'}" data-id="${s.id}" data-active="${isActive}">
            ${isActive ? 'Desactivar' : 'Activar'}
          </button>
        `;

        card.appendChild(imgDiv);
        card.appendChild(infoDiv);
        frag.appendChild(card);
        observeImg(imgDiv);
      });
      grid.appendChild(frag);

      grid.querySelectorAll('.btn-toggle').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          const isActive = btn.dataset.active === 'true';
          btn.disabled = true;
          btn.textContent = '...';

          const reqId = 'tog_' + Date.now();
          const reqRef = ref(db, 'skin_toggle_requests/' + reqId);
          const unsub = onValue(reqRef, (snap) => {
            const res = snap.val();
            if (!res) return;
            if (res.status === 'done') { unsub(); requestSync(auth.currentUser.uid); set(reqRef, null).catch(()=>{}); }
            else if (res.status === 'error') {
              unsub();
              showToast('Error: ' + res.error, 'error');
              btn.disabled = false;
              btn.textContent = isActive ? 'Desactivar' : 'Activar';
              set(reqRef, null).catch(()=>{});
            }
          });

          await set(reqRef, {
            userId: auth.currentUser.uid, skinId: id, activate: !isActive, status: 'pending', createdAt: Date.now()
          });
        };
      });
    }
  }

  // ================= TIENDA =================
  function renderShop(force = false) {
    const grid = $('shop-grid');
    if (!grid) return;

    if (!force && !$('tab-shop').classList.contains('active')) {
      shopDirty = true;
      return;
    }
    shopDirty = false;

    cleanupGridObservers(grid);
    grid.innerHTML = '';

    const currentUserId = auth.currentUser?.uid;
    const owned = getOwnedSets();

    let items = shopFilter === 'waifus' ? (shopData.waifus || []) : (shopData.skins || []);

    items = items.filter(item => {
      if (String(item.sellerId) === String(currentUserId)) return false;
      if (shopFilter === 'waifus' && owned.waifus.has(String(item.name).toLowerCase())) return false;
      if (shopFilter === 'skins' && owned.skins.has(String(item.id))) return false;
      return true;
    });

    const q = shopSearchQuery.trim().toLowerCase();
    if (q) {
      items = items.filter(item => String(item.waifuName || item.name || '').toLowerCase().includes(q));
    }

    if (items.length === 0) {
      const emptyMsg = q
        ? `No se encontraron resultados para "<b>${escapeHtml(shopSearchQuery)}</b>".<br><small>Prueba con otro nombre.</small>`
        : `No hay artículos disponibles para ti.<br><small>(Ocultando tus ventas y artículos que ya posees)</small>`;
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted);">${emptyMsg}</div>`;
      return;
    }

    const frag = document.createDocumentFragment();
    items.forEach(item => {
      const isSkin = shopFilter === 'skins';
      const nameToImg = isSkin ? item.id : item.name;

      const card = document.createElement('div');
      card.className = 'waifu-card';
      card.dataset.r = item.rarity;

      const imgDiv = document.createElement('div');
      imgDiv.className = 'waifu-img';
      imgDiv.dataset.name = nameToImg;
      imgDiv.dataset.type = isSkin ? 'skin' : 'waifu';

      const priceBadge = document.createElement('div');
      priceBadge.className = 'waifu-badge';
      priceBadge.style.color = 'var(--gold)';
      priceBadge.textContent = `${item.price} 🪙`;
      imgDiv.appendChild(priceBadge);

      const rBadge = document.createElement('div');
      rBadge.className = 'waifu-rarity-badge';
      rBadge.textContent = item.rarity;
      imgDiv.appendChild(rBadge);

      const sellerBadge = document.createElement('div');
      sellerBadge.className = 'waifu-seller-badge';
      sellerBadge.textContent = item.seller;
      sellerBadge.title = `Vendedor: ${item.seller}`;
      imgDiv.appendChild(sellerBadge);

      const infoDiv = document.createElement('div');
      infoDiv.className = 'waifu-info shop-info';
      infoDiv.innerHTML = `
        <div class="waifu-name" title="${item.waifuName || item.name}">${item.waifuName || item.name} ${isSkin ? '(Skin)' : ''}</div>
        <button class="btn-buy" data-id="${item.id}" data-type="${isSkin ? 'skin' : 'waifu'}" data-name="${item.waifuName || item.name}" data-price="${item.price}">Comprar</button>
      `;

      card.appendChild(imgDiv);
      card.appendChild(infoDiv);
      frag.appendChild(card);
      observeImg(imgDiv);
    });
    grid.appendChild(frag);

    grid.querySelectorAll('.btn-buy').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const type = btn.dataset.type;
        const name = btn.dataset.name;
        const price = Number(btn.dataset.price);

        if (!myGameData || myGameData.coins < price) return showToast('No tienes suficientes monedas.', 'error');

        showModal('Confirmar Compra', `¿Seguro que quieres comprar a ${name} por ${price} monedas?`, false, '', '', async () => {
          btn.disabled = true;
          btn.textContent = '...';

          const reqId = 'buy_' + Date.now();
          const resRef = ref(db, 'shop_buy_requests/' + reqId);
          const unsub = onValue(resRef, (snap) => {
            const res = snap.val();
            if (!res) return;
            if (res.status === 'done') {
              unsub();
              showToast('¡Compra exitosa!', 'success');
              requestSync(auth.currentUser.uid);
              card.style.opacity = '0';
              setTimeout(() => card.remove(), 300);
              set(resRef, null).catch(()=>{});
            } else if (res.status === 'error') {
              unsub();
              showToast('Error: ' + res.error, 'error');
              btn.disabled = false;
              btn.textContent = 'Comprar';
              set(resRef, null).catch(()=>{});
            }
          });

          await set(resRef, {
            itemId: id, itemName: name, type, price,
            buyerId: auth.currentUser.uid, buyerName: $('p-name').textContent,
            buyerUsername: $('p-tag').textContent.replace('@',''),
            status: 'pending', createdAt: Date.now()
          }).catch(err => {
            showToast('Error: ' + err.message, 'error');
            btn.disabled = false; btn.textContent = 'Comprar'; unsub();
          });
        });
      };
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  // ================= NAVEGACIÓN =================
  function switchTab(tab) {
    // ⚡ Renderizar ANTES de mostrar para evitar flash vacío
    if (tab === 'collection' && collectionDirty) renderCollection(true);
    if (tab === 'shop' && shopDirty) renderShop(true);

    document.querySelectorAll('.nav-item[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.mnav-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    const el = $('tab-' + tab);
    if (el) el.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.querySelectorAll('.nav-item[data-tab], .mnav-btn[data-tab]').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.tab);
  });

  document.querySelectorAll('#coll-subtabs .subtab').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#coll-subtabs .subtab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      collectionTab = btn.dataset.coll;
      renderCollection(true);
    };
  });

  document.querySelectorAll('#coll-filters button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#coll-filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.f;
      renderCollection(true);
    };
  });

  document.querySelectorAll('#shop-filters button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#shop-filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      shopFilter = btn.dataset.shop;
      renderShop(true);
    };
  });

  // ⚡ Búsqueda con debounce
  const shopSearchInput = $('shop-search');
  const shopSearchClear = $('shop-search-clear');
  let searchDebounceTimer = null;

  shopSearchInput.addEventListener('input', (e) => {
    shopSearchQuery = e.target.value;
    if (shopSearchQuery.length > 0) shopSearchClear.classList.add('visible');
    else shopSearchClear.classList.remove('visible');

    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => markShopDirty(), 200);
  });

  shopSearchClear.addEventListener('click', () => {
    shopSearchInput.value = '';
    shopSearchQuery = '';
    shopSearchClear.classList.remove('visible');
    shopSearchInput.focus();
    clearTimeout(searchDebounceTimer);
    markShopDirty();
  });

  // ================= LOGOUT =================
  function doLogout() {
    try {
      if (unsubProfile) unsubProfile();
      if (unsubGameData) unsubGameData();
      if (unsubShopData) unsubShopData();
      imageCache.clear();
      pendingRequests.clear();
    } catch (e) {}
    signOut(auth).catch(() => {}).finally(() => window.location.reload());
  }

  $('btn-logout').onclick = doLogout;
  document.querySelectorAll('.inline-logout-btn[data-logout]').forEach(btn => { btn.onclick = doLogout; });

  const codeInputs = [...$('code-inputs').querySelectorAll('input')];
  codeInputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
      if (inp.value && i < codeInputs.length - 1) codeInputs[i + 1].focus();
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !inp.value && i > 0) codeInputs[i - 1].focus();
    });
  });
</script>
</body>
</html>
