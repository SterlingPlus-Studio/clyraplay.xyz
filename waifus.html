<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jinx Waifus Web</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --pink:#ff2d92; --purple:#8b5cf6; --cyan:#22d3ee; --gold:#fbbf24;
    --bg:#07030f; --panel:#0d0620; --panel2:#150b26;
    --border:#3d2561; --border2:#5b3fa0;
    --text:#e9e2ff; --muted:#8a7bb0;
    --comun:#ffb6c1; --rara:#ff8383; --epica:#a78bfa; --legendaria:#fbbf24; --exclusiva:#22d3ee;
    --sidebar-w: 250px;
    --ok:#22c55e; --err:#ef4444;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0%{background-position: -200% 0} 100%{background-position: 200% 0} }
  @keyframes glowPulse { 0%,100%{box-shadow:0 0 20px rgba(139,92,246,.35)} 50%{box-shadow:0 0 35px rgba(255,45,146,.55)} }
  @keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }
  @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pop { 0%{transform:scale(.9);opacity:0} 60%{transform:scale(1.03)} 100%{transform:scale(1);opacity:1} }
  @keyframes modalFade { from{opacity:0} to{opacity:1} }
  @keyframes toastIn { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(-10px)} }

  html {
    background: #07030f;
    width: 100%;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    background: #07030f;
    min-height: 100vh;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    position: relative;
  }
  body.modal-open { overflow: hidden; }

  .ic { display: inline-block; vertical-align: middle; flex-shrink: 0; }

  .bg-layers {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,45,146,.15), transparent 45%),
      radial-gradient(circle at 85% 25%, rgba(139,92,246,.22), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(34,211,238,.15), transparent 45%),
      linear-gradient(180deg, #07030f, #0a0518 50%, #07030f);
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: -1; opacity: .30; pointer-events: none;
    background-image:
      linear-gradient(rgba(139,92,246,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 100%);
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 100%);
  }
  .scanline {
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9999;
    background: linear-gradient(transparent 0%, rgba(139,92,246,.06) 50%, transparent 100%);
    height: 20vh; width: 100%;
    animation: scanline 8s linear infinite;
    opacity: .4;
  }

  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: rgba(13,6,32,.6); border-radius: 10px; }
  *::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--pink), var(--purple), var(--cyan));
    border-radius: 10px;
    border: 2px solid rgba(13,6,32,.9);
    box-shadow: inset 0 0 6px rgba(255,45,146,.5);
  }
  * { scrollbar-width: thin; scrollbar-color: var(--purple) rgba(13,6,32,.8); }

  #toast-wrap{
    position: fixed; top: max(20px, env(safe-area-inset-top, 20px));
    left: 50%; transform: translateX(-50%);
    z-index: 99999;
    display:flex; flex-direction:column; gap: 8px;
    align-items: center; pointer-events: none;
    padding: 0 12px; width: 100%; max-width: 500px;
  }
  .toast{
    padding: 14px 22px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(21,11,38,.98), rgba(13,6,32,.98));
    border: 1px solid var(--purple); color: var(--text);
    font-size: 13px; font-weight: 700; letter-spacing: .5px;
    box-shadow: 0 0 30px rgba(139,92,246,.5), inset 0 1px 0 rgba(255,255,255,.1);
    animation: toastIn .3s ease;
    width: fit-content; max-width: 100%; text-align: center;
    pointer-events: auto;
    display: flex; align-items: center; gap: 8px; justify-content: center;
  }
  .toast.ok{ border-color: var(--ok); box-shadow: 0 0 30px rgba(34,197,94,.45); }
  .toast.err{ border-color: var(--err); box-shadow: 0 0 30px rgba(239,68,68,.45); }
  .toast.hide{ animation: toastOut .3s ease forwards; }

  .layout{ display: flex; min-height: 100vh; position: relative; width: 100%; overflow-x: clip; }

  .sidebar{
    width: var(--sidebar-w);
    background: linear-gradient(180deg, rgba(13,6,32,.98), rgba(7,3,15,.98));
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0;
    z-index: 100; transition: transform .3s ease;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .sidebar::before{
    content:''; position:absolute; top:0; right:0; width:2px; height:100%;
    background: linear-gradient(180deg, transparent, var(--purple), var(--pink), transparent);
    opacity:.5;
  }
  .sidebar-brand{ padding: 24px 20px 20px; border-bottom: 1px solid var(--border); position: relative; }
  .sidebar-brand .logo{
    font-size: 22px; font-weight: 900; letter-spacing: 1.5px;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan), var(--pink));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite; text-transform: uppercase; line-height: 1.1;
  }
  .sidebar-brand .sub{ font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .sidebar-brand .badge-dot{
    position:absolute; top: 24px; right: 20px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
    animation: pulse 2s infinite;
  }
  .sidebar-user{
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; font-size: 12px;
  }
  .sidebar-user .avatar-sm{
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 15px;
    border: 1.5px solid rgba(255,255,255,.15);
    box-shadow: 0 0 15px rgba(139,92,246,.4);
    flex-shrink: 0; overflow: hidden;
  }
  .sidebar-user .avatar-sm img{ width:100%; height:100%; object-fit: cover; display:block; }
  .sidebar-user .uinfo{ min-width: 0; flex: 1; }
  .sidebar-user .uname{ font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .sidebar-user .utag{ color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-nav{
    flex: 1; padding: 14px 12px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .nav-item{
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px;
    color: var(--muted); font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; border: 1px solid transparent;
    background: transparent; transition: .2s;
    text-align: left; font-family: inherit; width: 100%;
    position: relative;
  }
  .nav-item .icon{ font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .nav-item:hover:not(.active){ color: var(--text); background: rgba(139,92,246,.08); border-color: rgba(139,92,246,.25); }
  .nav-item.active{
    color: var(--text);
    background: linear-gradient(90deg, rgba(255,45,146,.18), rgba(139,92,246,.15));
    border-color: var(--purple);
    box-shadow: inset 0 0 20px rgba(139,92,246,.2), 0 0 15px rgba(139,92,246,.2);
  }
  .nav-item.active::before{
    content:''; position:absolute; left: -12px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 60%;
    background: linear-gradient(180deg, var(--pink), var(--cyan));
    border-radius: 3px; box-shadow: 0 0 10px var(--pink);
  }
  .sidebar-footer{
    padding: 14px 12px;
    padding-bottom: max(14px, env(safe-area-inset-bottom, 14px));
  }
  .btn-logout{
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: 10px;
    background: transparent; border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    font-family: inherit; transition: .2s;
  }
  .btn-logout:hover{ background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.6); box-shadow: 0 0 20px rgba(239,68,68,.25); }
  .btn-logout .icon{ font-size: 15px; display:flex; align-items:center; }

  .main{
    flex: 1; margin-left: var(--sidebar-w);
    padding: 26px 24px 60px;
    min-width: 0; width: 100%; max-width: 100%;
  }
  .main-inner{ max-width: 1080px; margin: 0 auto; width: 100%; }

  .topbar{
    display: none; align-items: center; gap: 12px;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top, 12px));
    background: rgba(13,6,32,.95);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 90;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .hamburger{
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(139,92,246,.15); border: 1px solid var(--border);
    color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; box-shadow: none; flex-shrink: 0;
  }
  .hamburger:hover{ background: rgba(139,92,246,.25); transform: none; }
  .topbar-title{
    font-size: 14px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--pink), var(--cyan));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    text-transform: uppercase; flex: 1; text-align: right;
  }

  .overlay{
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.75); z-index: 95;
  }
  .overlay.show{ display: block; }

  .card{
    background: linear-gradient(180deg, rgba(21,11,38,.85), rgba(13,6,32,.95));
    border: 1px solid var(--border); border-radius: 16px;
    padding: 22px 20px; position:relative;
    box-shadow: 0 0 30px rgba(139,92,246,.15), inset 0 1px 0 rgba(255,255,255,.04);
    margin-bottom: 16px; width: 100%;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(90deg, transparent, var(--purple), var(--pink), transparent);
    pointer-events: none;
  }
  .card::after{
    content:''; position:absolute; top:8px; right:8px; width:14px; height:14px;
    border-top:2px solid var(--cyan); border-right:2px solid var(--cyan);
    opacity:.6; pointer-events: none;
  }

  .screen{ display:none; width: 100%; }
  .screen.active{ display:block; animation: slideUp .4s ease; }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; animation: slideUp .3s ease; }

  label { display:block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
  input{
    width:100%; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: #0a0420; color: var(--text);
    font-size: 16px; outline: none; transition: .2s; font-family: inherit;
    -webkit-appearance: none;
  }
  input:focus{ border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,92,246,.25), 0 0 20px rgba(139,92,246,.3); }

  button{
    padding: 14px 18px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    color: white; font-size: 14px; font-weight: 800;
    cursor: pointer; transition: .2s;
    text-transform: uppercase; letter-spacing: 1px;
    font-family: inherit;
    box-shadow: 0 0 20px rgba(255,45,146,.35), inset 0 1px 0 rgba(255,255,255,.15);
    -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button:hover:not(:disabled){ transform: translateY(-1px); box-shadow: 0 0 30px rgba(255,45,146,.55), inset 0 1px 0 rgba(255,255,255,.2); }
  button:active:not(:disabled){ transform: translateY(0) scale(.98); }
  button:disabled{ opacity: .5; cursor: not-allowed; box-shadow:none; }
  .btn-full{ width:100%; margin-top: 16px; }
  .btn-ghost{ background: transparent; border: 1px solid var(--border); color: var(--muted); box-shadow:none; }
  .btn-ghost:hover{ color: var(--text); border-color: var(--purple); box-shadow: 0 0 15px rgba(139,92,246,.3); }

  .msg{ margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 13px; display: none; font-weight: 500; }
  .msg.err{ display:block; background: rgba(239,68,68,.12); color:#fca5a5; border:1px solid rgba(239,68,68,.4); }
  .msg.ok { display:block; background: rgba(34,211,238,.12); color:#7ae6f5; border:1px solid rgba(34,211,238,.4); }

  .tabs{ display:flex; gap:6px; margin-bottom: 18px; background: rgba(13,6,32,.7); padding:5px; border-radius:12px; border:1px solid var(--border); flex-wrap: wrap; }
  .tab{
    flex:1; min-width: 80px; padding:10px 6px; border-radius: 8px;
    cursor:pointer; font-size: 11px; color: var(--muted);
    text-align:center; background: transparent; border:none;
    text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    transition: .2s; font-family: inherit; box-shadow:none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tab:hover:not(.active){ color: var(--text); }
  .tab.active{ background: linear-gradient(90deg, rgba(255,45,146,.25), rgba(139,92,246,.25)); color: var(--text); box-shadow: inset 0 0 20px rgba(139,92,246,.3), 0 0 15px rgba(139,92,246,.25); }

  .subtabs{ display:flex; gap:8px; margin-bottom: 20px; flex-wrap:wrap; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .subtab{
    padding: 10px 18px; border-radius: 20px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 11px; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    font-family: inherit; transition: .2s; box-shadow: none;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .subtab:hover:not(.active){ color: var(--text); border-color: var(--border2); box-shadow: none; transform: none; }
  .subtab.active{ background: linear-gradient(90deg, rgba(255,45,146,.25), rgba(139,92,246,.25)); color: var(--text); border-color: var(--purple); box-shadow: inset 0 0 20px rgba(139,92,246,.25), 0 0 15px rgba(139,92,246,.3); }

  .profile{
    display:flex; align-items:center; gap:16px;
    padding: 16px; border-radius: 14px;
    background: rgba(10,4,32,.7); border: 1px solid var(--border);
    margin-bottom: 16px; position:relative;
  }
  .avatar{
    width: 64px; height: 64px; border-radius: 12px; flex-shrink:0;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items:center; justify-content:center;
    font-size: 26px; font-weight: 900;
    border: 2px solid rgba(255,255,255,.15);
    box-shadow: 0 0 25px rgba(139,92,246,.5);
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit: cover; display:block; }
  .profile-info{ flex:1; min-width:0; }
  .profile-info .name{ font-size: 17px; font-weight: 800; letter-spacing: .3px; word-break: break-word; }
  .profile-info .tag{ font-size: 12px; color: var(--muted); margin-top: 3px; }
  .plus-badge{
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; padding: 3px 10px; border-radius: 20px;
    background: linear-gradient(90deg, #f59e0b, #ec4899);
    color: white; font-weight: 800; margin-left: 8px; letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stats-grid{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px; margin-bottom: 16px;
  }
  .stat{
    padding: 14px 10px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(21,11,38,.85), rgba(10,4,32,.9));
    border: 1px solid var(--border); text-align: center;
    position:relative; overflow:hidden;
  }
  .stat::before{
    content:''; position:absolute; bottom:0; left:10%; right:10%; height:2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:.6;
  }
  .stat .num{ font-size: 22px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 15px rgba(34,211,238,.6); font-variant-numeric: tabular-nums; }
  .stat .lbl{
    font-size: 10px; color: var(--muted); margin-top: 5px;
    text-transform: uppercase; letter-spacing: 1.2px; font-weight:600;
    display: inline-flex; align-items: center; gap: 5px; justify-content: center;
  }

  .rarity-bar{
    display:flex; height: 6px; border-radius: 20px; overflow: hidden;
    margin-bottom: 16px; background: rgba(10,4,32,.9);
    border: 1px solid var(--border);
  }
  .rarity-bar > div{ height: 100%; transition: width .5s ease; }

  .section-title{
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); margin: 20px 0 12px; font-weight:700;
    display:flex; align-items:center; gap:10px;
  }
  .section-title::before{
    content:''; width: 3px; height: 14px;
    background: linear-gradient(180deg, var(--pink), var(--cyan));
    border-radius: 3px; box-shadow: 0 0 10px var(--pink);
  }
  .section-title::after{ content:''; flex:1; height:1px; background: linear-gradient(90deg, var(--border), transparent); }

  .filters{ display:flex; gap:6px; margin-bottom: 14px; flex-wrap:wrap; }
  .filters button{
    font-size: 10px; padding: 7px 12px; border-radius: 20px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 700; box-shadow:none;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .filters button:hover{ color: var(--text); box-shadow: 0 0 12px rgba(139,92,246,.25); }
  .filters button.active{
    background: linear-gradient(90deg, rgba(255,45,146,.3), rgba(139,92,246,.3));
    color: var(--text); border-color: var(--purple);
    box-shadow: 0 0 15px rgba(139,92,246,.4);
  }

  .grid{
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .wcard{
    background: linear-gradient(180deg, rgba(21,11,38,.9), rgba(10,4,32,.95));
    border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; position:relative; cursor: pointer;
    transition: transform .2s, box-shadow .3s, border-color .3s;
    animation: pop .3s ease;
    content-visibility: auto;
    contain-intrinsic-size: 200px 260px;
  }
  .wcard:hover{ transform: translateY(-3px); box-shadow: 0 12px 30px rgba(139,92,246,.35); border-color: var(--border2); }
  .wcard .img{
    width: 100%; aspect-ratio: 3/4;
    background: linear-gradient(135deg, #1a0a33, #0a0420);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .wcard .img img{ width:100%; height:100%; object-fit: cover; display:block; }
  .wcard .img .placeholder{
    font-size: 42px; font-weight: 900;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    opacity:.7;
  }
  .wcard .info{ padding: 10px 10px 12px; position:relative; border-top: 1px solid var(--border); }
  .wcard .name{
    font-size: 12px; font-weight: 700; letter-spacing: .3px;
    overflow:hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-bottom: 6px;
  }
  .wcard .meta{ display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .wcard .rarity{
    font-size: 8px; padding: 2px 8px; border-radius: 20px;
    font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    border: 1px solid currentColor;
  }
  .wcard .count{
    font-size: 11px; font-weight: 800; color: var(--cyan);
    text-shadow: 0 0 8px rgba(34,211,238,.6);
    display: inline-flex; align-items: center; gap: 3px;
  }
  .wcard[data-r="comun"]{ border-color: rgba(255,182,193,.4); }
  .wcard[data-r="comun"] .rarity{ color: var(--comun); background: rgba(255,182,193,.1); }
  .wcard[data-r="rara"]{ border-color: rgba(255,131,131,.5); box-shadow: 0 0 20px rgba(255,131,131,.15); }
  .wcard[data-r="rara"] .rarity{ color: var(--rara); background: rgba(255,131,131,.1); }
  .wcard[data-r="epica"]{ border-color: rgba(167,139,250,.55); box-shadow: 0 0 22px rgba(167,139,250,.22); }

function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => {
    const name = el.dataset.icon;
    const size = parseInt(el.dataset.iconSize || '16', 10);
    const svg = ico(name, size);
    const iconSpan = el.querySelector('.icon');
    if (iconSpan) iconSpan.innerHTML = svg;
    else if (el.tagName === 'BUTTON' && !el.querySelector('svg')) el.insertAdjacentHTML('afterbegin', svg);

const inputEl = $('identifier');

const hintEl  = $('hint-1');
document.querySelectorAll('#login-tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const m = tab.dataset.mode;
    if (m === mode) return;
    mode = m;
    document.querySelectorAll('#login-tabs .tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    clearMsg($('msg-1')); inputEl.value = '';
    if (mode === 'username') {

    } else {
      labelEl.textContent = 'ID numérico de Telegram';
      inputEl.placeholder = '123456789';
      inputEl.inputMode = 'numeric';
      hintEl.innerHTML = 'El bot te enviará un <b>código de 6 dígitos</b>.<br>Obtén tu ID con <b>@userinfobot</b>.';
    }
    inputEl.focus();
  });
});

const codeInputs = [...document.querySelectorAll('#code-inputs input')];
codeInputs.forEach((inp, i) => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
    if (inp.value && i < codeInputs.length - 1) codeInputs[i + 1].focus();
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !inp.value && i > 0) codeInputs[i - 1].focus();
  });
});
const getTypedCode = () => codeInputs.map(i => i.value).join('');

$('btn-request').addEventListener('click', async () => {
  const raw = inputEl.value.trim();
  const msg = $('msg-1');
  clearMsg(msg);
  if (!raw) return setMsg(msg, mode === 'id' ? 'Escribe tu ID.' : 'Escribe tu usuario.');

  let identifier;
  if (mode === 'id') {
    if (!/^\d{5,15}$/.test(raw.replace(/^@/, ''))) return setMsg(msg, 'ID solo números (5-15 dígitos).');
    identifier = raw.replace(/^@/, '');
  } else {
    const clean = raw.replace(/^@/, '').toLowerCase().trim();
    if (!/^[a-zA-Z0-9_]{3,32}$/.test(clean)) return setMsg(msg, 'Usuario inválido.');
    identifier = clean;
  }

  const btn = $('btn-request');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>Enviando...';

  try {
    const id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    currentRequestId = id;
    await set(ref(db, `loginRequests/${id}`), {
      identifier, username: mode === 'username' ? identifier : null, mode,
      status: 'pending', createdAt: Date.now()
    });
    setMsg(msg, 'Solicitud enviada. Revisa tu Telegram.', 'ok');

    if (unsubRequest) unsubRequest();
    unsubRequest = onValue(ref(db, `loginRequests/${id}`), (snap) => {
      const data = snap.val();
      if (!data) return;
      if (data.status === 'sent') {
        show('screen-code');
        setTimeout(() => codeInputs[0].focus(), 100);
      } else if (data.status === 'error') {
        setMsg(msg, data.error || 'Error desconocido.');
        btn.disabled = false;
        btn.innerHTML = ico('play',15) + 'Enviar código';
      }
    });

    setTimeout(() => {
      if ($('screen-login').classList.contains('active')) {
        setMsg(msg, 'El bot no respondió. Verifica que ya le escribiste /start.');
        btn.disabled = false;
        btn.innerHTML = ico('play',15) + 'Enviar código';
      }
    }, 30000);
  } catch (e) {
    setMsg(msg, 'Error: ' + (e.message || e));
    btn.disabled = false;
    btn.innerHTML = ico('play',15) + 'Enviar código';
  }
});

$('btn-verify').addEventListener('click', async () => {
  const msg = $('msg-2');
  clearMsg(msg);
  const typed = getTypedCode();
  if (typed.length !== 6) return setMsg(msg, 'Ingresa los 6 dígitos.');

  const btn = $('btn-verify');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>Verificando...';

  try {
    const snap = await get(ref(db, `loginRequests/${currentRequestId}`));
    const data = snap.val();
    if (!data) throw new Error('Solicitud no encontrada.');
    if (data.status !== 'sent') throw new Error('Solicitud inválida.');
    if (Date.now() > data.expiresAt) throw new Error('Código expirado.');
    if (String(data.code) !== typed) throw new Error('Código incorrecto.');

    const token = crypto.randomUUID();
    await set(ref(db, `sessions/${token}`), {
      userId: data.userId, username: data.username || null,
      createdAt: Date.now(), expiresAt: Date.now() + 7 * 24 * 60 * 60 * 1000
    });
    localStorage.setItem('jinx_session', token);
    await set(ref(db, `loginRequests/${currentRequestId}/status`), 'verified');

    await startSession(token);
  } catch (e) {
    setMsg(msg, e.message || 'Error.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = ico('check',15) + 'Verificar';
  }
});

$('btn-back').addEventListener('click', () => {
  if (unsubRequest) { unsubRequest(); unsubRequest = null; }
  show('screen-login');
  clearMsg($('msg-1'));
  $('btn-request').disabled = false;
  $('btn-request').innerHTML = ico('play',15) + 'Enviar código';
  codeInputs.forEach(i => i.value = '');
});

   ============================================================ */
async function startSession(token) {
  const sessSnap = await get(ref(db, `sessions/${token}`));
  const sess = sessSnap.val();
  if (!sess) throw new Error('Sesión no válida.');
  session = { token, ...sess };

  show('screen-panel');
  await loadAll();
  subscribeRealtime();
  renderAll();
}

async function loadAll() {
  const uid = session.userId;
  const [uSnap, dSnap, cSnap, rSnap, sSnap, aSnap] = await Promise.all([
    get(ref(db, `users/${uid}`)),
    get(ref(db, `users/${uid}/data`)),
    get(ref(db, `catalog`)),
    get(ref(db, `ranking`)),
    get(ref(db, `sales`)),
    get(ref(db, `auction`))
  ]);
  userDoc  = uSnap.val()  || {};
  userData = dSnap.val()  || {};
  catalog  = cSnap.val()  || { pool: {}, series: {} };
  ranking  = rSnap.val()  || { top: [], totalUsers: 0, totalWaifus: 0 };
  sales    = sSnap.val()  || {};
  auction  = aSnap.val()  || { active: null };
}

function subscribeRealtime() {
  const uid = session.userId;
  unsubs.push(onValue(ref(db, `users/${uid}/data`), (s) => {
    userData = s.val() || {};
    renderProfile(); renderSidebarUser();
    if (currentTab === 'collection') renderCollection();
    if (currentTab === 'shop')       renderShop();
    if (modalOpenUserId && String(modalOpenUserId) === String(uid)) renderModalProfile();
  }));
  unsubs.push(onValue(ref(db, `users/${uid}`), (s) => {
    userDoc = s.val() || {};
    renderProfile(); renderSidebarUser();
    if (modalOpenUserId && String(modalOpenUserId) === String(uid)) renderModalProfile();
  }));
  unsubs.push(onValue(ref(db, `catalog`), (s) => {
    catalog = s.val() || { pool: {}, series: {} };
    if (currentTab === 'shop') renderShop();
  }));
  unsubs.push(onValue(ref(db, `sales`),   (s) => { sales = s.val() || {}; if (currentTab === 'shop') renderShop(); }));
  unsubs.push(onValue(ref(db, `ranking`), (s) => {
    ranking = s.val() || { top: [] };
    if (currentTab === 'ranking') renderRanking();
  }));
  unsubs.push(onValue(ref(db, `auction`), (s) => { auction = s.val() || { active: null }; if (currentTab === 'auction') renderAuction(); }));
}

   IMÁGENES
   ============================================================ */
function watchImage(name, targetMap = imageUnsubs) {
  if (!name || targetMap.has(name)) return;
  const key = imageKey(name);
  const unsub = onValue(ref(db, `characterImages/${key}/url`), (snap) => {
    const url = snap.val();
    if (typeof url === 'string' && url) {
      imageUrls[name] = url;
      document.querySelectorAll(`[data-img="${CSS.escape(name)}"]`).forEach(target => {
        const holder = target.querySelector('.img') || target;
        let img = holder.querySelector('img');
        if (!img) {
          holder.innerHTML = `<img src="${esc(url)}" alt="" loading="lazy" style="opacity:0;transition:opacity .4s" onload="this.style.opacity='1'">`;
        } else if (img.src !== url) {
          img.src = url; img.style.opacity = '1';
        }
      });
    }
  });
  targetMap.set(name, unsub);
}

async function requestBuy(saleId) {
  const reqId = 'buy_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  await set(ref(db, `buyRequests/${reqId}`), {
    saleId,
    buyerId: session.userId,
    sessionToken: session.token,
    status: 'pending',
    createdAt: Date.now()
  });

  showToast('Procesando compra...', 'ok', 2000, 'clock');

  const unsub = onValue(ref(db, `buyRequests/${reqId}`), (snap) => {
    const r = snap.val();
    if (!r) return;
    if (r.status === 'done') {
      showToast(`Compraste a ${r.waifuName || 'la waifu'} por ${fmt(r.price)}`, 'ok', 4000, 'check');
      unsub(); actionUnsubs.delete(reqId);
    } else if (r.status === 'error') {
      showToast(r.error || 'Error en la compra', 'err', 5000, 'x');
      unsub(); actionUnsubs.delete(reqId);
    }
  });
  actionUnsubs.set(reqId, unsub);

  setTimeout(() => {
    const u = actionUnsubs.get(reqId);
    if (u) { u(); actionUnsubs.delete(reqId); }
  }, 30000);
}

async function requestBox(tipo) {
  const reqId = 'box_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  await set(ref(db, `boxRequests/${reqId}`), {
    tipo,
    userId: session.userId,
    sessionToken: session.token,
    status: 'pending',
    createdAt: Date.now()
  });

  showToast(`Abriendo ${CAJAS[tipo]?.name || 'caja'}...`, 'ok', 2000, 'clock');

  const unsub = onValue(ref(db, `boxRequests/${reqId}`), (snap) => {
    const r = snap.val();
    if (!r) return;
    if (r.status === 'done') {
      const gained = Array.isArray(r.waifusGained) ? r.waifusGained : [];
      const names = gained.slice(0, 3).map(w => w.name).join(', ');
      const extra = gained.length > 3 ? ` +${gained.length - 3}` : '';
      const parts = [];
      if (r.coinsGained > 0) parts.push(`+${fmt(r.coinsGained)} monedas`);
      if (gained.length > 0) parts.push(`${names}${extra}`);
      showToast(parts.join(' · ') || 'Caja abierta', 'ok', 5000, 'gift');
      unsub(); actionUnsubs.delete(reqId);
    } else if (r.status === 'error') {
      showToast(r.error || 'Error al abrir la caja', 'err', 5000, 'x');
      unsub(); actionUnsubs.delete(reqId);
    }
  });
  actionUnsubs.set(reqId, unsub);

  setTimeout(() => {
    const u = actionUnsubs.get(reqId);
    if (u) { u(); actionUnsubs.delete(reqId); }
  }, 30000);
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
const TAB_TITLES = {
  profile:    'Perfil',
  collection: 'Colección',
  ranking:    'Ranking',
  shop:       'Tienda',
  auction:    'Subasta'
};

function navigateTo(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  $('tab-' + tab)?.classList.add('active');
  $('topbar-title').textContent = TAB_TITLES[tab] || tab;

  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('show');

  if (tab === 'profile')    renderProfile();
  if (tab === 'collection') renderCollection();
  if (tab === 'ranking')    renderRanking();
  if (tab === 'shop')       renderShop();
  if (tab === 'auction')    renderAuction();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.nav-item').forEach(b => {
  b.addEventListener('click', () => navigateTo(b.dataset.tab));
});

$('hamburger').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
  $('overlay').classList.toggle('show');
});
$('overlay').addEventListener('click', () => {
  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('show');
});

/* ============================================================
   MODAL DE PERFIL
   ============================================================ */
const modalEl   = $('user-modal');
const modalBody = $('modal-body');

function openUserModal(userId, rankInfo = null) {
  modalOpenUserId = userId;
  modalUserDoc = null;
  modalUserData = null;
  modalRankInfo = rankInfo;
  modalEl.classList.add('show');
  document.body.classList.add('modal-open');
  modalBody.innerHTML = `<div class="mp-loading"><span class="loading"></span>Cargando perfil…</div>`;
  loadModalData(userId);
}

async function loadModalData(userId) {
  try {
    const [uSnap, dSnap] = await Promise.all([
      get(ref(db, `users/${userId}`)),
      get(ref(db, `users/${userId}/data`))
    ]);
    if (String(modalOpenUserId) !== String(userId)) return;
    modalUserDoc  = uSnap.val()  || {};
    modalUserData = dSnap.val()  || {};
    renderModalProfile();
  } catch (e) {
    if (String(modalOpenUserId) !== String(userId)) return;
    modalBody.innerHTML = `<div class="mp-empty"><span class="icon">${ico('x',40)}</span>No se pudo cargar el perfil.</div>`;
  }
}

function closeUserModal() {
  modalOpenUserId = null;
  modalUserDoc = null;
  modalUserData = null;
  modalRankInfo = null;
  // Liberar listeners de imágenes del modal (evita acumular al abrir varios perfiles)
  modalImageUnsubs.forEach(u => { try { u(); } catch {} });
  modalImageUnsubs.clear();
  modalEl.classList.remove('show');
  document.body.classList.remove('modal-open');
  modalBody.innerHTML = '';
}

function renderModalProfile() {
  if (!modalOpenUserId) return;
  const isSelf = String(modalOpenUserId) === String(session.userId);
  const uDoc  = isSelf && userDoc  ? userDoc  : (modalUserDoc  || {});
  const uData = isSelf && userData ? userData : (modalUserData || {});

  const name = [uDoc.firstName, uDoc.lastName].filter(Boolean).join(' ')
    || uDoc.username
    || uDoc.name
    || `Usuario ${modalOpenUserId}`;
  const initial = (name || '?').charAt(0).toUpperCase();

  const waifus = Array.isArray(uData.waifus) ? uData.waifus : [];
  const unique = new Set(waifus.map(w => (w?.name || '').toLowerCase()).filter(Boolean));
  const coins  = Number(uData.coins) || 0;

  const rc = { comun:0, rara:0, epica:0, legendaria:0, exclusiva:0 };
  for (const w of waifus) if (w?.rarity && rc[w.rarity] != null) rc[w.rarity]++;

  const plusActive = uData.plusExpiresAt && uData.plusExpiresAt > Date.now();
  const plusDays = plusActive ? Math.ceil((uData.plusExpiresAt - Date.now()) / 86400000) : 0;

  const countMap = new Map();
  for (const w of waifus) {
    if (!w?.name) continue;
    const k = String(w.name);
    if (!countMap.has(k)) countMap.set(k, { name: k, rarity: w.rarity || 'comun', count: 0 });
    countMap.get(k).count++;
  }
  const order = { legendaria:0, exclusiva:1, epica:2, rara:3, comun:4 };
  const collection = [...countMap.values()].sort((a, b) => {
    const d = (order[a.rarity] ?? 9) - (order[b.rarity] ?? 9);
    return d !== 0 ? d : a.name.localeCompare(b.name);
  });

  const rankBadge = modalRankInfo
    ? `<span class="mp-rank-badge">${ico('trophy',11)} #${modalRankInfo.place} · ${modalRankInfo.total} jugadores</span>`
    : (isSelf ? `<span class="mp-rank-badge">${ico('user',11)} Tu perfil</span>` : '');

  const avatarInner = uDoc.photoUrl
    ? `<img src="${esc(uDoc.photoUrl)}" alt="" loading="lazy">`
    : initial;

  let html = `
    <div class="mp-header">
      <div class="mp-avatar">${avatarInner}</div>
      <div class="mp-info">
        <div class="mp-name">${esc(name)}${plusActive ? ` <span class="plus-badge">${ico('diamond',10)} Plus ${plusDays}d</span>` : ''}</div>
        <div class="mp-user">${uDoc.username ? '@' + esc(uDoc.username) : ('ID: ' + modalOpenUserId)}</div>
        ${rankBadge}
      </div>
    </div>

    <div class="mp-stats">
      <div class="mp-stat gold"><div class="num">${fmt(coins)}</div><div class="lbl">${ico('coin',11)} Monedas</div></div>
      <div class="mp-stat"><div class="num">${waifus.length}</div><div class="lbl">${ico('layers',11)} Copias</div></div>
      <div class="mp-stat pink"><div class="num">${unique.size}</div><div class="lbl">${ico('sparkles',11)} Únicas</div></div>
    </div>

    <div class="section-title">Rarezas</div>
    <div class="stats-grid">
      <div class="stat"><div class="num" style="color:var(--comun);text-shadow:0 0 15px var(--comun)">${rc.comun}</div><div class="lbl">${ico('circle',11)} Común</div></div>
      <div class="stat"><div class="num" style="color:var(--rara);text-shadow:0 0 15px var(--rara)">${rc.rara}</div><div class="lbl">${ico('flame',11)} Rara</div></div>
      <div class="stat"><div class="num" style="color:var(--epica);text-shadow:0 0 15px var(--epica)">${rc.epica}</div><div class="lbl">${ico('diamond',11)} Épica</div></div>
      <div class="stat"><div class="num" style="color:var(--legendaria);text-shadow:0 0 15px var(--legendaria)">${rc.legendaria}</div><div class="lbl">${ico('crown',11)} Legendaria</div></div>
      <div class="stat"><div class="num" style="color:var(--exclusiva);text-shadow:0 0 15px var(--exclusiva)">${rc.exclusiva}</div><div class="lbl">${ico('star',11)} Exclusiva</div></div>
    </div>
  `;

  if (collection.length === 0) {
    html += `<div class="section-title">${ico('package',11)} Colección</div>
      <div class="mp-empty"><span class="icon">${ico('package',40)}</span>Aún no tiene waifus.</div>`;
  } else {
    // ✅ COLECCIÓN COMPLETA (sin límite)
    html += `<div class="section-title">${ico('package',11)} Colección (${collection.length})</div>
      <div class="mp-collection">`;
    for (const w of collection) {
      watchImage(w.name, modalImageUnsubs);
      const url = imageUrls[w.name] || '';
      const wInitial = (w.name || '?').charAt(0).toUpperCase();
      html += `<div class="wcard" data-r="${w.rarity}" data-img="${esc(w.name)}">
        <div class="img">
          ${url
            ? `<img src="${esc(url)}" alt="" loading="lazy">`
            : `<span class="placeholder">${wInitial}</span>`}
        </div>
        <div class="info">
          <div class="name" title="${esc(w.name)}">${esc(w.name)}</div>
          <div class="meta">
            <span class="rarity">${RARITY_LABEL[w.rarity] || w.rarity}</span>
            <span class="count">x${w.count}</span>
          </div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  modalBody.innerHTML = html;
}

document.addEventListener('keydown', (e) => {

    <div class="stats-grid">

      <div class="stat"><div class="num">${waifus.length}</div><div class="lbl">${ico('layers',12)} Copias</div></div>

      ${pct.epica>0 ? `<div style="width:${pct.epica}%;background:var(--epica)"></div>` : ''}
      ${pct.legendaria>0 ? `<div style="width:${pct.legendaria}%;background:var(--legendaria)"></div>` : ''}
      ${pct.exclusiva>0 ? `<div style="width:${pct.exclusiva}%;background:var(--exclusiva)"></div>` : ''}
    </div>

    <div class="stats-grid">
      <div class="stat"><div class="num" style="color:var(--comun);text-shadow:0 0 15px var(--comun)">${rc.comun}</div><div class="lbl">${ico('circle',12)} Común</div></div>
      <div class="stat"><div class="num" style="color:var(--rara);text-shadow:0 0 15px var(--rara)">${rc.rara}</div><div class="lbl">${ico('flame',12)} Rara</div></div>
      <div class="stat"><div class="num" style="color:var(--epica);text-shadow:0 0 15px var(--epica)">${rc.epica}</div><div class="lbl">${ico('diamond',12)} Épica</div></div>

/* ---------- COLECCIÓN ---------- */
function renderCollection() {
  const c = $('tab-collection');
  const waifus = Array.isArray(userData?.waifus) ? userData.waifus : [];

  if (waifus.length === 0) {
    c.innerHTML = `<div class="card"><div class="empty">
      <span class="icon">${ico('package',44)}</span>
      Aún no tienes waifus.<br>¡Captura salvajes cada hora en el bot!
    </div></div>`;
    return;
  }

  const countMap = new Map();
  for (const w of waifus) {
    if (!w?.name) continue;
    const k = String(w.name);
    if (!countMap.has(k)) countMap.set(k, { name: k, rarity: w.rarity || 'comun', count: 0 });
    countMap.get(k).count++;
  }
  const all = [...countMap.values()].sort((a, b) => a.name.localeCompare(b.name));

  const filters = [
    { k: 'all',        label: 'Todas',      ic: 'filter' },
    { k: 'legendaria', label: 'Legendaria', ic: 'crown' },
    { k: 'epica',      label: 'Épica',      ic: 'diamond' },
    { k: 'rara',       label: 'Rara',       ic: 'flame' },
    { k: 'comun',      label: 'Común',      ic: 'circle' },
    { k: 'exclusiva',  label: 'Exclusiva',  ic: 'star' }
  ];

  let html = `<div class="card"><div class="filters">`;
  for (const f of filters) {
    const count = f.k === 'all' ? all.length : all.filter(x => x.rarity === f.k).length;
    if (f.k !== 'all' && count === 0) continue;
    html += `<button data-f="${f.k}" class="${collectionFilter === f.k ? 'active' : ''}">${ico(f.ic,12)}${f.label} (${count})</button>`;
  }
  html += `</div>`;

  const list = collectionFilter === 'all' ? all : all.filter(x => x.rarity === collectionFilter);

  if (list.length === 0) {
    html += `<div class="empty"><span class="icon">${ico('filter',40)}</span>Sin waifus en esta rareza.</div>`;
  } else {
    html += `<div class="grid">`;
    const covers = new Set(userData.covers || []);
    const coversOff = new Set(userData.coversOff || []);
    for (const w of list) {
      watchImage(w.name);
      const url = imageUrls[w.name] || '';
      const hasCover = covers.has(w.name) && !coversOff.has(w.name);
      const initial = (w.name || '?').charAt(0).toUpperCase();
      html += `<div class="wcard" data-r="${w.rarity}" data-img="${esc(w.name)}">
        ${hasCover ? `<span class="cover-badge">${ico('star',10)}</span>` : ''}
        <div class="img">
          ${url
            ? `<img src="${esc(url)}" alt="" loading="lazy">`
            : `<span class="placeholder">${initial}</span>`}
        </div>
        <div class="info">
          <div class="name" title="${esc(w.name)}">${esc(w.name)}</div>
          <div class="meta">
            <span class="rarity">${RARITY_LABEL[w.rarity] || w.rarity}</span>
            <span class="count">x${w.count}</span>
          </div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;

  c.innerHTML = html;
  c.querySelectorAll('.filters button').forEach(b => {
    b.addEventListener('click', () => { collectionFilter = b.dataset.f; renderCollection(); });
  });
}

/* ---------- RANKING ---------- */
function renderRanking() {
  const c = $('tab-ranking');
  const top = ranking?.top || [];
  if (!top.length) {
    c.innerHTML = `<div class="card"><div class="empty"><span class="icon">${ico('trophy',44)}</span>Sin datos de ranking aún.</div></div>`;
    return;
  }
  const myId = session.userId;
  const totalUsers = ranking.totalUsers || top.length;

  let html = `<div class="card">
    <div class="stats-grid">
      <div class="stat"><div class="num">${fmt(totalUsers)}</div><div class="lbl">${ico('users',12)} Jugadores</div></div>
      <div class="stat"><div class="num">${fmt(ranking.totalWaifus || 0)}</div><div class="lbl">${ico('layers',12)} Waifus totales</div></div>
    </div>
    <div class="section-title">${ico('trophy',11)} Top ${Math.min(top.length, 50)}</div>
    <div class="rank-list">`;

  for (let i = 0; i < Math.min(top.length, 50); i++) {
    const u = top[i];
    const isMe = String(u.userId) === String(myId);
    const placeClass = i === 0 ? 'p1' : i === 1 ? 'p2' : i === 2 ? 'p3' : '';
    const placeIcon = i < 3 ? ico('award', 20) : (i + 1);

    const displayName = u.name || u.display || `Usuario ${u.userId}`;
    const initial = (displayName || '?').charAt(0).toUpperCase();
    const avatarInner = u.photoUrl
      ? `<img src="${esc(u.photoUrl)}" alt="" loading="lazy">`
      : initial;

    html += `<div class="rank-card ${placeClass} ${isMe ? 'is-me' : ''}" data-uid="${u.userId}" data-place="${i + 1}">
      <div class="place">${placeIcon}</div>
      <div class="avatar-md">${avatarInner}</div>
      <div class="body">
        <div class="top-line">
          <div class="rn-name">${esc(displayName)}${isMe ? ' · tú' : ''}</div>
        </div>
        <div class="rn-user">${u.username ? '@' + esc(u.username) : ('ID: ' + u.userId)}</div>
        <div class="stats">
          <span class="sp pink">${ico('layers',11)} ${fmt(u.count)} <span class="lbl-s">copias</span></span>
          <span class="sp">${ico('sparkles',11)} ${fmt(u.unique)} <span class="lbl-s">únicas</span></span>
          ${typeof u.coins === 'number' ? `<span class="sp gold">${ico('coin',11)} ${fmt(u.coins)}</span>` : ''}
        </div>
      </div>
      <div class="chev">${ico('chevron',18)}</div>
    </div>`;
  }

  html += `</div>
    <p class="hint" style="text-align:left;margin-top:14px">Toca cualquier jugador para ver su perfil completo.</p>
  </div>`;
  c.innerHTML = html;

  c.querySelectorAll('.rank-card').forEach(card => {
    card.addEventListener('click', () => {
      const uid = parseInt(card.dataset.uid, 10);
      const place = parseInt(card.dataset.place, 10);
      if (!isNaN(uid)) openUserModal(uid, { place, total: totalUsers });
    });
  });
}

    </div>

    <div id="shop-content"></div>
  </div>`;

  c.innerHTML = html;

  c.querySelectorAll('#shop-subtabs .subtab').forEach(btn => {
    btn.addEventListener('click', () => {
      shopSubTab = btn.dataset.sub;
      renderShop();
    });
  });

  const content = $('shop-content');
  if (shopSubTab === 'waifus') renderShopWaifus(content);
  if (shopSubTab === 'boxes')  renderShopBoxes(content);
}

function renderShopWaifus(container) {
  const allSales = Object.values(sales || {});
  const myCoins = Number(userData?.coins) || 0;
  const myId = session.userId;

  if (allSales.length === 0) {
    container.innerHTML = `<div class="empty"><span class="icon">${ico('store',44)}</span>No hay waifus en venta ahora mismo.</div>`;
    return;
  }

  allSales.sort((a, b) => a.price - b.price);

  let html = `<div class="grid">`;
  for (const s of allSales.slice(0, 90)) {
    const wname = s.waifu?.name || '?';
    const rarity = s.waifu?.rarity || 'comun';
    watchImage(wname);
    const url = imageUrls[wname] || '';
    const initial = (wname || '?').charAt(0).toUpperCase();
    const seller = s.sellerUsername ? '@' + esc(s.sellerUsername) : esc(s.sellerName || 'Anónimo');
    const isMine = String(s.sellerId) === String(myId);
    const canAfford = myCoins >= (s.price || 0);
    const disabled = isMine || !canAfford;
    const btnText = isMine
      ? 'Tu venta'
      : (canAfford ? `Comprar ${fmt(s.price)}` : `Faltan ${fmt((s.price||0)-myCoins)}`);

    html += `<div class="wcard" data-r="${rarity}" data-img="${esc(wname)}">
      <div class="img">
        ${url
          ? `<img src="${esc(url)}" alt="" loading="lazy">`
          : `<span class="placeholder">${initial}</span>`}
      </div>
      <div class="info">
        <div class="name" title="${esc(wname)}">${esc(wname)}</div>
        <div class="meta">
          <span class="rarity">${RARITY_LABEL[rarity] || rarity}</span>
          <span class="count">${fmt(s.price)}${ico('coin',10)}</span>
        </div>
        <div class="seller-line">${seller}</div>
        <button class="btn-buy-card" data-buy="${esc(s.saleId)}" ${disabled ? 'disabled' : ''}>
          ${esc(btnText)}
        </button>
      </div>
    </div>`;
  }
  html += `</div>`;

  container.innerHTML = html;

  container.querySelectorAll('.btn-buy-card').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const saleId = btn.dataset.buy;
      if (!saleId || btn.disabled) return;
      btn.disabled = true;
      const original = btn.textContent;
      btn.innerHTML = '<span class="loading"></span>';
      try {
        await requestBuy(saleId);
      } catch (err) {
        showToast(err.message || 'Error', 'err', 4000, 'x');
      } finally {
        setTimeout(() => { btn.disabled = false; btn.innerHTML = original; }, 5000);
      }
    });
  });
}

function renderShopBoxes(container) {
  const myCoins = Number(userData?.coins) || 0;

  let html = `<div class="section-title">${ico('gift',13)} Cajas misteriosas</div>
    <div class="boxes-grid">`;

  for (const key of ['comun', 'premium', 'legendaria']) {
    const box = CAJAS[key];
    const canAfford = myCoins >= box.price;
    const disabled = !canAfford;
    html += `<div class="box-card" data-box="${key}" data-can="${disabled ? 0 : 1}">
      <div class="bicon"><img src="${esc(box.img)}" alt="${esc(box.name)}" loading="lazy"></div>
      <div class="bname">${box.name}</div>
      <div class="bdesc">${box.desc}</div>
      <div class="bprice">${fmt(box.price)} ${ico('coin',14)}</div>
    </div>`;
  }

  html += `</div>
    <p class="hint" style="text-align:left;margin-top:18px">
      Toca una caja para abrirla al instante.<br>
      El bot procesará la apertura, te avisará por DM con las imágenes y las waifus aparecerán en tu colección en segundos.<br>
      Cada apertura consume las monedas correspondientes.
    </p>`;

  container.innerHTML = html;

  container.querySelectorAll('.box-card').forEach(card => {
    const key = card.dataset.box;
    const canOpen = card.dataset.can === '1';
    if (!canOpen) {
      card.style.opacity = '.55';
      card.style.cursor = 'not-allowed';
      return;
    }
    card.addEventListener('click', async () => {
      if (card.dataset.opening) return;
      card.dataset.opening = '1';
      const original = card.innerHTML;
      card.style.opacity = '.6';
      card.style.pointerEvents = 'none';
      try {
        await requestBox(key);
      } catch (err) {
        showToast(err.message || 'Error', 'err', 4000, 'x');
      } finally {
        setTimeout(() => {
          card.innerHTML = original;
          card.style.opacity = '1';
          card.style.pointerEvents = '';
          delete card.dataset.opening;
        }, 5000);
      }
    });
  });
}

/* ---------- SUBASTA ---------- */
function renderAuction() {
  if (auctionTimer) { clearInterval(auctionTimer); auctionTimer = null; }
  const c = $('tab-auction');
  const a = auction?.active;

  if (!a) {
    c.innerHTML = `<div class="card"><div class="empty">
      <span class="icon">${ico('star',44)}</span>
      No hay subasta activa.<br>
      La próxima empieza a las <b>8:00 AM (MX)</b>.
    </div></div>`;
    return;
  }

  const bids = Object.values(a.bids || {}).sort((x, y) => y.amount - x.amount);
  const given = a.copiesGivenBefore || 0;
  const copyNum = given + 1;

  let html = `<div class="card">
    <div class="auction-hero">
      <div class="auction-tag">${a.testMode ? ico('shield',12) + ' Prueba' : ico('star',12) + ' En vivo'} · Copia ${copyNum}/${a.maxCopies || 3}</div>
      <div class="auction-name">${esc(a.waifuName)}</div>
      <div class="countdown" id="auction-countdown">--:--</div>
    </div>

    <div class="stats-grid">
      <div class="stat"><div class="num">${bids.length}</div><div class="lbl">${ico('chart',12)} Pujas</div></div>
      <div class="stat"><div class="num">${bids[0] ? fmt(bids[0].amount) : 0}</div><div class="lbl">${ico('trophy',12)} Mejor puja</div></div>
    </div>

    <div class="section-title">Top postores</div>`;

  if (bids.length === 0) {
    html += `<div class="empty">Sin pujas aún. ¡Sé el primero desde el bot!</div>`;
  } else {
    for (let i = 0; i < Math.min(bids.length, 5); i++) {
      const b = bids[i];
      const cls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const display = b.username ? '@' + esc(b.username) : esc(b.name || ('Usuario ' + b.userId));
      html += `<div class="row">
        <div class="left"><div class="rank ${cls}">${i < 3 ? ico('award',16) : (i + 1)}</div><div class="info"><div class="name">${display}</div></div></div>
        <div class="right">${fmt(b.amount)} ${ico('coin',12)}</div>
      </div>`;
    }
  }
  html += `<p class="hint" style="text-align:left;margin-top:14px">Para pujar, usa los botones del mensaje en el grupo.</p></div>`;
  c.innerHTML = html;

  const cdEl = $('auction-countdown');
  if (!cdEl) return;
  const updateCd = () => {
    const rem = Math.max(0, a.endTime - Date.now());
    const h = Math.floor(rem / 3600000);
    const m = Math.floor((rem % 3600000) / 60000);
    const s = Math.floor((rem % 60000) / 1000);
    cdEl.textContent = h > 0
      ? `${h}h ${String(m).padStart(2,'0')}m`
      : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (rem < 5 * 60 * 1000) cdEl.classList.add('urgent');
    else cdEl.classList.remove('urgent');
  };
  updateCd();
  auctionTimer = setInterval(updateCd, 1000);
}

/* ============================================================
   LOGOUT
   ============================================================ */
$('btn-logout').addEventListener('click', async () => {
  unsubs.forEach(u => { try { u(); } catch {} });
  unsubs.length = 0;
  imageUnsubs.forEach(u => { try { u(); } catch {} });
  imageUnsubs.clear();
  actionUnsubs.forEach(u => { try { u(); } catch {} });
  actionUnsubs.clear();
  if (auctionTimer) { clearInterval(auctionTimer); auctionTimer = null; }
  closeUserModal();

  if (session?.token) { try { await remove(ref(db, `sessions/${session.token}`)); } catch {} }
  localStorage.removeItem('jinx_session');
  session = userDoc = userData = null;
  if (unsubRequest) { unsubRequest(); unsubRequest = null; }

  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('show');
  navigateTo('profile');

  show('screen-login');
  inputEl.value = '';
  $('btn-request').disabled = false;
  $('btn-request').innerHTML = ico('play',15) + 'Enviar código';
  codeInputs.forEach(i => i.value = '');
});

/* ============================================================
   HIDRATAR ICONOS
   ============================================================ */
hydrateIcons();

/* ============================================================
   AUTOLOGIN
   ============================================================ */
(async () => {
  const token = localStorage.getItem('jinx_session');
  if (!token) return;
  try { await startSession(token); }
  catch { localStorage.removeItem('jinx_session'); }
})();
</script>
