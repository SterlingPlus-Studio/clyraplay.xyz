<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0f">
<meta name="color-scheme" content="dark">
<meta name="msapplication-navbutton-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jinx Waifus Web</title>
<link rel="icon" href="data:,">
<style>
  @font-face {
    font-family: 'ClyraPlay';
    src: url('https://raw.githubusercontent.com/SterlingPlus-Studio/clyraplay.xyz/main/Fuente/fuente.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --pink:#ec4899; --purple:#8b5cf6; --cyan:#06b6d4; --gold:#f59e0b;
    --ok:#10b981; --err:#ef4444;

    --bg:#0a0a0f;
    --bg-2:#0f0f17;
    --surface:rgba(20,20,30,0.6);
    --surface-2:rgba(28,28,40,0.75);
    --surface-3:rgba(36,36,52,0.85);
    --border:rgba(255,255,255,0.07);
    --border-2:rgba(255,255,255,0.12);
    --border-accent:rgba(139,92,246,0.35);

    --text:#f5f5f7;
    --text-2:#c7c7d2;
    --muted:#8b8b9e;
    --muted-2:#5a5a6e;

    --comun:#ffb6c1; --rara:#fb7185; --epica:#a78bfa; --legendaria:#fbbf24; --exclusiva:#22d3ee;

    --sidebar-w: 260px;
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 20px;
    --radius-xl: 26px;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.2);
    --shadow: 0 4px 20px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);

    --app-vh: 1vh;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0%{background-position: -200% 0} 100%{background-position: 200% 0} }
  @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes modalFade { from{opacity:0} to{opacity:1} }
  @keyframes modalIn { from{opacity:0;transform:scale(.96) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
  @keyframes toastIn { from{opacity:0;transform:translateY(-16px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(-10px)} }
  @keyframes resultIn{ 0%{opacity:0;transform:scale(.7) translateY(15px)} 60%{opacity:1;transform:scale(1.05) translateY(0)} 100%{transform:scale(1)} }
  @keyframes boxShake{ 0%,100%{ transform: rotate(-5deg) scale(1); } 50%{ transform: rotate(5deg) scale(1.07); } }
  @keyframes navIn { from{opacity:0;transform:translate(-50%,20px)} to{opacity:1;transform:translate(-50%,0)} }

  html { 
    background: var(--bg); 
    width: 100%; 
    overflow-x: hidden; 
    -webkit-text-size-adjust: 100%; 
    color-scheme: dark;
  }
  body {
    font-family: 'ClyraPlay', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--text); background: var(--bg); min-height: 100vh; width: 100%;
    max-width: 100vw; overflow-x: hidden; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; position: relative; margin: 0; padding: 0;
    letter-spacing: -0.011em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body.modal-open { overflow: hidden; }
  .ic { display: inline-block; vertical-align: middle; flex-shrink: 0; }

  .bg-layers { position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(ellipse 800px 600px at 12% 8%, rgba(236,72,153,.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 88% 12%, rgba(139,92,246,.20), transparent 60%),
      radial-gradient(ellipse 900px 600px at 50% 100%, rgba(6,182,212,.13), transparent 60%),
      linear-gradient(180deg, #0a0a0f 0%, #0d0d16 50%, #0a0a0f 100%); }
  .bg-grid { position: fixed; inset: 0; z-index: -1; opacity: .35; pointer-events: none;
    background-image:
      linear-gradient(rgba(139,92,246,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,.055) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%); }
  .scanline { display: none; }

  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.16); background-clip: padding-box; }
  * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.14) transparent; }

  #toast-wrap{ position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 99999;
    display:flex; flex-direction:column; gap: 10px; align-items: center; pointer-events: none; padding: 0 12px; width: 100%; max-width: 480px; }
  .toast{ padding: 12px 18px; border-radius: var(--radius);
    background: rgba(28,28,40,.9);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--border-2); color: var(--text); font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow-lg);
    animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2); width: fit-content; max-width: 100%; text-align: center;
    pointer-events: auto; display: flex; align-items: center; gap: 10px; justify-content: center; }
  .toast.ok{ border-color: rgba(16,185,129,.4); }
  .toast.ok .ic{ color: var(--ok); }
  .toast.err{ border-color: rgba(239,68,68,.4); }
  .toast.err .ic{ color: var(--err); }
  .toast.hide{ animation: toastOut .3s ease forwards; }

  .layout{ display: flex; min-height: 100vh; position: relative; width: 100%; overflow-x: clip; }

  .sidebar{ width: var(--sidebar-w);
    background: rgba(15,15,23,.75);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform .35s cubic-bezier(.2,.9,.3,1.2); }
  .sidebar-brand{ padding: 18px 20px 14px; border-bottom: 1px solid var(--border); position: relative; }

  .sidebar-brand .logo{ font-size: 22px; font-weight: 900; letter-spacing: 1.5px;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan), var(--pink));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite; text-transform: uppercase; line-height: 1.1;
    display: block; }
  .sidebar-brand .logo::before{ display: none; }
  .sidebar-brand .sub{ font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; font-weight: 600; }
  .sidebar-brand .badge-dot{ display: none; }
  .sidebar-user{ padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .sidebar-user .avatar-sm{ width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff;
    border: 1.5px solid rgba(255,255,255,.12); box-shadow: var(--shadow-sm); flex-shrink: 0; overflow: hidden; }
  .sidebar-user .avatar-sm img{ width:100%; height:100%; object-fit: cover; display:block; }
  .sidebar-user .uinfo{ min-width: 0; flex: 1; }
  .sidebar-user .uname{ font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .sidebar-user .utag{ color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .sidebar-nav{ flex: 1; padding: 8px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; -webkit-overflow-scrolling: touch; }
  .nav-item{ display: flex; align-items: center; justify-content: flex-start; gap: 12px;
    padding: 11px 14px; border-radius: var(--radius-sm); color: var(--text-2); font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid transparent;
    background: transparent; transition: all .18s ease; text-align: left; font-family: inherit; width: 100%; position: relative; }
  .nav-item .icon{ font-size: 16px; width: 20px; min-width: 20px; text-align: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: color .18s; }
  .nav-item > span:last-child{ flex: 1; text-align: left; }
  .nav-item:hover:not(.active){ color: var(--text); background: rgba(255,255,255,.04); }
  .nav-item:hover:not(.active) .icon{ color: var(--text-2); }
  .nav-item.active{ color: var(--text); background: rgba(255,255,255,.06);
    border-color: var(--border-2); box-shadow: var(--shadow-sm); }
  .nav-item.active .icon{ color: #fff; }
  .nav-item.active::before{ content:''; position:absolute; left: 0; top: 25%; bottom: 25%; width: 3px;
    background: linear-gradient(180deg, var(--pink), var(--purple)); border-radius: 0 3px 3px 0; }
  .sidebar-footer{ padding: 12px 10px; padding-bottom: max(12px, env(safe-area-inset-bottom, 12px)); border-top: 1px solid var(--border); }
  .btn-logout{ width: 100%; display: flex; align-items: center; justify-content: flex-start; gap: 10px;
    padding: 11px 14px; border-radius: var(--radius-sm); background: transparent; border: 1px solid transparent;
    color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all .18s ease; }
  .btn-logout:hover{ background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.25); color: #fca5a5; }
  .btn-logout .icon{ font-size: 15px; display:flex; align-items:center; width: 20px; min-width: 20px; justify-content: center; }

  .main{ flex: 1; margin-left: var(--sidebar-w); padding: 14px 28px 60px; min-width: 0; width: 100%; max-width: 100%; }
  .main-inner{ max-width: 1120px; margin: 0 auto; width: 100%; }

  .topbar{ display: none; align-items: center; gap: 10px; padding: 10px 16px;
    background: rgba(15,15,23,.8);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
    position: fixed; top: 0; left: 0; right: 0; z-index: 90; }
  .hamburger{ width: 40px; height: 40px; border-radius: var(--radius-sm); background: rgba(255,255,255,.05); border: 1px solid var(--border);
    color: var(--text); font-size: 18px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; box-shadow: none; flex-shrink: 0; transition: all .18s; }
  .hamburger:hover{ background: rgba(255,255,255,.09); transform: none; }
  .topbar-title{ font-size: 14px; font-weight: 700; color: var(--text); text-align: left; flex: 1; }
  .topbar-logout{ display: none; }

  .overlay{ display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: 95; }
  .overlay.show{ display: block; animation: modalFade .2s; }

  .bottom-nav{
    display: none;
    position: fixed;
    bottom: max(14px, env(safe-area-inset-bottom, 14px));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20,20,30,.85);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border-2);
    border-radius: 22px;
    padding: 6px;
    gap: 2px;
    z-index: 100;
    box-shadow: 0 12px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
    width: calc(100% - 24px);
    max-width: 440px;
    justify-content: space-around;
    align-items: stretch;
    animation: navIn .35s cubic-bezier(.2,.9,.3,1.2);
  }
  .bottom-nav-item{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 4px;
    border-radius: 16px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
    cursor: pointer;
    transition: all .2s cubic-bezier(.2,.9,.3,1.2);
    box-shadow: none;
    text-transform: uppercase;
    letter-spacing: .04em;
    font-family: inherit;
    min-width: 0;
  }
  .bottom-nav-item::after{ display: none; }
  .bottom-nav-item:hover{ transform: none; box-shadow: none; background: rgba(255,255,255,.04); }
  .bottom-nav-item .icon{ display: flex; align-items: center; justify-content: center; height: 20px; }
  .bottom-nav-item .icon svg{ width: 18px; height: 18px; }
  .bottom-nav-item span:last-child{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .bottom-nav-item.active{
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff;
    box-shadow: 0 3px 12px rgba(236,72,153,.35);
    transform: translateY(-1px);
  }
  .bottom-nav-item.active .icon{ color: #fff; }

  .card{ background: var(--surface);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px 22px; position:relative;
    box-shadow: var(--shadow); margin-bottom: 16px; width: 100%; }
  .card::before{ content:''; position:absolute; top:0; left:20px; right:20px; height:1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent); pointer-events: none; }
  .card::after{ display: none; }

  .page-wrap{ display: block; width: 100%; margin-bottom: 16px; }
  .screen{ display:none; width: 100%; }
  .screen.active{ display:block; animation: slideUp .35s cubic-bezier(.2,.9,.3,1); }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; animation: slideUp .3s cubic-bezier(.2,.9,.3,1); }

  label { display:block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; font-weight: 700; }
  input{ width:100%; padding: 13px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: rgba(255,255,255,.03); color: var(--text); font-size: 15px; outline: none; transition: all .18s ease; font-family: inherit; -webkit-appearance: none; font-weight: 500; }
  input::placeholder{ color: var(--muted-2); }
  input:focus{ border-color: rgba(139,92,246,.5); background: rgba(255,255,255,.05); }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

  button{ padding: 13px 18px; border: none; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: white; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .18s cubic-bezier(.2,.9,.3,1.2);
    letter-spacing: -0.01em; font-family: inherit;
    box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 2px 6px rgba(0,0,0,.2);
    -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden; }
  button::after{ content:''; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(255,255,255,.15), transparent 60%); pointer-events: none; }
  button:hover:not(:disabled){ transform: translateY(-1px); box-shadow: 0 2px 4px rgba(0,0,0,.25), 0 4px 12px rgba(0,0,0,.25); }
  button:active:not(:disabled){ transform: translateY(0) scale(.98); }
  button:disabled{ opacity: .5; cursor: not-allowed; box-shadow:none; }
  .btn-full{ width:100%; margin-top: 16px; }
  .btn-ghost{ background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--text-2); box-shadow:none; }
  .btn-ghost::after{ display: none; }
  .btn-ghost:hover{ background: rgba(255,255,255,.08); border-color: var(--border-2); color: var(--text); box-shadow: var(--shadow-sm); transform: none; }

  .msg{ margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; display: none; font-weight: 600; line-height: 1.5; }
  .msg.err{ display:block; background: rgba(239,68,68,.1); color:#fca5a5; border:1px solid rgba(239,68,68,.25); }
  .msg.ok { display:block; background: rgba(6,182,212,.1); color:#67e8f9; border:1px solid rgba(6,182,212,.25); }

  .tabs{ display:flex; gap:4px; margin-bottom: 18px; background: rgba(255,255,255,.03); padding:4px; border-radius: var(--radius); border:1px solid var(--border); flex-wrap: wrap; }

  .tab{ flex:1; min-width: 80px; padding:10px 8px; border-radius: var(--radius-sm); cursor:pointer; font-size: 12px; color: var(--muted);
    text-align:center; background: transparent; border:none; font-weight: 700;
    transition: all .18s ease; font-family: inherit; box-shadow:none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .tab::after{ display: none; }
  .tab:hover:not(.active){ color: var(--text); background: rgba(255,255,255,.04); transform: none; }
  .tab.active{ background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3); transform: none; }

  .subtabs{ display:flex; gap:8px; margin-bottom: 20px; flex-wrap:wrap; }
  .subtab{ padding: 10px 16px; border-radius: 100px; background: rgba(255,255,255,.03); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: all .18s ease; box-shadow: none; display: inline-flex; align-items: center; gap: 7px; }
  .subtab::after{ display: none; }
  .subtab:hover:not(.active){ color: var(--text); background: rgba(255,255,255,.06); border-color: var(--border-2); transform: none; }
  .subtab.active{ background: rgba(255,255,255,.08); color: var(--text);
    border-color: var(--border-2); }
  .subtab.active .ic{ color: var(--purple); }

  .subtabs-inner{ display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap;
    padding: 5px; border-radius: var(--radius); background: rgba(255,255,255,.03); border: 1px solid var(--border); }
  .subtab-inner{ flex: 1; min-width: 130px; padding: 11px 16px; border-radius: var(--radius-sm);
    background: transparent; border: 1px solid transparent;
    color: var(--muted); font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: all .18s ease; box-shadow: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .subtab-inner::after{ display: none; }
  .subtab-inner:hover:not(.active){ color: var(--text); background: rgba(255,255,255,.04); transform: none; }
  .subtab-inner.active{ color: var(--text); background: rgba(255,255,255,.08);
    border-color: var(--border-2); box-shadow: var(--shadow-sm); }
  .subtab-inner.active .ic{ color: var(--purple); }
  .subtab-inner[data-dup="agente"].active .ic{ color: var(--gold); }

  .dup-price-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .dup-price-card{ padding: 14px; border-radius: var(--radius);
    background: rgba(255,255,255,.03); border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px; transition: all .18s; }
  .dup-price-card:hover{ background: rgba(255,255,255,.05); border-color: var(--border-2); }
  .dup-price-card[data-r="comun"]     { border-left: 3px solid var(--comun); }
  .dup-price-card[data-r="rara"]      { border-left: 3px solid var(--rara); }
  .dup-price-card[data-r="epica"]     { border-left: 3px solid var(--epica); }
  .dup-price-card[data-r="legendaria"]{ border-left: 3px solid var(--legendaria); }
  .dup-price-card .dpc-head{ display: flex; align-items: center; gap: 8px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--text-2); }
  .dup-price-card .dpc-head .rarity-dot{ width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dup-price-card .dpc-input-wrap{ position: relative; display: flex; align-items: center; }
  .dup-price-card .dpc-input-wrap input{ padding: 10px 34px 10px 12px; font-size: 15px; font-weight: 800;
    text-align: left; border-radius: var(--radius-sm); background: rgba(0,0,0,.25); color: var(--gold);
    border: 1px solid var(--border); font-variant-numeric: tabular-nums; width: 100%; outline: none; }
  .dup-price-card .dpc-input-wrap input:focus{ border-color: rgba(139,92,246,.4); background: rgba(255,255,255,.05); }
  .dup-price-card .dpc-input-wrap .ic{ position: absolute; right: 12px; color: var(--gold); pointer-events: none; }
  .dup-price-card .dpc-qty{ font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .dup-price-card .dpc-qty b{ color: var(--cyan); font-weight: 800; font-size: 14px; }
  .dup-price-card .dpc-qty.zero b{ color: var(--muted-2); font-weight: 700; }

  .agent-hero{ padding: 20px; border-radius: var(--radius); margin-bottom: 16px;
    background: linear-gradient(135deg, rgba(245,158,11,.08), rgba(236,72,153,.06));

function groupWaifusByRarity(waifus) {
  const map = new Map();
  for (const w of waifus) {
    if (!w?.name) continue;
    const k = String(w.name);
    const rar = w.rarity || 'comun';
    if (!map.has(k)) map.set(k, { name: k, rarity: rar, count: 0 });
    const entry = map.get(k);
    if ((RARITY_RANK[rar] ?? 99) < (RARITY_RANK[entry.rarity] ?? 99)) entry.rarity = rar;
    entry.count++;
  }
  const order = { exclusiva: 0, legendaria: 1, epica: 2, rara: 3, comun: 4 };
  return [...map.values()].sort((a, b) => {
    const d = (order[a.rarity] ?? 9) - (order[b.rarity] ?? 9);
    return d !== 0 ? d : a.name.localeCompare(b.name);
  });
}

function countRarityFromGroups(groups) {
  const rc = { comun: 0, rara: 0, epica: 0, legendaria: 0, exclusiva: 0 };
  for (const g of groups) if (rc[g.rarity] != null) rc[g.rarity] += g.count;
  return rc;
}

function computeDuplicatesInfo() {
  const waifus = Array.isArray(userData?.waifus) ? userData.waifus : [];

  const sorted = waifus
    .map((w, i) => ({ w, i }))
    .filter(x => x.w?.name && (x.w.rarity || 'comun') !== 'exclusiva')
    .sort((a, b) =>
      (RARITY_RANK[a.w.rarity || 'comun'] ?? 99) - (RARITY_RANK[b.w.rarity || 'comun'] ?? 99)
    );

  const keep = new Set();
  const byRarity = { comun: 0, rara: 0, epica: 0, legendaria: 0 };
  let totalDup = 0;

  for (const { w } of sorted) {
    const name = String(w.name);
    const rar  = w.rarity || 'comun';
    if (keep.has(name)) {
      byRarity[rar] = (byRarity[rar] || 0) + 1;
      totalDup++;
    } else {
      keep.add(name);
    }
  }

  let totalAgent = 0;
  for (const r of Object.keys(byRarity)) {
    totalAgent += byRarity[r] * (AGENT_PRICES[r] || 0);
  }

  return { byRarity, totalDup, totalAgent };
}

function normSearch(s) {
  return String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function matchShopFilter(name, rarity, price) {
  const [minP, maxP] = PRICE_RANGES[shopPriceFilter] || PRICE_RANGES.all;
  const p = Number(price) || 0;
  if (p < minP || p > maxP) return false;

  if (shopRarityFilter !== 'all' && rarity !== shopRarityFilter) return false;

  const q = normSearch(shopSearch).trim();
  if (!q) return true;
  if (normSearch(name).includes(q)) return true;
  const words = RARITY_SEARCH_WORDS[rarity] || [rarity];
  if (words.some(w => normSearch(w).startsWith(q) || q.includes(normSearch(w)))) return true;

  return false;
}

function getOwnedWaifuNames() {
  const waifus = Array.isArray(userData?.waifus) ? userData.waifus : [];
  return new Set(

      .filter(Boolean)
  );
}

      userId: data.userId, username: data.username || null,

  unsubs.push(onValue(ref(db, `users/${uid}/data`), (s) => {

                ((newData.skins || []).join(',')) + '|' + ((newData.skinsOff || []).join(',')) + '|' +
                (newData.predeterminada || '') + '|' + (newData.plusExpiresAt || 0) + '|' + (newData.ultraExpiresAt || 0);

function cardApplyRotation() {
  const inner = $('card-3d');
  if (inner) inner.style.transform = `rotateX(${cardRotX}deg) rotateY(${cardRotY}deg)`;
}

function cardStartDrag(e) {
  cardDragging = true;
  cardLastX = e.clientX;
  cardLastY = e.clientY;
  cardVelX = 0; cardVelY = 0;
  if (cardInertiaRaf) { cancelAnimationFrame(cardInertiaRaf); cardInertiaRaf = null; }
  try { e.target.setPointerCapture?.(e.pointerId); } catch {}
  e.preventDefault();
}

function cardMoveDrag(e) {
  if (!cardDragging) return;
  const dx = e.clientX - cardLastX;
  const dy = e.clientY - cardLastY;
  cardLastX = e.clientX;
  cardLastY = e.clientY;
  cardRotY += dx * 0.55;
  cardRotX -= dy * 0.55;
  cardRotX = Math.max(-85, Math.min(85, cardRotX));
  cardVelY = dx * 0.55;
  cardVelX = -dy * 0.55;
  cardApplyRotation();
  e.preventDefault();
}

function cardEndDrag(e) {
  if (!cardDragging) return;
  cardDragging = false;
  try { e?.target?.releasePointerCapture?.(e.pointerId); } catch {}
  const inertia = () => {
    if (cardDragging) return;
    cardVelY *= 0.95;
    cardVelX *= 0.95;
    cardRotY += cardVelY;
    cardRotX += cardVelX;
    cardRotX = Math.max(-85, Math.min(85, cardRotX));
    cardApplyRotation();
    if (Math.abs(cardVelY) > 0.05 || Math.abs(cardVelX) > 0.05) {
      cardInertiaRaf = requestAnimationFrame(inertia);
    } else {
      cardInertiaRaf = null;
    }
  };
  cardInertiaRaf = requestAnimationFrame(inertia);
}

async function submitSell(price) {
  if (sellSending) return;
  if (!sellWaifuName) return;

  const statusEl = $('sell-status');
  const btn = $('sell-confirm');

  const setStatus = (text, kind = 'err') => {
    if (!statusEl) return;
    if (!text) { statusEl.className = 'sell-status'; statusEl.textContent = ''; return; }
    statusEl.className = 'sell-status ' + kind;
    statusEl.textContent = text;
  };

  if (!Number.isFinite(price) || price < SELL_MIN_PRICE || price > SELL_MAX_PRICE) {
    setStatus(`El precio debe estar entre ${SELL_MIN_PRICE} y ${fmt(SELL_MAX_PRICE)} monedas.`, 'err');
    return;
  }

  sellSending = true;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading"></span>Poniendo en venta…'; }
  setStatus('Procesando…', 'ok');

  try {
    const res = await requestSell(sellWaifuName, price);
    setStatus(`¡Puesta en venta por ${fmt(res.price || price)} monedas!`, 'ok');
    showToast(`${sellWaifuName} en venta por ${fmt(res.price || price)}`, 'ok', 4000, 'check');
    setTimeout(() => {
      closeSellModal();
      if (currentTab === 'shop') renderShop();
    }, 900);
  } catch (e) {
    setStatus(e.message || 'No se pudo poner en venta.', 'err');
    if (btn) { btn.disabled = false; btn.innerHTML = ico('tag',15) + ' Poner en venta'; }
  } finally {
    sellSending = false;
  }
}

/* ============ CONFIRM MODAL CUSTOM ============ */
let confirmResolver = null;

function resolveConfirm(value) {
  if (!confirmResolver) return;
  const resolver = confirmResolver;
  confirmResolver = null;
  const modal = $('confirm-modal');
  const body  = $('confirm-modal-body');
  if (modal) modal.classList.remove('show');
  if (body)  body.innerHTML = '';
  if (!document.getElementById('user-modal')?.classList.contains('show') &&
      !document.getElementById('box-modal')?.classList.contains('show') &&
      !document.getElementById('card-modal')?.classList.contains('show') &&
      !document.getElementById('sell-modal')?.classList.contains('show')) {
    document.body.classList.remove('modal-open');
  }
  try { resolver(value); } catch {}
}

function showConfirm({ title = '¿Confirmar?', message = '', confirmText = 'Aceptar', cancelText = 'Cancelar', icon = 'tag' } = {}) {
  return new Promise((resolve) => {
    if (confirmResolver) {
      const prev = confirmResolver;
      confirmResolver = null;
      try { prev(false); } catch {}
    }
    confirmResolver = resolve;

    const modal = $('confirm-modal');
    const body  = $('confirm-modal-body');
    if (!modal || !body) { confirmResolver = null; resolve(false); return; }

    body.innerHTML = `
      <div class="confirm-icon">${ico(icon, 24)}</div>
      <div class="confirm-title">${esc(title)}</div>
      <div class="confirm-message">${esc(message)}</div>
      <div class="confirm-actions">
        <button type="button" class="btn-confirm-cancel" id="confirm-cancel-btn">
          ${ico('x', 14)}<span>${esc(cancelText)}</span>
        </button>
        <button type="button" class="btn-confirm-accept" id="confirm-accept-btn">
          ${ico('check', 14)}<span>${esc(confirmText)}</span>
        </button>
      </div>
    `;

    modal.querySelector('.modal-overlay').onclick = () => resolveConfirm(false);

    $('confirm-accept-btn')?.addEventListener('click', () => resolveConfirm(true));
    $('confirm-cancel-btn')?.addEventListener('click', () => resolveConfirm(false));

    modal.classList.add('show');
    document.body.classList.add('modal-open');
  });
}

const TAB_TITLES = {
  profile: 'Perfil', collection: 'Colección', ranking: 'Ranking', shop: 'Tienda', support: 'Soporte'
};

function navigateTo(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.bottom-nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  $('tab-' + tab)?.classList.add('active');
  $('topbar-title').textContent = TAB_TITLES[tab] || tab;

  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('show');

  if (tab === 'profile')    renderProfile();
  if (tab === 'collection') renderCollection();
  if (tab === 'ranking')    renderRanking();
  if (tab === 'shop')       renderShop();
  if (tab === 'support')    renderSupport();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.nav-item').forEach(b => {
  b.addEventListener('click', () => navigateTo(b.dataset.tab));
});
document.querySelectorAll('.bottom-nav-item').forEach(b => {
  b.addEventListener('click', () => navigateTo(b.dataset.tab));
});

$('hamburger').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
  $('overlay').classList.toggle('show');
});
$('overlay').addEventListener('click', () => {

  $('overlay').classList.remove('show');
});

const modalEl   = $('user-modal');
const modalBody = $('modal-body');

function openUserModal(userId, rankInfo = null) {
  modalOpenUserId = userId;
  modalUserDoc = null; modalUserData = null; modalRankInfo = rankInfo;
  modalEl.classList.add('show');
  document.body.classList.add('modal-open');
  modalBody.innerHTML = `<div class="mp-loading"><span class="loading"></span>Cargando perfil…</div>`;
  loadModalData(userId);
}

async function loadModalData(userId) {
  try {
    const [uSnap, dSnap] = await Promise.all([
      get(ref(db, `users/${userId}`)),
      get(ref(db, `users/${userId}/data`))
    ]);
    if (String(modalOpenUserId) !== String(userId)) return;
    modalUserDoc  = uSnap.val()  || {};
    modalUserData = dSnap.val()  || {};
    renderModalProfile();
  } catch (e) {
    if (String(modalOpenUserId) !== String(userId)) return;
    modalBody.innerHTML = `<div class="empty"><span class="icon">${ico('x',40)}</span>No se pudo cargar el perfil.</div>`;
  }
}

function closeUserModal() {
  modalOpenUserId = null;
  modalUserDoc = null; modalUserData = null; modalRankInfo = null;
  modalImageUnsubs.forEach(u => { try { u(); } catch {} });
  modalImageUnsubs.clear();
  modalEl.classList.remove('show');
  document.body.classList.remove('modal-open');
  modalBody.innerHTML = '';
}

    <div class="stat"><div class="num" style="color:var(--legendaria)">${rc.legendaria}</div><div class="lbl">${ico('crown',11)} Legendaria</div></div>
    <div class="stat"><div class="num" style="color:var(--exclusiva)">${rc.exclusiva}</div><div class="lbl">${ico('star',11)} Exclusiva</div></div>

function renderCollectionWaifus(container) {
  const waifus = Array.isArray(userData?.waifus) ? userData.waifus : [];
  if (waifus.length === 0) {
    container.innerHTML = `<div class="empty"><span class="icon">${ico('package',44)}</span>Aún no tienes waifus.<br>¡Captura salvajes cada hora en el bot!</div>`;
    return;
  }
  const all = groupWaifusByRarity(waifus);
  const filters = [
    { k: 'all', label: 'Todas', ic: 'filter' },
    { k: 'legendaria', label: 'Legendaria', ic: 'crown' },
    { k: 'epica', label: 'Épica', ic: 'diamond' },
    { k: 'rara', label: 'Rara', ic: 'flame' },
    { k: 'comun', label: 'Común', ic: 'circle' },
    { k: 'exclusiva', label: 'Exclusiva', ic: 'star' }
  ];
  let html = `<div class="filters">`;
  for (const f of filters) {
    const count = f.k === 'all' ? all.length : all.filter(x => x.rarity === f.k).length;
    if (f.k !== 'all' && count === 0) continue;
    html += `<button data-f="${f.k}" class="${collectionFilter === f.k ? 'active' : ''}">${ico(f.ic,12)}${f.label} (${count})</button>`;
  }
  html += `</div>`;
  const list = collectionFilter === 'all' ? all : all.filter(x => x.rarity === collectionFilter);
  if (list.length === 0) {
    html += `<div class="empty"><span class="icon">${ico('filter',40)}</span>Sin waifus en esta rareza.</div>`;
  } else {
    html += `<p class="hint" style="text-align:left;margin:0 0 12px">${ico('tag',11)} Toca <b>Vender</b> en cualquier carta para ponerla en venta.</p>`;
    html += `<div class="grid">`;
    for (const w of list) {
      watchImage(w.name);
      const url = imageUrls[w.name] || '';
      const initial = (w.name || '?').charAt(0).toUpperCase();
      html += `<div class="wcard" data-r="${w.rarity}" data-img="${esc(w.name)}">
        <div class="img" data-open-card="${esc(w.name)}">${url ? `<img src="${esc(url)}" alt="" loading="lazy">` : `<span class="placeholder">${initial}</span>`}</div>
        <div class="info">
          <div class="name" title="${esc(w.name)}">${esc(w.name)}</div>
          <div class="meta"><span class="rarity">${RARITY_LABEL[w.rarity] || w.rarity}</span><span class="count">x${w.count}</span></div>
          <button class="btn-sell-card" data-sell="${esc(w.name)}" title="Poner en venta">${ico('tag',11)} Vender</button>
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  container.innerHTML = html;

  container.querySelectorAll('.filters button').forEach(b => {
    b.addEventListener('click', () => { collectionFilter = b.dataset.f; renderCollection(); });
  });
  container.querySelectorAll('[data-open-card]').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.getAttribute('data-open-card');
      if (name) openCardModal(name);
    });
  });
  container.querySelectorAll('[data-sell]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const name = btn.getAttribute('data-sell');
      if (name) openSellModal(name);
    });
  });

               min="${STORE_MIN_PRICE}" max="${STORE_MAX_PRICE}"
               value="${price}" placeholder="${DEFAULT_STORE_PRICES[r]}"
               data-store-price="${r}" autocomplete="off">
        ${ico('coin',13)}
      </div>
      <div class="dpc-qty ${qty === 0 ? 'zero' : ''}">
        <span>Duplicadas</span><b>${qty}</b>
      </div>
    </div>`;
  }

  container.innerHTML = `
    <div class="agent-hero">
      <div class="agent-hero-title">${ico('store',18)} Vender a la tienda</div>
      <div class="agent-hero-text">
        Define el precio de tus duplicadas (por rareza). Se listarán en la tienda para que otros jugadores las compren.<br>
        Se conserva <b>1 copia</b> de cada waifu. Las <span class="no-excl">exclusivas NO participan</span>.
      </div>
    </div>

    <div class="section-title">${ico('dollar',11)} Precios por rareza</div>
    <div class="dup-price-grid">${priceCardsHtml}</div>

    <div class="agent-total">
      <span>${ico('tag',13)} Duplicadas a poner en venta</span>
      <b>${totalDup}</b>
    </div>

    <button class="btn-store-sell" id="btn-store-sell">
      ${ico('store',16)} Poner ${totalDup} duplicada${totalDup === 1 ? '' : 's'} en venta
    </button>

    <p class="hint" style="text-align:left;margin-top:16px">
      ${ico('shield',11)} Solo se venderán copias repetidas (mínimo 1 se conserva).<br>
      ${ico('coin',11)} Precio entre <b>${STORE_MIN_PRICE}</b> y <b>${fmt(STORE_MAX_PRICE)}</b> monedas.<br>
      ${ico('star',11)} Las waifus <b style="color:var(--exclusiva)">exclusivas</b> quedan intactas.<br>
      ${ico('crown',11)} Las <b style="color:var(--legendaria)">legendarias</b> ahora tienen su propio precio.
    </p>
  `;

  container.querySelectorAll('[data-store-price]').forEach(input => {
    input.addEventListener('input', () => {
      const r = input.dataset.storePrice;
      const v = parseInt(input.value, 10);
      if (Number.isFinite(v)) storePrices[r] = v;
    });
    input.addEventListener('blur', () => {
      const r = input.dataset.storePrice;
      let v = parseInt(input.value, 10);
      if (!Number.isFinite(v) || v < STORE_MIN_PRICE) v = STORE_MIN_PRICE;
      if (v > STORE_MAX_PRICE) v = STORE_MAX_PRICE;
      input.value = v;
      storePrices[r] = v;
    });
  });

  btn?.addEventListener('click', async () => {
    if (btn.disabled) return;

    const finalPrices = {};
    for (const r of rarities) {
      let v = parseInt(storePrices[r], 10);
      if (!Number.isFinite(v) || v < STORE_MIN_PRICE || v > STORE_MAX_PRICE) {
        showToast(`Precio de ${RARITY_LABEL[r]} debe estar entre ${STORE_MIN_PRICE} y ${fmt(STORE_MAX_PRICE)}`, 'err', 4500, 'x');

      finalPrices[r] = v;

function renderCollectionSkins(container) {
  const ownedIds = Array.isArray(userData?.skins) ? userData.skins : [];
  const skinsOffSet = new Set(Array.isArray(userData?.skinsOff) ? userData.skinsOff : []);

  const owned = ownedIds
    .map(id => ({ id, ...(skins && skins[id] ? skins[id] : {}) }))
    .filter(s => s && s.waifuName);

  if (owned.length === 0) {
    container.innerHTML = `<div class="empty">
      <span class="icon">${ico('card',44)}</span>
      No tienes skins todavía.<br>
      Compra alguna en <b>Tienda → Skins</b><br>
      o sube la tuya con <b>/skin</b> en el bot.
    </div>`;
    return;
  }

  const byWaifu = new Map();
  for (const s of owned) {
    if (!byWaifu.has(s.waifuName)) byWaifu.set(s.waifuName, []);
    byWaifu.get(s.waifuName).push(s);
  }
  const activeByWaifu = new Map();
  for (const [waifu, list] of byWaifu) {
    for (const s of list) {
      if (!skinsOffSet.has(s.id)) { activeByWaifu.set(waifu, s.id); break; }
    }
  }

  owned.sort((a, b) => {
    const aAct = activeByWaifu.get(a.waifuName) === a.id;
    const bAct = activeByWaifu.get(b.waifuName) === b.id;
    if (aAct !== bAct) return aAct ? -1 : 1;
    const d = (RARITY_RANK[a.rarity] ?? 9) - (RARITY_RANK[b.rarity] ?? 9);
    return d !== 0 ? d : a.waifuName.localeCompare(b.waifuName);
  });

  let html = `<p class="hint" style="text-align:left;margin:0 0 12px">
    ${ico('tag',11)} Solo <b>una skin puede estar activa por waifu</b>. Al activar una, se desactivan las demás de la misma waifu.
  </p><div class="grid">`;

  for (const s of owned) {
    const isActive = activeByWaifu.get(s.waifuName) === s.id;
    const url = s.imageUrl || '';
    const initial = (s.waifuName || '?').charAt(0).toUpperCase();
    const rarity = s.rarity || 'comun';
    const rl = RARITY_LABEL[rarity] || rarity;

    html += `<div class="wcard skin-card ${isActive ? 'skin-active' : ''}" data-r="${rarity}">
      ${isActive ? `<span class="status-badge">${ico('check',10)}</span>` : ''}
      <div class="img">
        ${url ? `<img src="${esc(url)}" alt="" loading="lazy">` : `<span class="placeholder">${initial}</span>`}
        ${isActive ? `<div class="skin-active-tag">${ico('check',10)} ACTIVA</div>` : ''}
      </div>
      <div class="info">
        <div class="name" title="${esc(s.waifuName)}">${esc(s.waifuName)}</div>
        <div class="meta">
          <span class="rarity">${esc(rl)}</span>
          <span class="count" style="color:${isActive ? 'var(--ok)' : 'var(--muted)'}">${isActive ? 'Activa' : 'Inactiva'}</span>
        </div>
        <button class="btn-skin-toggle ${isActive ? 'btn-skin-off' : 'btn-skin-on'}"
                data-skin-toggle="${esc(s.id)}" data-skin-target="${isActive ? '0' : '1'}">
          ${isActive ? ico('x',11) + ' Desactivar' : ico('check',11) + ' Activar'}
        </button>
      </div>
    </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;

  container.querySelectorAll('[data-skin-toggle]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const skinId = btn.dataset.skinToggle;
      const activate = btn.dataset.skinTarget === '1';
      if (!skinId || btn.disabled) return;
      btn.disabled = true;
      const original = btn.innerHTML;
      btn.innerHTML = '<span class="loading"></span>';
      try {
        await requestSkinToggle(skinId, activate);
        showToast(activate ? 'Skin activada' : 'Skin desactivada', 'ok', 2500, activate ? 'check' : 'x');
      } catch (err) {
        showToast(err.message || 'Error', 'err', 4000, 'x');
        btn.disabled = false;
        btn.innerHTML = original;
      }
    });
  });
}

    ${showSearch ? `
      <div class="shop-search">
        <div class="shop-search-input-wrap">
          ${ico('search',16)}
          <input id="shop-search-input" type="text" placeholder="Buscar por nombre o rareza…" value="${esc(shopSearch)}" autocomplete="off" spellcheck="false">
          <button class="shop-search-clear ${shopSearch ? 'show' : ''}" id="shop-search-clear" type="button" aria-label="Limpiar">${ico('x',12)}</button>
        </div>

        <div class="shop-filters-wrap">
          <button class="shop-filters-toggle ${shopFiltersOpen ? 'open' : ''}" id="shop-filters-toggle" type="button" aria-expanded="${shopFiltersOpen ? 'true' : 'false'}">
            <span class="sft-left">
              ${ico('filter',13)}
              <span>Filtros</span>
              ${activeFilterCount > 0 ? `<span class="sft-badge" id="shop-filters-badge">${activeFilterCount}</span>` : ''}
            </span>
            <span class="sft-chevron">${ico('chevron',14)}</span>
          </button>

          <div class="shop-filters-panel ${shopFiltersOpen ? '' : 'collapsed'}" id="shop-filters-panel">
            <div class="shop-filter-group">
              <div class="shop-filter-label">${ico('filter',10)} Rareza</div>
              <div class="filters" id="shop-rarity-filters">
                <button data-r="all" class="${shopRarityFilter === 'all' ? 'active' : ''}">Todas</button>
                <button data-r="exclusiva" class="${shopRarityFilter === 'exclusiva' ? 'active' : ''}">${ico('star',12)}Exclusiva</button>
                <button data-r="legendaria" class="${shopRarityFilter === 'legendaria' ? 'active' : ''}">${ico('crown',12)}Legendaria</button>
                <button data-r="epica" class="${shopRarityFilter === 'epica' ? 'active' : ''}">${ico('diamond',12)}Épica</button>
                <button data-r="rara" class="${shopRarityFilter === 'rara' ? 'active' : ''}">${ico('flame',12)}Rara</button>
                <button data-r="comun" class="${shopRarityFilter === 'comun' ? 'active' : ''}">${ico('circle',12)}Común</button>
              </div>
            </div>

            <div class="shop-filter-group">
              <div class="shop-filter-label">${ico('dollar',10)} Precio</div>
              <div class="filters" id="shop-price-filters">
                <button data-p="all" class="${shopPriceFilter === 'all' ? 'active' : ''}">${ico('filter',12)}Todos</button>
                <button data-p="p1" class="${shopPriceFilter === 'p1' ? 'active' : ''}">${ico('coin',12)}≤ 500</button>
                <button data-p="p2" class="${shopPriceFilter === 'p2' ? 'active' : ''}">${ico('coin',12)}500 - 1,500</button>
                <button data-p="p3" class="${shopPriceFilter === 'p3' ? 'active' : ''}">${ico('coin',12)}1,500 - 3,000</button>
                <button data-p="p4" class="${shopPriceFilter === 'p4' ? 'active' : ''}">${ico('coin',12)}&gt; 3,000</button>
              </div>
            </div>

            <button class="shop-toggle ${shopHideOwned ? 'active' : ''}" id="shop-toggle-owned" type="button">
              <span class="switch"></span>
              <span class="toggle-text">Ocultar las que <b>ya tengo</b></span>
            </button>
          </div>
        </div>
      </div>
    ` : ''}
    <div id="shop-content"></div>
  </div>`;
  c.innerHTML = html;

  c.querySelectorAll('#shop-subtabs .subtab').forEach(btn => {
    btn.addEventListener('click', () => { shopSubTab = btn.dataset.sub; renderShop(); });
  });

  if (showSearch) {
    const input = $('shop-search-input');
    const clearBtn = $('shop-search-clear');
    const toggleBtn = $('shop-toggle-owned');
    const filtersToggle = $('shop-filters-toggle');
    const filtersPanel = $('shop-filters-panel');

    filtersToggle?.addEventListener('click', () => {
      shopFiltersOpen = !shopFiltersOpen;
      filtersToggle.classList.toggle('open', shopFiltersOpen);
      filtersToggle.setAttribute('aria-expanded', shopFiltersOpen ? 'true' : 'false');
      filtersPanel.classList.toggle('collapsed', !shopFiltersOpen);
    });

    input?.addEventListener('input', () => {
      shopSearch = input.value;
      if (clearBtn) clearBtn.classList.toggle('show', !!shopSearch);
      renderShopContent();
    });

    clearBtn?.addEventListener('click', () => {
      shopSearch = '';
      if (input) { input.value = ''; input.focus(); }
      clearBtn.classList.remove('show');
      renderShopContent();
    });

    c.querySelectorAll('#shop-rarity-filters button').forEach(b => {
      b.addEventListener('click', () => {
        shopRarityFilter = b.dataset.r;
        c.querySelectorAll('#shop-rarity-filters button').forEach(x =>
          x.classList.toggle('active', x.dataset.r === shopRarityFilter)
        );
        updateShopFiltersBadge();
        renderShopContent();
      });
    });

    c.querySelectorAll('#shop-price-filters button').forEach(b => {
      b.addEventListener('click', () => {
        shopPriceFilter = b.dataset.p;
        c.querySelectorAll('#shop-price-filters button').forEach(x =>
          x.classList.toggle('active', x.dataset.p === shopPriceFilter)
        );
        updateShopFiltersBadge();
        renderShopContent();
      });
    });

    toggleBtn?.addEventListener('click', () => {
      shopHideOwned = !shopHideOwned;
      toggleBtn.classList.toggle('active', shopHideOwned);
      updateShopFiltersBadge();
      renderShopContent();
    });
  }

  renderShopContent();
}

function updateShopFiltersBadge() {
  const toggle = $('shop-filters-toggle');
  if (!toggle) return;
  const leftEl = toggle.querySelector('.sft-left');
  if (!leftEl) return;
  const count =
    (shopRarityFilter !== 'all' ? 1 : 0) +
    (shopPriceFilter !== 'all' ? 1 : 0) +
    (shopHideOwned ? 1 : 0);
  let badge = toggle.querySelector('.sft-badge');
  if (count > 0) {
    if (badge) {
      badge.textContent = count;
    } else {
      leftEl.insertAdjacentHTML('beforeend', `<span class="sft-badge">${count}</span>`);
    }
  } else if (badge) {
    badge.remove();
  }
}

function renderShopContent() {
  const content = $('shop-content');
  if (!content) return;
  if (shopSubTab === 'waifus') renderShopWaifus(content);
  else if (shopSubTab === 'skins') renderShopSkins(content);
  else if (shopSubTab === 'boxes') renderShopBoxes(content);
}

function describeActiveFilters() {
  const parts = [];
  const q = shopSearch.trim();
  if (q) parts.push(`con "<b>${esc(q)}</b>"`);
  if (shopRarityFilter !== 'all') parts.push(`de rareza <b>${esc(RARITY_LABEL[shopRarityFilter] || shopRarityFilter)}</b>`);
  if (shopPriceFilter !== 'all') {
    const labels = { p1: '≤ 500', p2: '500 - 1,500', p3: '1,500 - 3,000', p4: '> 3,000' };
    parts.push(`de precio <b>${labels[shopPriceFilter] || '?'}</b>`);
  }
  if (shopHideOwned) parts.push(`(ocultando las que ya tienes)`);
  return parts;
}

function renderShopWaifus(container) {
  const allSales = Object.values(sales || {});
  const myCoins = Number(userData?.coins) || 0;
  const myId = session.userId;
  const ownedNames = getOwnedWaifuNames();

  const othersSales = allSales.filter(s => String(s.sellerId) !== String(myId));

  if (othersSales.length === 0) {
    container.innerHTML = `<div class="empty">
      <span class="icon">${ico('store',44)}</span>
      No hay waifus en venta de otros jugadores.<br>
      Tus propias ventas las puedes ver en tu <b>Colección</b>.
    </div>`;
    return;
  }

  const filtered = othersSales.filter(s => {
    if (shopHideOwned && ownedNames.has((s.waifu?.name || '').toLowerCase())) return false;
    return matchShopFilter(s.waifu?.name || '', s.waifu?.rarity || 'comun', s.price);
  });

  if (filtered.length === 0) {
    const reasons = describeActiveFilters();
    container.innerHTML = `<div class="shop-search-empty">
      <div class="icon">${ico('search',44)}</div>
      No se encontraron waifus ${reasons.join(' ') || 'con esos filtros'}.<br>
      Prueba a quitar algún filtro.
    </div>`;
    return;
  }

  filtered.sort((a, b) => a.price - b.price);

  const infoBadges = [];
  if (shopHideOwned) infoBadges.push(`<span class="hide-badge">${ico('eyeoff',10)} Ocultando las que ya tienes</span>`);

  let html = `<div class="shop-search-info">
    ${ico('filter',11)} Mostrando <b>${filtered.length}</b> de ${othersSales.length} venta${othersSales.length === 1 ? '' : 's'} de otros jugadores
    ${infoBadges.join('')}
  </div><div class="grid">`;

  for (const s of filtered) {
    const wname = s.waifu?.name || '?';
    const rarity = s.waifu?.rarity || 'comun';
    watchImage(wname);
    const url = imageUrls[wname] || '';
    const initial = (wname || '?').charAt(0).toUpperCase();
    const seller = s.sellerUsername ? '@' + esc(s.sellerUsername) : esc(s.sellerName || 'Anónimo');
    const canAfford = myCoins >= (s.price || 0);
    const owned = ownedNames.has((wname || '').toLowerCase());
    const btnText = canAfford ? `Comprar ${fmt(s.price)}` : `Faltan ${fmt((s.price||0)-myCoins)}`;
    const ownedBadge = owned ? `<span class="status-badge" title="Ya la tienes" style="color:#6ee7b7;border-color:rgba(16,185,129,.4)">${ico('check',10)}</span>` : '';
    html += `<div class="wcard" data-r="${rarity}" data-img="${esc(wname)}">
      ${ownedBadge}
      <div class="img">${url ? `<img src="${esc(url)}" alt="" loading="lazy">` : `<span class="placeholder">${initial}</span>`}</div>
      <div class="info">
        <div class="name" title="${esc(wname)}">${esc(wname)}</div>
        <div class="meta"><span class="rarity">${RARITY_LABEL[rarity] || rarity}</span><span class="count">${fmt(s.price)}${ico('coin',10)}</span></div>
        <div class="seller-line">${seller}</div>
        <button class="btn-buy-card" data-buy="${esc(s.saleId)}" ${!canAfford ? 'disabled' : ''}>${esc(btnText)}</button>
      </div>
    </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
  container.querySelectorAll('.btn-buy-card').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const saleId = btn.dataset.buy;
      if (!saleId || btn.disabled) return;
      btn.disabled = true;
      const original = btn.textContent;
      btn.innerHTML = '<span class="loading"></span>';
      try { await requestBuy(saleId); }
      catch (err) { showToast(err.message || 'Error', 'err', 4000, 'x'); }
      finally { setTimeout(() => { btn.disabled = false; btn.innerHTML = original; }, 5000); }
    });
  });
}

function renderShopSkins(container) {
  const allSkins = Object.values(skins || {});
  const myCoins  = Number(userData?.coins) || 0;
  const myId     = session.userId;
  const myOwned  = Array.isArray(userData?.skins) ? userData.skins : [];
  const ownedSet = new Set(myOwned);

  const othersSkins = allSkins.filter(sk => String(sk.uploaderId) !== String(myId));

  if (othersSkins.length === 0) {
    container.innerHTML = `<div class="empty">
      <span class="icon">${ico('card',44)}</span>
      No hay skins en venta de otros jugadores.<br>
      Las tuyas están en tu <b>Colección → Skins</b>.
    </div>`;
    return;
  }

  const filtered = othersSkins.filter(sk => {
    if (shopHideOwned && ownedSet.has(sk.id)) return false;
    return matchShopFilter(sk.waifuName || '', sk.rarity || 'comun', sk.price);
  });

  if (filtered.length === 0) {
    const reasons = describeActiveFilters();
    container.innerHTML = `<div class="shop-search-empty">
      <div class="icon">${ico('search',44)}</div>
      No se encontraron skins ${reasons.join(' ') || 'con esos filtros'}.<br>
      Prueba a quitar algún filtro.
    </div>`;
    return;
  }

  filtered.sort((a, b) => (a.price || 0) - (b.price || 0));

  const infoBadges = [];
  if (shopHideOwned) infoBadges.push(`<span class="hide-badge">${ico('eyeoff',10)} Ocultando las que ya tienes</span>`);

  let html = `<div class="shop-search-info">
    ${ico('filter',11)} Mostrando <b>${filtered.length}</b> de ${othersSkins.length} skin${othersSkins.length === 1 ? '' : 's'} de otros jugadores
    ${infoBadges.join('')}
  </div><div class="grid">`;

  for (const sk of filtered) {
    const wname    = sk.waifuName || '?';
    const rarity   = sk.rarity || 'comun';
    const url      = sk.imageUrl || '';
    const initial  = (wname || '?').charAt(0).toUpperCase();
    const seller   = sk.uploaderUsername ? '@' + esc(sk.uploaderUsername) : esc(sk.uploaderName || 'Anónimo');
    const owned    = ownedSet.has(sk.id);
    const canPay   = myCoins >= (sk.price || 0);
    const disabled = owned || !canPay;

    let btnText;
    if (owned)         btnText = 'Ya la tienes';
    else if (!canPay)  btnText = `Faltan ${fmt((sk.price||0) - myCoins)}`;
    else               btnText = `Comprar ${fmt(sk.price)}`;

    const ownedBadge = owned ? `<span class="status-badge" title="Ya la tienes" style="color:#6ee7b7;border-color:rgba(16,185,129,.4)">${ico('check',10)}</span>` : '';

    html += `<div class="wcard" data-r="${rarity}">
      ${ownedBadge}
      <div class="img">${url ? `<img src="${esc(url)}" alt="" loading="lazy">` : `<span class="placeholder">${initial}</span>`}</div>
      <div class="info">
        <div class="name" title="${esc(wname)}">${esc(wname)}</div>
        <div class="meta">
          <span class="rarity">${RARITY_LABEL[rarity] || rarity}</span>
          <span class="count">${fmt(sk.price)}${ico('coin',10)}</span>
        </div>
        <div class="seller-line">${ico('user',10)} ${seller}</div>
        <button class="btn-buy-card" data-buy-skin="${esc(sk.id)}" ${disabled ? 'disabled' : ''}>${esc(btnText)}</button>
      </div>
    </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;

  container.querySelectorAll('[data-buy-skin]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const skinId = btn.dataset.buySkin;
      if (!skinId || btn.disabled) return;
      btn.disabled = true;
      const original = btn.textContent;
      btn.innerHTML = '<span class="loading"></span>';
      try { await requestSkinBuy(skinId); }
      catch (err) { showToast(err.message || 'Error', 'err', 4000, 'x'); }
      finally { setTimeout(() => { btn.disabled = false; btn.innerHTML = original; }, 5000); }
    });
  });
}

function renderShopBoxes(container) {
  const myCoins = Number(userData?.coins) || 0;
  let html = `<div class="section-title">${ico('gift',13)} Cajas misteriosas</div><div class="boxes-grid">`;
  for (const key of ['comun', 'rara', 'premium', 'legendaria']) {
    const box = CAJAS[key];
    const canAfford = myCoins >= box.price;
    const disabled = !canAfford;
    html += `<div class="box-card" data-box="${key}" data-can="${disabled ? 0 : 1}">
      <div class="bicon"><img src="${esc(box.img)}" alt="${esc(box.name)}" loading="lazy"></div>
      <div class="bname">${box.name}</div>
      <div class="bdesc">${box.desc}</div>
      <div class="bprice">${fmt(box.price)} ${ico('coin',14)}</div>
    </div>`;
  }
  html += `</div><p class="hint" style="text-align:left;margin-top:18px">Toca una caja para abrirla al instante.<br>El bot procesará la apertura y las waifus aparecerán en tu colección en segundos.<br>Cada apertura consume las monedas correspondientes.</p>`;
  container.innerHTML = html;
  container.querySelectorAll('.box-card').forEach(card => {
    const key = card.dataset.box;
    const canOpen = card.dataset.can === '1';
    if (!canOpen) { card.style.opacity = '.55'; card.style.cursor = 'not-allowed'; return; }
    card.addEventListener('click', async () => {
      if (card.dataset.opening) return;
      card.dataset.opening = '1';
      const original = card.innerHTML;
      card.style.opacity = '.6';
      card.style.pointerEvents = 'none';
      try { await requestBox(key); }
      catch (err) { showToast(err.message || 'Error', 'err', 4000, 'x'); }
      finally {
        setTimeout(() => {
          card.innerHTML = original;
          card.style.opacity = '1';
          card.style.pointerEvents = '';
          delete card.dataset.opening;
        }, 5000);
      }
    });
  });
}

function doLogout() {
  unsubs.forEach(u => { try { u(); } catch {} }); unsubs.length = 0;
  imageUnsubs.forEach(u => { try { u(); } catch {} }); imageUnsubs.clear();
  actionUnsubs.forEach(u => { try { u(); } catch {} }); actionUnsubs.clear();
  if (cardInertiaRaf) { cancelAnimationFrame(cardInertiaRaf); cardInertiaRaf = null; }
  resolveConfirm(false);
  closeUserModal(); closeBoxModal(); closeCardModal(); closeSellModal();
  if (session?.token) { remove(ref(db, `sessions/${session.token}`)).catch(() => {}); }
  localStorage.removeItem('jinx_session');
  session = userDoc = userData = null;
  lastUserDataSig = ''; lastUserDocSig = ''; lastRankingSig = ''; lastSalesSig = ''; lastCatalogSig = ''; lastSkinsSig = '';
  skins = null;
  shopSearch = ''; shopRarityFilter = 'all'; shopPriceFilter = 'all'; shopHideOwned = false;
  shopFiltersOpen = false;
  collectionFilter = 'all'; collectionSubTab = 'waifus';
  rankingSubTab = 'waifus';
  battleRanking = null; mineralRanking = null; ultraRanking = null;
  lastBattleRankingSig = ''; lastMineralRankingSig = ''; lastUltraRankingSig = '';
  duplicatesMode = 'tienda'; storePrices = { ...DEFAULT_STORE_PRICES };
  if (unsubRequest) { unsubRequest(); unsubRequest = null; }
  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('show');
  navigateTo('profile');
  show('screen-login');
  inputEl.value = '';
  $('btn-request').disabled = false;
  $('btn-request').innerHTML = ico('play',15) + 'Enviar código';
  codeInputs.forEach(i => i.value = '');
}

$('btn-logout').addEventListener('click', doLogout);
$('btn-logout-mobile')?.addEventListener('click', doLogout);

hydrateIcons();

(async () => {
  const token = localStorage.getItem('jinx_session');
  if (!token) return;
  try { await startSession(token); }
  catch { localStorage.removeItem('jinx_session'); }
})();
</script>
</body>
</html>
