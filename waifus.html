<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jinx Waifus — HUD</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --pink:#ff2d92; --purple:#8b5cf6; --cyan:#22d3ee; --gold:#fbbf24;
    --bg:#07030f; --panel:#0d0620; --panel2:#150b26;
    --border:#3d2561; --border2:#5b3fa0;
    --text:#e9e2ff; --muted:#8a7bb0;
    --comun:#ffb6c1; --rara:#ff8383; --epica:#a78bfa; --legendaria:#fbbf24; --exclusiva:#22d3ee;
    --sidebar-w: 250px;
    --ok:#22c55e; --err:#ef4444;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0%{background-position: -200% 0} 100%{background-position: 200% 0} }
  @keyframes glowPulse { 0%,100%{box-shadow:0 0 20px rgba(139,92,246,.35)} 50%{box-shadow:0 0 35px rgba(255,45,146,.55)} }
  @keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }
  @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pop { 0%{transform:scale(.9);opacity:0} 60%{transform:scale(1.03)} 100%{transform:scale(1);opacity:1} }
  @keyframes toastIn { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(-10px)} }

  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track {
    background: linear-gradient(180deg, rgba(13,6,32,.6), rgba(7,3,15,.8));
    border-radius: 10px;
  }
  *::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--pink), var(--purple), var(--cyan));
    border-radius: 10px;
    border: 2px solid rgba(13,6,32,.9);
    box-shadow: inset 0 0 6px rgba(255,45,146,.5), 0 0 12px rgba(139,92,246,.4);
  }
  *::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, var(--pink), var(--cyan), var(--purple));
    box-shadow: inset 0 0 8px rgba(255,45,146,.7), 0 0 20px rgba(34,211,238,.6);
  }
  *::-webkit-scrollbar-corner { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: var(--purple) rgba(13,6,32,.8); }

  html,body{ height:100%; }
  body{
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,45,146,.15), transparent 45%),
      radial-gradient(circle at 85% 25%, rgba(139,92,246,.22), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(34,211,238,.15), transparent 45%),
      linear-gradient(180deg, #07030f, #0a0518 50%, #07030f);
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:-1; opacity:.30; pointer-events:none;
    background-image:
      linear-gradient(rgba(139,92,246,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 100%);
  }
  .scanline{
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    background: linear-gradient(transparent 0%, rgba(139,92,246,.06) 50%, transparent 100%);
    height: 20vh; width:100%;
    animation: scanline 8s linear infinite;
    opacity:.4;
  }

  #toast-wrap{
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 99999;
    display:flex; flex-direction:column; gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast{
    padding: 14px 22px;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(21,11,38,.98), rgba(13,6,32,.98));
    border: 1px solid var(--purple);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
    box-shadow: 0 0 30px rgba(139,92,246,.5), inset 0 1px 0 rgba(255,255,255,.1);
    animation: toastIn .3s ease;
    max-width: 90vw;
    text-align: center;
    pointer-events: auto;
  }
  .toast.ok{ border-color: var(--ok); box-shadow: 0 0 30px rgba(34,197,94,.45); }
  .toast.err{ border-color: var(--err); box-shadow: 0 0 30px rgba(239,68,68,.45); }
  .toast.hide{ animation: toastOut .3s ease forwards; }

  .layout{ display: flex; min-height: 100vh; position: relative; }

  .sidebar{
    width: var(--sidebar-w);
    background: linear-gradient(180deg, rgba(13,6,32,.98), rgba(7,3,15,.98));
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0;
    z-index: 100;
    transition: transform .3s ease;
    backdrop-filter: blur(10px);
  }
  .sidebar::before{
    content:''; position:absolute; top:0; right:0; width:2px; height:100%;
    background: linear-gradient(180deg, transparent, var(--purple), var(--pink), transparent);
    opacity:.5;
  }

  .sidebar-brand{
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .sidebar-brand .logo{
    font-size: 22px; font-weight: 900; letter-spacing: 1.5px;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan), var(--pink));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
    text-transform: uppercase; line-height: 1.1;
  }
  .sidebar-brand .sub{
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); margin-top: 6px;
  }
  .sidebar-brand .badge-dot{
    position:absolute; top: 24px; right: 20px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
    animation: pulse 2s infinite;
  }

  .sidebar-user{
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; font-size: 12px;
  }
  .sidebar-user .avatar-sm{
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 15px;
    border: 1.5px solid rgba(255,255,255,.15);
    box-shadow: 0 0 15px rgba(139,92,246,.4);
    flex-shrink: 0;
  }
  .sidebar-user .uinfo{ min-width: 0; flex: 1; }
  .sidebar-user .uname{
    font-weight: 700; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; font-size: 12px;
  }
  .sidebar-user .utag{
    color: var(--muted); font-size: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .sidebar-nav{
    flex: 1; padding: 14px 12px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
  }

  .nav-item{
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px;
    color: var(--muted); font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; border: 1px solid transparent;
    background: transparent; transition: .2s;
    text-align: left; font-family: inherit; width: 100%;
    position: relative;
  }
  .nav-item .icon{ font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
  .nav-item:hover:not(.active){
    color: var(--text);
    background: rgba(139,92,246,.08);
    border-color: rgba(139,92,246,.25);
  }
  .nav-item.active{
    color: var(--text);
    background: linear-gradient(90deg, rgba(255,45,146,.18), rgba(139,92,246,.15));
    border-color: var(--purple);
    box-shadow: inset 0 0 20px rgba(139,92,246,.2), 0 0 15px rgba(139,92,246,.2);
  }
  .nav-item.active::before{
    content:''; position:absolute; left: -12px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 60%;
    background: linear-gradient(180deg, var(--pink), var(--cyan));
    border-radius: 3px; box-shadow: 0 0 10px var(--pink);
  }

  .sidebar-footer{
    padding: 14px 12px; border-top: 1px solid var(--border);
  }
  .btn-logout{
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: 10px;
    background: transparent; border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    font-family: inherit; transition: .2s;
  }
  .btn-logout:hover{
    background: rgba(239,68,68,.1);
    border-color: rgba(239,68,68,.6);
    box-shadow: 0 0 20px rgba(239,68,68,.25);
    transform: translateX(2px);
  }
  .btn-logout .icon{ font-size: 15px; }

  .main{ flex: 1; margin-left: var(--sidebar-w); padding: 26px 24px 60px; min-width: 0; }
  .main-inner{ max-width: 1080px; margin: 0 auto; }

  .topbar{
    display: none; align-items: center; gap: 12px;
    padding: 12px 16px; background: rgba(13,6,32,.9);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 90;
    backdrop-filter: blur(10px);
  }
  .hamburger{
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(139,92,246,.15); border: 1px solid var(--border);
    color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; box-shadow: none;
  }
  .hamburger:hover{ background: rgba(139,92,246,.25); transform: none; }
  .topbar-title{
    font-size: 14px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--pink), var(--cyan));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase; flex: 1; text-align: right;
  }

  .overlay{
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); z-index: 95;
    backdrop-filter: blur(2px);
  }
  .overlay.show{ display: block; }

  .card{
    background: linear-gradient(180deg, rgba(21,11,38,.85), rgba(13,6,32,.95));
    border: 1px solid var(--border); border-radius: 16px;
    padding: 22px 20px; position:relative; overflow:hidden;
    box-shadow: 0 0 30px rgba(139,92,246,.15), inset 0 1px 0 rgba(255,255,255,.04);
    margin-bottom: 16px;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--purple), var(--pink), transparent);
  }
  .card::after{
    content:''; position:absolute; top:8px; right:8px; width:14px; height:14px;
    border-top:2px solid var(--cyan); border-right:2px solid var(--cyan);
    opacity:.6;
  }

  .screen{ display:none; }
  .screen.active{ display:block; animation: slideUp .4s ease; }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; animation: slideUp .3s ease; }

  label { display:block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
  input{
    width:100%; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: #0a0420; color: var(--text);
    font-size: 15px; outline: none; transition: .2s; font-family: inherit;
  }
  input:focus{ border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,92,246,.25), 0 0 20px rgba(139,92,246,.3); }

  button{
    padding: 14px 18px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    color: white; font-size: 14px; font-weight: 800;
    cursor: pointer; transition: .2s;
    text-transform: uppercase; letter-spacing: 1px;
    font-family: inherit;
    box-shadow: 0 0 20px rgba(255,45,146,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  button:hover:not(:disabled){ transform: translateY(-1px); box-shadow: 0 0 30px rgba(255,45,146,.55), inset 0 1px 0 rgba(255,255,255,.2); }
  button:active:not(:disabled){ transform: translateY(0) scale(.98); }
  button:disabled{ opacity: .5; cursor: not-allowed; box-shadow:none; }
  .btn-full{ width:100%; margin-top: 16px; }
  .btn-ghost{
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); box-shadow:none;
  }
  .btn-ghost:hover{ color: var(--text); border-color: var(--purple); box-shadow: 0 0 15px rgba(139,92,246,.3); }

  .msg{ margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 13px; display: none; font-weight: 500; }
  .msg.err{ display:block; background: rgba(239,68,68,.12); color:#fca5a5; border:1px solid rgba(239,68,68,.4); }
  .msg.ok { display:block; background: rgba(34,211,238,.12); color:#7ae6f5; border:1px solid rgba(34,211,238,.4); }

  .tabs{ display:flex; gap:6px; margin-bottom: 18px; background: rgba(13,6,32,.7); padding:5px; border-radius:12px; border:1px solid var(--border); flex-wrap: wrap; backdrop-filter: blur(6px); }
  .tab{
    flex:1; min-width: 80px; padding:10px 6px; border-radius: 8px;
    cursor:pointer; font-size: 11px; color: var(--muted);
    text-align:center; background: transparent; border:none;
    text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    transition: .2s; font-family: inherit; box-shadow:none;
  }
  .tab:hover:not(.active){ color: var(--text); }
  .tab.active{
    background: linear-gradient(90deg, rgba(255,45,146,.25), rgba(139,92,246,.25));
    color: var(--text);
    box-shadow: inset 0 0 20px rgba(139,92,246,.3), 0 0 15px rgba(139,92,246,.25);
  }

  /* SUB-TABS (dentro de tienda) */
  .subtabs{
    display:flex; gap:8px; margin-bottom: 20px; flex-wrap:wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .subtab{
    padding: 10px 18px; border-radius: 20px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 11px; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    font-family: inherit; transition: .2s;
    box-shadow: none;
  }
  .subtab:hover:not(.active){ color: var(--text); border-color: var(--border2); box-shadow: none; transform: none; }
  .subtab.active{
    background: linear-gradient(90deg, rgba(255,45,146,.25), rgba(139,92,246,.25));
    color: var(--text); border-color: var(--purple);
    box-shadow: inset 0 0 20px rgba(139,92,246,.25), 0 0 15px rgba(139,92,246,.3);
  }

  .profile{
    display:flex; align-items:center; gap:16px;
    padding: 16px; border-radius: 14px;
    background: rgba(10,4,32,.7); border: 1px solid var(--border);
    margin-bottom: 16px; position:relative;
  }
  .avatar{
    width: 64px; height: 64px; border-radius: 12px; flex-shrink:0;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items:center; justify-content:center;
    font-size: 26px; font-weight: 900;
    border: 2px solid rgba(255,255,255,.15);
    box-shadow: 0 0 25px rgba(139,92,246,.5);
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit: cover; }
  .profile-info{ flex:1; min-width:0; }
  .profile-info .name{ font-size: 17px; font-weight: 800; letter-spacing: .3px; }
  .profile-info .tag{ font-size: 12px; color: var(--muted); margin-top: 3px; }
  .plus-badge{
    display: inline-block; font-size: 10px; padding: 3px 10px; border-radius: 20px;
    background: linear-gradient(90deg, #f59e0b, #ec4899);
    color: white; font-weight: 800; margin-left: 8px; letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stats-grid{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px; margin-bottom: 16px;
  }
  .stat{
    padding: 14px 10px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(21,11,38,.85), rgba(10,4,32,.9));
    border: 1px solid var(--border); text-align: center;
    position:relative; overflow:hidden;
  }
  .stat::before{
    content:''; position:absolute; bottom:0; left:10%; right:10%; height:2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:.6;
  }
  .stat .num{
    font-size: 22px; font-weight: 900; color: var(--cyan);
    text-shadow: 0 0 15px rgba(34,211,238,.6);
    font-variant-numeric: tabular-nums;
  }
  .stat .lbl{ font-size: 10px; color: var(--muted); margin-top: 5px; text-transform: uppercase; letter-spacing: 1.2px; font-weight:600; }

  .rarity-bar{
    display:flex; height: 6px; border-radius: 20px; overflow: hidden;
    margin-bottom: 16px; background: rgba(10,4,32,.9);
    border: 1px solid var(--border);
  }
  .rarity-bar > div{ height: 100%; transition: width .5s ease; }

  .section-title{
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); margin: 20px 0 12px; font-weight:700;
    display:flex; align-items:center; gap:10px;
  }
  .section-title::before{
    content:''; width: 3px; height: 14px; background: linear-gradient(180deg, var(--pink), var(--cyan)); border-radius: 3px;
    box-shadow: 0 0 10px var(--pink);
  }
  .section-title::after{
    content:''; flex:1; height:1px; background: linear-gradient(90deg, var(--border), transparent);
  }

  .filters{ display:flex; gap:6px; margin-bottom: 14px; flex-wrap:wrap; }
  .filters button{
    font-size: 10px; padding: 7px 12px; border-radius: 20px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 700; box-shadow:none;
  }
  .filters button:hover{ color: var(--text); box-shadow: 0 0 12px rgba(139,92,246,.25); }
  .filters button.active{
    background: linear-gradient(90deg, rgba(255,45,146,.3), rgba(139,92,246,.3));
    color: var(--text); border-color: var(--purple);
    box-shadow: 0 0 15px rgba(139,92,246,.4);
  }

  .grid{
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .wcard{
    background: linear-gradient(180deg, rgba(21,11,38,.9), rgba(10,4,32,.95));
    border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; position:relative; cursor: pointer;
    transition: transform .2s, box-shadow .3s, border-color .3s;
    animation: pop .3s ease;
  }
  .wcard:hover{ transform: translateY(-3px); box-shadow: 0 12px 30px rgba(139,92,246,.35); border-color: var(--border2); }
  .wcard .img{
    width: 100%; aspect-ratio: 3/4;
    background: linear-gradient(135deg, #1a0a33, #0a0420);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .wcard .img img{ width:100%; height:100%; object-fit: cover; display:block; }
  .wcard .img .placeholder{
    font-size: 42px; font-weight: 900;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    opacity:.7;
  }
  .wcard .info{
    padding: 10px 10px 12px; position:relative;
    border-top: 1px solid var(--border);
  }
  .wcard .name{
    font-size: 12px; font-weight: 700; letter-spacing: .3px;
    overflow:hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-bottom: 6px;
  }
  .wcard .meta{ display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .wcard .rarity{
    font-size: 8px; padding: 2px 8px; border-radius: 20px;
    font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    border: 1px solid currentColor;
  }
  .wcard .count{
    font-size: 11px; font-weight: 800; color: var(--cyan);
    text-shadow: 0 0 8px rgba(34,211,238,.6);
  }
  .wcard[data-r="comun"]{ border-color: rgba(255,182,193,.4); }
  .wcard[data-r="comun"] .rarity{ color: var(--comun); background: rgba(255,182,193,.1); }
  .wcard[data-r="rara"]{ border-color: rgba(255,131,131,.5); box-shadow: 0 0 20px rgba(255,131,131,.15); }
  .wcard[data-r="rara"] .rarity{ color: var(--rara); background: rgba(255,131,131,.1); }
  .wcard[data-r="epica"]{ border-color: rgba(167,139,250,.55); box-shadow: 0 0 22px rgba(167,139,250,.22); }
  .wcard[data-r="epica"] .rarity{ color: var(--epica); background: rgba(167,139,250,.12); }
  .wcard[data-r="legendaria"]{ border-color: rgba(251,191,36,.65); box-shadow: 0 0 28px rgba(251,191,36,.3); animation: glowPulse 3s infinite; }
  .wcard[data-r="legendaria"] .rarity{ color: var(--legendaria); background: rgba(251,191,36,.12); }
  .wcard[data-r="exclusiva"]{ border-color: rgba(34,211,238,.7); box-shadow: 0 0 30px rgba(34,211,238,.35); }
  .wcard[data-r="exclusiva"] .rarity{ color: var(--exclusiva); background: rgba(34,211,238,.12); }
  .wcard .cover-badge{
    position:absolute; top:6px; right:6px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: white; font-size: 10px; font-weight: 800;
    padding: 3px 7px; border-radius: 20px;
    box-shadow: 0 0 12px rgba(255,45,146,.6);
    z-index:2;
  }

  .row{
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border-radius: 10px;
    background: linear-gradient(180deg, rgba(21,11,38,.7), rgba(10,4,32,.7));

</style>

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZLLVqrcw3IjhRFeAAzNDh_hgvrdkPDJo",
  authDomain: "jinx-waifus.firebaseapp.com",
  databaseURL: "https://jinx-waifus-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jinx-waifus",
  storageBucket: "jinx-waifus.firebasestorage.app",
  messagingSenderId: "557335223260",
  appId: "1:557335223260:web:c12de44f028ef9969c4d19"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const $ = (id) => document.getElementById(id);
const show = (id) => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
};
function setMsg(el, text, kind = 'err') { el.className = 'msg ' + kind; el.textContent = text; }
function clearMsg(el) { el.className = 'msg'; el.textContent = ''; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ try { return Number(n).toLocaleString('es-MX'); } catch { return String(n); } }

function imageKey(name) {
  if (!name) return '';
  return String(name).replace(/[.#$\[\]\/]/g, '_');
}

const RARITY_EMOJI = { comun:'🌸', rara:'🔥', epica:'💎', legendaria:'👑', exclusiva:'🌟' };
const RARITY_LABEL = { comun:'Común', rara:'Rara', epica:'Épica', legendaria:'Legendaria', exclusiva:'Exclusiva' };

const CAJAS = {
  comun:      { emoji: '📦', name: 'Caja Común',      price: 1500, desc: '1 premio: 150-700 monedas o waifu común.' },
  premium:    { emoji: '🎁', name: 'Caja Premium',    price: 2500, desc: '2 premios: 400-1200 monedas o waifu épica.' },
  legendaria: { emoji: '👑', name: 'Caja Legendaria', price: 3500, desc: '3 premios: monedas, épica o legendaria.' }
};

function showToast(text, kind = 'ok', duration = 3500) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = text;
  $('toast-wrap').appendChild(el);
  setTimeout(() => {
    el.classList.add('hide');
    setTimeout(() => el.remove(), 300);
  }, duration);
}

let currentRequestId = null;
let unsubRequest = null;
let mode = 'username';
let session = null;
let userDoc = null;
let userData = null;
let catalog = null;
let ranking = null;
let sales = null;
let auction = null;
let collectionFilter = 'all';
let currentTab = 'profile';
let shopSubTab = 'waifus';   // 'waifus' | 'boxes' | 'catalog'
let imageUrls = {};
let imageUnsubs = new Map();
const unsubs = [];
const actionUnsubs = new Map();
let auctionTimer = null;

/* ============================================================
   LOGIN
   ============================================================ */
const inputEl = $('identifier');
const labelEl = $('label-id');
const hintEl  = $('hint-1');
document.querySelectorAll('#login-tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const m = tab.dataset.mode;
    if (m === mode) return;
    mode = m;
    document.querySelectorAll('#login-tabs .tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    clearMsg($('msg-1')); inputEl.value = '';
    if (mode === 'username') {
      labelEl.textContent = 'Usuario de Telegram';
      inputEl.placeholder = '@tunombre';
      inputEl.inputMode = 'text';
      hintEl.innerHTML = 'El bot te enviará un <b>código de 6 dígitos</b>.<br>Debes haber hablado antes con el bot.';
    } else {
      labelEl.textContent = 'ID numérico de Telegram';
      inputEl.placeholder = '123456789';
      inputEl.inputMode = 'numeric';
      hintEl.innerHTML = 'El bot te enviará un <b>código de 6 dígitos</b>.<br>Obtén tu ID con <b>@userinfobot</b>.';
    }
    inputEl.focus();
  });
});

const codeInputs = [...document.querySelectorAll('#code-inputs input')];
codeInputs.forEach((inp, i) => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
    if (inp.value && i < codeInputs.length - 1) codeInputs[i + 1].focus();
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !inp.value && i > 0) codeInputs[i - 1].focus();
  });
});
const getTypedCode = () => codeInputs.map(i => i.value).join('');

$('btn-request').addEventListener('click', async () => {
  const raw = inputEl.value.trim();
  const msg = $('msg-1');
  clearMsg(msg);
  if (!raw) return setMsg(msg, mode === 'id' ? 'Escribe tu ID.' : 'Escribe tu usuario.');

  let identifier;
  if (mode === 'id') {
    if (!/^\d{5,15}$/.test(raw.replace(/^@/, ''))) return setMsg(msg, 'ID solo números (5-15 dígitos).');
    identifier = raw.replace(/^@/, '');
  } else {
    const clean = raw.replace(/^@/, '').toLowerCase().trim();
    if (!/^[a-zA-Z0-9_]{3,32}$/.test(clean)) return setMsg(msg, 'Usuario inválido.');
    identifier = clean;
  }

  const btn = $('btn-request');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>Enviando...';

  try {
    const id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    currentRequestId = id;
    await set(ref(db, `loginRequests/${id}`), {
      identifier, username: mode === 'username' ? identifier : null, mode,
      status: 'pending', createdAt: Date.now()
    });
    setMsg(msg, '📡 Solicitud enviada. Revisa tu Telegram.', 'ok');

    if (unsubRequest) unsubRequest();
    unsubRequest = onValue(ref(db, `loginRequests/${id}`), (snap) => {
      const data = snap.val();
      if (!data) return;
      if (data.status === 'sent') {
        show('screen-code');
        setTimeout(() => codeInputs[0].focus(), 100);
      } else if (data.status === 'error') {
        setMsg(msg, data.error || 'Error desconocido.');
        btn.disabled = false;
        btn.textContent = '▶ Enviar código';
      }
    });

    setTimeout(() => {
      if ($('screen-login').classList.contains('active')) {
        setMsg(msg, 'El bot no respondió. Verifica que ya le escribiste /start.');
        btn.disabled = false;
        btn.textContent = '▶ Enviar código';
      }
    }, 30000);
  } catch (e) {
    setMsg(msg, 'Error: ' + (e.message || e));
    btn.disabled = false;
    btn.textContent = '▶ Enviar código';
  }
});

$('btn-verify').addEventListener('click', async () => {
  const msg = $('msg-2');
  clearMsg(msg);
  const typed = getTypedCode();
  if (typed.length !== 6) return setMsg(msg, 'Ingresa los 6 dígitos.');

  const btn = $('btn-verify');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>Verificando...';

  try {
    const snap = await get(ref(db, `loginRequests/${currentRequestId}`));
    const data = snap.val();
    if (!data) throw new Error('Solicitud no encontrada.');
    if (data.status !== 'sent') throw new Error('Solicitud inválida.');
    if (Date.now() > data.expiresAt) throw new Error('Código expirado.');
    if (String(data.code) !== typed) throw new Error('Código incorrecto.');

    const token = crypto.randomUUID();
    await set(ref(db, `sessions/${token}`), {
      userId: data.userId, username: data.username || null,
      createdAt: Date.now(), expiresAt: Date.now() + 7 * 24 * 60 * 60 * 1000
    });
    localStorage.setItem('jinx_session', token);
    await set(ref(db, `loginRequests/${currentRequestId}/status`), 'verified');

    await startSession(token);
  } catch (e) {
    setMsg(msg, e.message || 'Error.');
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Verificar';
  }
});

$('btn-back').addEventListener('click', () => {
  if (unsubRequest) { unsubRequest(); unsubRequest = null; }
  show('screen-login');
  clearMsg($('msg-1'));
  $('btn-request').disabled = false;
  $('btn-request').textContent = '▶ Enviar código';
  codeInputs.forEach(i => i.value = '');
});

/* ============================================================
   SESIÓN
   ============================================================ */
async function startSession(token) {
  const sessSnap = await get(ref(db, `sessions/${token}`));
  const sess = sessSnap.val();
  if (!sess) throw new Error('Sesión no válida.');
  session = { token, ...sess };

  show('screen-panel');
  await loadAll();
  subscribeRealtime();
  renderAll();
}

async function loadAll() {
  const uid = session.userId;
  const [uSnap, dSnap, cSnap, rSnap, sSnap, aSnap] = await Promise.all([
    get(ref(db, `users/${uid}`)),
    get(ref(db, `users/${uid}/data`)),
    get(ref(db, `catalog`)),
    get(ref(db, `ranking`)),
    get(ref(db, `sales`)),
    get(ref(db, `auction`))
  ]);
  userDoc  = uSnap.val()  || {};
  userData = dSnap.val()  || {};
  catalog  = cSnap.val()  || { pool: {}, series: {} };
  ranking  = rSnap.val()  || { top: [], totalUsers: 0, totalWaifus: 0 };
  sales    = sSnap.val()  || {};
  auction  = aSnap.val()  || { active: null };
}

function subscribeRealtime() {
  const uid = session.userId;
  unsubs.push(onValue(ref(db, `users/${uid}/data`), (s) => {
    userData = s.val() || {};
    renderProfile(); renderSidebarUser();
    if (currentTab === 'collection') renderCollection();
    if (currentTab === 'system')     renderSystem();
    if (currentTab === 'shop')       renderShop();
  }));
  unsubs.push(onValue(ref(db, `users/${uid}`), (s) => {
    userDoc = s.val() || {};
    renderProfile(); renderSidebarUser();
  }));
  unsubs.push(onValue(ref(db, `catalog`), (s) => {
    catalog = s.val() || { pool: {}, series: {} };
    if (currentTab === 'system') renderSystem();
    if (currentTab === 'shop')   renderShop();
  }));
  unsubs.push(onValue(ref(db, `sales`),   (s) => { sales = s.val() || {}; if (currentTab === 'shop') renderShop(); }));
  unsubs.push(onValue(ref(db, `ranking`), (s) => { ranking = s.val() || { top: [] }; if (currentTab === 'ranking') renderRanking(); }));
  unsubs.push(onValue(ref(db, `auction`), (s) => { auction = s.val() || { active: null }; if (currentTab === 'auction') renderAuction(); }));
}

/* ============================================================
   IMÁGENES
   ============================================================ */
function watchImage(name) {
  if (!name || imageUnsubs.has(name)) return;
  const key = imageKey(name);
  const unsub = onValue(ref(db, `characterImages/${key}/url`), (snap) => {
    const url = snap.val();
    if (typeof url === 'string' && url) {
      imageUrls[name] = url;
      const target = document.querySelector(`[data-img="${CSS.escape(name)}"]`);
      if (!target) return;
      const holder = target.querySelector('.img') || target;
      let img = holder.querySelector('img');
      if (!img) {
        holder.innerHTML = `<img src="${esc(url)}" alt="" loading="lazy" style="opacity:0;transition:opacity .4s" onload="this.style.opacity='1'">`;
      } else if (img.src !== url) {
        img.src = url; img.style.opacity = '1';
      }
    }
  });
  imageUnsubs.set(name, unsub);
}

/* ============================================================
   ACCIONES WEB
   ============================================================ */
async function requestBuy(saleId) {
  const reqId = 'buy_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  await set(ref(db, `buyRequests/${reqId}`), {
    saleId,
    buyerId: session.userId,
    sessionToken: session.token,
    status: 'pending',
    createdAt: Date.now()
  });

  showToast('⏳ Procesando compra...', 'ok', 2000);

  const unsub = onValue(ref(db, `buyRequests/${reqId}`), (snap) => {
    const r = snap.val();
    if (!r) return;
    if (r.status === 'done') {
      showToast(`✅ Compraste a ${r.waifuName || 'la waifu'} por ${fmt(r.price)} 🪙`, 'ok', 4000);
      unsub(); actionUnsubs.delete(reqId);
    } else if (r.status === 'error') {
      showToast('❌ ' + (r.error || 'Error en la compra'), 'err', 5000);
      unsub(); actionUnsubs.delete(reqId);
    }
  });
  actionUnsubs.set(reqId, unsub);

  setTimeout(() => {
    const u = actionUnsubs.get(reqId);
    if (u) { u(); actionUnsubs.delete(reqId); }
  }, 30000);
}

async function requestBox(tipo) {
  const reqId = 'box_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  await set(ref(db, `boxRequests/${reqId}`), {
    tipo,
    userId: session.userId,
    sessionToken: session.token,
    status: 'pending',
    createdAt: Date.now()
  });

  showToast(`⏳ Abriendo ${CAJAS[tipo]?.name || 'caja'}...`, 'ok', 2000);

  const unsub = onValue(ref(db, `boxRequests/${reqId}`), (snap) => {
    const r = snap.val();
    if (!r) return;
    if (r.status === 'done') {
      const gained = Array.isArray(r.waifusGained) ? r.waifusGained : [];
      const names = gained.slice(0, 3).map(w => w.name).join(', ');
      const extra = gained.length > 3 ? ` +${gained.length - 3}` : '';
      const parts = [];
      if (r.coinsGained > 0) parts.push(`+${fmt(r.coinsGained)} 🪙`);
      if (gained.length > 0) parts.push(`${names}${extra}`);
      showToast(`🎉 ${parts.join(' · ') || 'Caja abierta'}`, 'ok', 5000);
      unsub(); actionUnsubs.delete(reqId);
    } else if (r.status === 'error') {
      showToast('❌ ' + (r.error || 'Error al abrir la caja'), 'err', 5000);
      unsub(); actionUnsubs.delete(reqId);
    }
  });
  actionUnsubs.set(reqId, unsub);

  setTimeout(() => {
    const u = actionUnsubs.get(reqId);
    if (u) { u(); actionUnsubs.delete(reqId); }
  }, 30000);
}

const TAB_TITLES = {
  profile:    'Perfil',
  collection: 'Colección',
  system:     'Sistema',
  ranking:    'Ranking',
  shop:       'Tienda',
  auction:    'Subasta'
};

function navigateTo(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  $('tab-' + tab)?.classList.add('active');
  $('topbar-title').textContent = TAB_TITLES[tab] || tab;

  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('show');

  if (tab === 'profile')    renderProfile();
  if (tab === 'collection') renderCollection();
  if (tab === 'system')     renderSystem();
  if (tab === 'ranking')    renderRanking();
  if (tab === 'shop')       renderShop();
  if (tab === 'auction')    renderAuction();
}

document.querySelectorAll('.nav-item').forEach(b => {
  b.addEventListener('click', () => navigateTo(b.dataset.tab));
});

$('hamburger').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
  $('overlay').classList.toggle('show');
});
$('overlay').addEventListener('click', () => {
  $('sidebar').classList.remove('open');

});

/* ---------- PERFIL ---------- */
function renderProfile() {
  const c = $('tab-profile');
  if (!userDoc || !userData) { c.innerHTML = '<div class="card"><div class="empty">Cargando…</div></div>'; return; }

  const name = [userDoc.firstName, userDoc.lastName].filter(Boolean).join(' ') || userDoc.username || 'Usuario';
  const initial = (name || '?').charAt(0).toUpperCase();
  const waifus = Array.isArray(userData.waifus) ? userData.waifus : [];
  const unique = new Set(waifus.map(w => (w?.name || '').toLowerCase()).filter(Boolean));
  const coins = Number(userData.coins) || 0;

  const rc = { comun:0, rara:0, epica:0, legendaria:0, exclusiva:0 };
  for (const w of waifus) if (w?.rarity && rc[w.rarity] != null) rc[w.rarity]++;

  const plusActive = userData.plusExpiresAt && userData.plusExpiresAt > Date.now();
  const plusDays = plusActive ? Math.ceil((userData.plusExpiresAt - Date.now()) / 86400000) : 0;

  const total = waifus.length || 1;
  const pct = {
    comun:      (rc.comun / total) * 100,
    rara:       (rc.rara / total) * 100,
    epica:      (rc.epica / total) * 100,
    legendaria: (rc.legendaria / total) * 100,
    exclusiva:  (rc.exclusiva / total) * 100
  };

  let html = `<div class="card">
    <div class="profile">
      <div class="avatar">${initial}</div>
      <div class="profile-info">
        <div class="name">${esc(name)}${plusActive ? `<span class="plus-badge">💎 Plus ${plusDays}d</span>` : ''}</div>
        <div class="tag">${userDoc.username ? '@' + esc(userDoc.username) : 'ID: ' + session.userId}</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat"><div class="num">${fmt(coins)}</div><div class="lbl">🪙 Monedas</div></div>
      <div class="stat"><div class="num">${waifus.length}</div><div class="lbl">🍥 Copias</div></div>
      <div class="stat"><div class="num">${unique.size}</div><div class="lbl">✨ Únicas</div></div>
      <div class="stat"><div class="num">${fmt(ranking?.totalWaifus || 0)}</div><div class="lbl">🌍 Global</div></div>
    </div>

    <div class="section-title">Balance de rarezas</div>
    <div class="rarity-bar">
      ${pct.comun>0 ? `<div style="width:${pct.comun}%;background:var(--comun)"></div>` : ''}
      ${pct.rara>0 ? `<div style="width:${pct.rara}%;background:var(--rara)"></div>` : ''}
      ${pct.epica>0 ? `<div style="width:${pct.epica}%;background:var(--epica)"></div>` : ''}
      ${pct.legendaria>0 ? `<div style="width:${pct.legendaria}%;background:var(--legendaria)"></div>` : ''}
      ${pct.exclusiva>0 ? `<div style="width:${pct.exclusiva}%;background:var(--exclusiva)"></div>` : ''}
    </div>

    <div class="stats-grid">
      <div class="stat"><div class="num" style="color:var(--comun);text-shadow:0 0 15px var(--comun)">${rc.comun}</div><div class="lbl">🌸 Común</div></div>
      <div class="stat"><div class="num" style="color:var(--rara);text-shadow:0 0 15px var(--rara)">${rc.rara}</div><div class="lbl">🔥 Rara</div></div>
      <div class="stat"><div class="num" style="color:var(--epica);text-shadow:0 0 15px var(--epica)">${rc.epica}</div><div class="lbl">💎 Épica</div></div>
      <div class="stat"><div class="num" style="color:var(--legendaria);text-shadow:0 0 15px var(--legendaria)">${rc.legendaria}</div><div class="lbl">👑 Legendaria</div></div>
      <div class="stat"><div class="num" style="color:var(--exclusiva);text-shadow:0 0 15px var(--exclusiva)">${rc.exclusiva}</div><div class="lbl">🌟 Exclusiva</div></div>
    </div>

    ${userData.predeterminada ? `
      <div class="section-title">🎴 Predeterminada</div>
      <div class="row">
        <div class="left">
          <div class="rank">🎴</div>
          <div class="info"><div class="name">${esc(userData.predeterminada)}</div></div>
        </div>
      </div>
    ` : ''}
  </div>`;
  c.innerHTML = html;
}

/* ---------- COLECCIÓN ---------- */
function renderCollection() {
  const c = $('tab-collection');
  const waifus = Array.isArray(userData?.waifus) ? userData.waifus : [];

  if (waifus.length === 0) {
    c.innerHTML = `<div class="card"><div class="empty">
      <span class="icon">📭</span>
      Aún no tienes waifus.<br>¡Captura salvajes cada hora en el bot!
    </div></div>`;
    return;
  }

  const countMap = new Map();
  for (const w of waifus) {
    if (!w?.name) continue;
    const k = String(w.name);
    if (!countMap.has(k)) countMap.set(k, { name: k, rarity: w.rarity || 'comun', count: 0 });
    countMap.get(k).count++;
  }
  const all = [...countMap.values()].sort((a, b) => a.name.localeCompare(b.name));

  const filters = [
    { k: 'all', label: '✨ Todas' },
    { k: 'legendaria', label: '👑 Legendaria' },
    { k: 'epica', label: '💎 Épica' },
    { k: 'rara', label: '🔥 Rara' },
    { k: 'comun', label: '🌸 Común' },
    { k: 'exclusiva', label: '🌟 Exclusiva' }
  ];

  let html = `<div class="card"><div class="filters">`;
  for (const f of filters) {
    const count = f.k === 'all' ? all.length : all.filter(x => x.rarity === f.k).length;
    if (f.k !== 'all' && count === 0) continue;
    html += `<button data-f="${f.k}" class="${collectionFilter === f.k ? 'active' : ''}">${f.label} (${count})</button>`;
  }
  html += `</div>`;

  const list = collectionFilter === 'all' ? all : all.filter(x => x.rarity === collectionFilter);

  if (list.length === 0) {
    html += `<div class="empty"><span class="icon">🔎</span>Sin waifus en esta rareza.</div>`;
  } else {
    html += `<div class="grid">`;
    const covers = new Set(userData.covers || []);
    const coversOff = new Set(userData.coversOff || []);
    for (const w of list) {
      watchImage(w.name);
      const url = imageUrls[w.name] || '';
      const hasCover = covers.has(w.name) && !coversOff.has(w.name);
      const initial = (w.name || '?').charAt(0).toUpperCase();
      html += `<div class="wcard" data-r="${w.rarity}" data-img="${esc(w.name)}">
        ${hasCover ? '<span class="cover-badge">🎨</span>' : ''}
        <div class="img">
          ${url
            ? `<img src="${esc(url)}" alt="" loading="lazy">`
            : `<span class="placeholder">${initial}</span>`}
        </div>
        <div class="info">
          <div class="name" title="${esc(w.name)}">${esc(w.name)}</div>
          <div class="meta">
            <span class="rarity">${RARITY_LABEL[w.rarity] || w.rarity}</span>
            <span class="count">x${w.count}</span>
          </div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;

  c.innerHTML = html;
  c.querySelectorAll('.filters button').forEach(b => {
    b.addEventListener('click', () => { collectionFilter = b.dataset.f; renderCollection(); });
  });
}

/* ---------- SISTEMA ---------- */
function renderSystem() {
  const c = $('tab-system');
  const pool = catalog?.pool || {};
  const series = catalog?.series || {};

  const rc = { comun: 0, rara: 0, epica: 0, legendaria: 0 };
  for (const r in rc) {
    const entry = pool[r];
    if (!entry) { rc[r] = 0; continue; }
    const chars = entry.characters;
    if (Array.isArray(chars)) rc[r] = chars.length;
    else if (chars && typeof chars === 'object') rc[r] = Object.keys(chars).length;
    else rc[r] = 0;
  }

  const totalSalvajes = rc.comun + rc.rara + rc.epica + rc.legendaria;

  if (totalSalvajes === 0) {
    c.innerHTML = `<div class="card"><div class="empty">
      <span class="icon">⚠️</span>
      <b>El catálogo no se ha sincronizado aún.</b><br><br>
      El bot debe estar corriendo y haber hecho al menos un sync.<br>
      Como admin, envía <b>/syncfirebase</b> al bot y espera 5 segundos.<br><br>
      <span style="color:var(--muted);font-size:11px">Si el problema persiste, revisa que <code>waifu_data.json</code> exista en <code>data/</code>.</span>
    </div></div>`;
    return;
  }

  const poolNames = new Set();
  for (const r in pool) {
    const chars = pool[r]?.characters;
    if (Array.isArray(chars)) chars.forEach(n => poolNames.add(n));
    else if (chars && typeof chars === 'object') Object.keys(chars).forEach(n => poolNames.add(n));
  }
  let exclusivas = 0;
  const exclusivaNames = [];
  for (const n of Object.keys(series)) {
    if (!poolNames.has(n)) { exclusivas++; exclusivaNames.push(n); }
  }

  const totalConExclusivas = totalSalvajes + exclusivas;

  const waifus = Array.isArray(userData?.waifus) ? userData.waifus : [];
  const ownedSet = new Set();
  for (const w of waifus) if (w?.name) ownedSet.add(String(w.name).toLowerCase());

  const owned = { comun: 0, rara: 0, epica: 0, legendaria: 0, exclusiva: 0 };
  for (const w of waifus) if (w?.rarity && owned[w.rarity] != null) owned[w.rarity]++;

  const seriesCount = {};
  for (const [name, serie] of Object.entries(series)) {
    if (!serie) continue;
    if (!seriesCount[serie]) seriesCount[serie] = 0;
    seriesCount[serie]++;
  }
  const seriesList = Object.entries(seriesCount).sort((a, b) => b[1] - a[1]);
  const topSeries = seriesList.slice(0, 10);

  const pct = (have, total) => total > 0 ? Math.round((have / total) * 100) : 0;

  let html = `<div class="card">
    <div class="stats-grid">
      <div class="stat"><div class="num">${fmt(totalConExclusivas)}</div><div class="lbl">🍥 Total sistema</div></div>
      <div class="stat"><div class="num">${fmt(totalSalvajes)}</div><div class="lbl">🌿 Salvajes</div></div>
      <div class="stat"><div class="num">${fmt(exclusivas)}</div><div class="lbl">🌟 Exclusivas</div></div>
      <div class="stat"><div class="num">${fmt(seriesList.length)}</div><div class="lbl">📺 Series</div></div>
    </div>

    <div class="section-title">🎯 Tu progreso por rareza</div>`;

  const rarityRows = [
    { k: 'comun',      label: 'Común',      color: 'var(--comun)' },
    { k: 'rara',       label: 'Rara',       color: 'var(--rara)' },
    { k: 'epica',      label: 'Épica',      color: 'var(--epica)' },
    { k: 'legendaria', label: 'Legendaria', color: 'var(--legendaria)' }
  ];

  for (const r of rarityRows) {
    const totalR = rc[r.k];
    const have = owned[r.k] || 0;
    const p = pct(have, totalR);
    const emoji = RARITY_EMOJI[r.k] || '';
    html += `<div class="row" style="padding:14px">
      <div class="left" style="flex-direction:column;align-items:stretch;width:100%">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="name" style="color:${r.color};text-shadow:0 0 10px ${r.color}">${emoji} ${r.label}</div>
          <div class="right">${fmt(have)}<span style="color:var(--muted);font-weight:400;font-size:11px">/${fmt(totalR)}</span></div>
        </div>
        <div style="height:5px;background:rgba(10,4,32,.9);border-radius:20px;margin-top:8px;border:1px solid var(--border);overflow:hidden">
          <div style="height:100%;width:${p}%;background:${r.color};box-shadow:0 0 12px ${r.color};transition:width .5s"></div>
        </div>
      </div>
    </div>`;
  }

  if (exclusivas > 0) {
    const haveExcl = owned.exclusiva || 0;
    const p = pct(haveExcl, exclusivas);
    html += `<div class="row" style="padding:14px">
      <div class="left" style="flex-direction:column;align-items:stretch;width:100%">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="name" style="color:var(--exclusiva);text-shadow:0 0 10px var(--exclusiva)">🌟 Exclusiva</div>
          <div class="right">${fmt(haveExcl)}<span style="color:var(--muted);font-weight:400;font-size:11px">/${fmt(exclusivas)}</span></div>
        </div>
        <div style="height:5px;background:rgba(10,4,32,.9);border-radius:20px;margin-top:8px;border:1px solid var(--border);overflow:hidden">
          <div style="height:100%;width:${p}%;background:var(--exclusiva);box-shadow:0 0 12px var(--exclusiva);transition:width .5s"></div>
        </div>
      </div>
    </div>`;
  }

  const totalRef = totalSalvajes || 1;
  html += `<div class="section-title">📊 Distribución del catálogo</div>
    <div class="rarity-bar" style="height:10px">
      ${rc.comun>0 ? `<div style="width:${(rc.comun/totalRef)*100}%;background:var(--comun)"></div>` : ''}
      ${rc.rara>0 ? `<div style="width:${(rc.rara/totalRef)*100}%;background:var(--rara)"></div>` : ''}
      ${rc.epica>0 ? `<div style="width:${(rc.epica/totalRef)*100}%;background:var(--epica)"></div>` : ''}
      ${rc.legendaria>0 ? `<div style="width:${(rc.legendaria/totalRef)*100}%;background:var(--legendaria)"></div>` : ''}
    </div>`;

  html += `<div class="stats-grid">
    <div class="stat"><div class="num" style="color:var(--comun);text-shadow:0 0 15px var(--comun)">${fmt(rc.comun)}</div><div class="lbl">🌸 Común</div></div>
    <div class="stat"><div class="num" style="color:var(--rara);text-shadow:0 0 15px var(--rara)">${fmt(rc.rara)}</div><div class="lbl">🔥 Rara</div></div>
    <div class="stat"><div class="num" style="color:var(--epica);text-shadow:0 0 15px var(--epica)">${fmt(rc.epica)}</div><div class="lbl">💎 Épica</div></div>
    <div class="stat"><div class="num" style="color:var(--legendaria);text-shadow:0 0 15px var(--legendaria)">${fmt(rc.legendaria)}</div><div class="lbl">👑 Legendaria</div></div>
  </div>`;

  if (topSeries.length > 0) {
    html += `<div class="section-title">📺 Top series (${seriesList.length})</div>`;
    for (let i = 0; i < topSeries.length; i++) {
      const [name, count] = topSeries[i];
      const cls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
      html += `<div class="row">
        <div class="left">
          <div class="rank ${cls}">${medal}</div>
          <div class="info">
            <div class="name">${esc(name)}</div>
            <div class="sub">${count} personaje${count !== 1 ? 's' : ''}</div>
          </div>
        </div>
      </div>`;
    }
  }

  if (exclusivaNames.length > 0) {
    html += `<div class="section-title">🌟 Waifus exclusivas</div>`;
    for (const n of exclusivaNames.slice(0, 20)) {
      const has = ownedSet.has(n.toLowerCase());
      html += `<div class="row">
        <div class="left">
          <div class="rank" style="background:${has ? 'linear-gradient(135deg, var(--exclusiva), #0891b2)' : 'linear-gradient(135deg, rgba(34,211,238,.15), rgba(34,211,238,.05))'}; ${has ? 'color:#001a20;box-shadow:0 0 15px rgba(34,211,238,.6)' : 'color:var(--exclusiva)'}">🌟</div>
          <div class="info">
            <div class="name" style="color:${has ? 'var(--exclusiva)' : 'var(--text)'}">${esc(n)}</div>
            <div class="sub">${has ? 'En tu colección' : 'No la tienes'}</div>
          </div>
        </div>
        <div class="right">${has ? '✅' : '—'}</div>
      </div>`;
    }
    if (exclusivaNames.length > 20) {
      html += `<p class="hint">… y ${exclusivaNames.length - 20} más</p>`;
    }
  }

  html += `<p class="hint" style="text-align:left;margin-top:16px">
    💡 Datos desde <b>/catalog</b> en Firebase. Actualizado cada 5 min.
  </p></div>`;

  c.innerHTML = html;
}

/* ---------- RANKING ---------- */
function renderRanking() {
  const c = $('tab-ranking');
  const top = ranking?.top || [];
  if (!top.length) {
    c.innerHTML = `<div class="card"><div class="empty"><span class="icon">🏆</span>Sin datos de ranking aún.</div></div>`;
    return;
  }
  const myId = session.userId;

  let html = `<div class="card">
    <div class="stats-grid">
      <div class="stat"><div class="num">${fmt(ranking.totalUsers || 0)}</div><div class="lbl">👥 Jugadores</div></div>
      <div class="stat"><div class="num">${fmt(ranking.totalWaifus || 0)}</div><div class="lbl">🍥 Waifus totales</div></div>
    </div>
    <div class="section-title">Top 10</div>`;

  for (let i = 0; i < Math.min(top.length, 10); i++) {
    const u = top[i];
    const isMe = String(u.userId) === String(myId);
    const cls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    html += `<div class="row" ${isMe ? 'style="border-color:var(--cyan);box-shadow:0 0 15px rgba(34,211,238,.3)"' : ''}>
      <div class="left">
        <div class="rank ${cls}">${medal}</div>
        <div class="info">
          <div class="name">${esc(u.display)}${isMe ? ' (tú)' : ''}</div>
          <div class="sub">${u.unique} únicas</div>
        </div>
      </div>
      <div class="right">${fmt(u.count)}</div>
    </div>`;
  }
  html += `</div>`;
  c.innerHTML = html;
}

/* ============================================================
   TIENDA (con sub-pestañas)
   ============================================================ */
function renderShop() {
  const c = $('tab-shop');
  const myCoins = Number(userData?.coins) || 0;

  let html = `<div class="card">
    <div class="stats-grid">
      <div class="stat"><div class="num">${fmt(myCoins)}</div><div class="lbl">🪙 Tu saldo</div></div>
      <div class="stat"><div class="num">${Object.keys(sales || {}).length}</div><div class="lbl">🌸 En venta</div></div>
    </div>

    <div class="subtabs" id="shop-subtabs">
      <button class="subtab ${shopSubTab === 'waifus' ? 'active' : ''}" data-sub="waifus">🌸 Waifus</button>
      <button class="subtab ${shopSubTab === 'boxes' ? 'active' : ''}" data-sub="boxes">🎁 Cajas misteriosas</button>
      <button class="subtab ${shopSubTab === 'catalog' ? 'active' : ''}" data-sub="catalog">📊 Catálogo</button>
    </div>

    <div id="shop-content"></div>
  </div>`;

  c.innerHTML = html;

  // Bind subtabs
  c.querySelectorAll('#shop-subtabs .subtab').forEach(btn => {
    btn.addEventListener('click', () => {
      shopSubTab = btn.dataset.sub;
      renderShop();
    });
  });

  // Render sub-content
  const content = $('shop-content');
  if (shopSubTab === 'waifus')  renderShopWaifus(content);
  if (shopSubTab === 'boxes')   renderShopBoxes(content);
  if (shopSubTab === 'catalog') renderShopCatalog(content);
}

/* Sub-tab: Waifus en venta */
function renderShopWaifus(container) {
  const allSales = Object.values(sales || {});
  const series = catalog?.series || {};
  const myCoins = Number(userData?.coins) || 0;
  const myId = session.userId;

  let html = '';
  if (allSales.length === 0) {
    html = `<div class="empty"><span class="icon">🏪</span>No hay waifus en venta ahora mismo.</div>`;
  } else {
    allSales.sort((a, b) => a.price - b.price);
    for (const s of allSales.slice(0, 60)) {
      watchImage(s.waifu?.name);
      const url = imageUrls[s.waifu?.name] || '';
      const initial = (s.waifu?.name || '?').charAt(0).toUpperCase();
      const seller = s.sellerUsername ? '@' + esc(s.sellerUsername) : esc(s.sellerName || 'Anónimo');
      const isMine = String(s.sellerId) === String(myId);
      const canAfford = myCoins >= (s.price || 0);
      const disabled = isMine || !canAfford;

      html += `<div class="row">
        <div class="left">
          <div class="rank" style="background:${url ? `url('${esc(url)}') center/cover` : 'linear-gradient(135deg, rgba(255,45,146,.2), rgba(139,92,246,.2))'}; color:${url ? 'transparent' : 'inherit'}">${initial}</div>
          <div class="info">
            <div class="name">${esc(s.waifu?.name || '?')}</div>
            <div class="sub">${seller}${series[s.waifu?.name] ? ' · ' + esc(series[s.waifu.name]) : ''}</div>
          </div>
        </div>
        <button class="btn-buy" data-buy="${esc(s.saleId)}" ${disabled ? 'disabled' : ''}>
          ${isMine ? 'Tu venta' : (canAfford ? `Comprar ${fmt(s.price)}🪙` : `Faltan ${fmt((s.price||0)-myCoins)}🪙`)}
        </button>
      </div>`;
    }
  }

  html += `<p class="hint" style="text-align:left;margin-top:14px">
    💡 Haz clic en <b>Comprar</b> para adquirir una waifu directamente desde la web.<br>
    Las compras son procesadas por el bot en <b>~3 segundos</b>.
  </p>`;

  container.innerHTML = html;

  container.querySelectorAll('.btn-buy').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const saleId = btn.dataset.buy;
      if (!saleId || btn.disabled) return;
      btn.disabled = true;
      const original = btn.textContent;
      btn.innerHTML = '<span class="loading"></span>';
      try {
        await requestBuy(saleId);
      } catch (err) {
        showToast('❌ ' + (err.message || 'Error'), 'err');
      } finally {
        setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 5000);
      }
    });
  });
}

/* Sub-tab: Cajas misteriosas */
function renderShopBoxes(container) {
  const myCoins = Number(userData?.coins) || 0;

  let html = `<div class="section-title">🎁 Cajas misteriosas</div>
    <div class="boxes-grid">`;

  for (const key of ['comun', 'premium', 'legendaria']) {
    const box = CAJAS[key];
    const canAfford = myCoins >= box.price;
    const disabled = !canAfford;
    html += `<div class="box-card" data-box="${key}" data-can="${disabled ? 0 : 1}">
      <span class="bemoji">${box.emoji}</span>
      <div class="bname">${box.name}</div>
      <div class="bdesc">${box.desc}</div>
      <div class="bprice">${fmt(box.price)} 🪙</div>
    </div>`;
  }

  html += `</div>

    <p class="hint" style="text-align:left;margin-top:18px">
      💡 Toca una caja para abrirla al instante.<br>
      El bot procesará la apertura, te avisará por DM con las imágenes y las waifus aparecerán en tu colección en segundos.<br>
      🔒 Cada apertura consume las monedas correspondientes.
    </p>`;

  container.innerHTML = html;

  container.querySelectorAll('.box-card').forEach(card => {
    const key = card.dataset.box;
    const canOpen = card.dataset.can === '1';
    if (!canOpen) {
      card.style.opacity = '.55';
      card.style.cursor = 'not-allowed';
      return;
    }
    card.addEventListener('click', async () => {
      if (card.dataset.opening) return;
      card.dataset.opening = '1';
      const original = card.innerHTML;
      card.style.opacity = '.6';
      card.style.pointerEvents = 'none';
      try {
        await requestBox(key);
      } catch (err) {
        showToast('❌ ' + (err.message || 'Error'), 'err');
      } finally {
        setTimeout(() => {
          card.innerHTML = original;
          card.style.opacity = '1';
          card.style.pointerEvents = '';
          delete card.dataset.opening;
        }, 5000);
      }
    });
  });
}

/* Sub-tab: Catálogo */
function renderShopCatalog(container) {
  const pool = catalog?.pool || {};
  const series = catalog?.series || {};

  const rc = { comun: 0, rara: 0, epica: 0, legendaria: 0 };
  for (const r in rc) {
    const entry = pool[r];
    if (!entry) { rc[r] = 0; continue; }
    const chars = entry.characters;
    if (Array.isArray(chars)) rc[r] = chars.length;
    else if (chars && typeof chars === 'object') rc[r] = Object.keys(chars).length;
    else rc[r] = 0;
  }

  const totalSalvajes = rc.comun + rc.rara + rc.epica + rc.legendaria;

  const poolNames = new Set();
  for (const r in pool) {
    const chars = pool[r]?.characters;
    if (Array.isArray(chars)) chars.forEach(n => poolNames.add(n));
    else if (chars && typeof chars === 'object') Object.keys(chars).forEach(n => poolNames.add(n));
  }
  let exclusivas = 0;
  for (const n of Object.keys(series)) {
    if (!poolNames.has(n)) exclusivas++;
  }

  const totalSeriesSet = new Set(Object.values(series).filter(Boolean));
  const totalSeries = totalSeriesSet.size;

  let html = `<div class="section-title">📊 Catálogo del sistema</div>
    <div class="stats-grid">
      <div class="stat"><div class="num">${fmt(totalSalvajes)}</div><div class="lbl">🌿 Salvajes</div></div>
      <div class="stat"><div class="num">${fmt(exclusivas)}</div><div class="lbl">🌟 Exclusivas</div></div>
      <div class="stat"><div class="num">${fmt(totalSeries)}</div><div class="lbl">📺 Series</div></div>
    </div>

    <div class="section-title">🌸 Rareza del catálogo</div>
    <div class="stats-grid">
      <div class="stat"><div class="num" style="color:var(--comun);text-shadow:0 0 15px var(--comun)">${fmt(rc.comun)}</div><div class="lbl">🌸 Común</div></div>
      <div class="stat"><div class="num" style="color:var(--rara);text-shadow:0 0 15px var(--rara)">${fmt(rc.rara)}</div><div class="lbl">🔥 Rara</div></div>
      <div class="stat"><div class="num" style="color:var(--epica);text-shadow:0 0 15px var(--epica)">${fmt(rc.epica)}</div><div class="lbl">💎 Épica</div></div>
      <div class="stat"><div class="num" style="color:var(--legendaria);text-shadow:0 0 15px var(--legendaria)">${fmt(rc.legendaria)}</div><div class="lbl">👑 Legendaria</div></div>
    </div>

    <p class="hint" style="text-align:left;margin-top:14px">
      💡 El catálogo se actualiza cada 5 minutos desde el bot.<br>
      Para ver tu <b>progreso personal</b>, abre la pestaña <b>🌍 Sistema</b> del menú lateral.
    </p>`;

  container.innerHTML = html;
}

/* ---------- SUBASTA ---------- */
function renderAuction() {
  if (auctionTimer) { clearInterval(auctionTimer); auctionTimer = null; }
  const c = $('tab-auction');
  const a = auction?.active;

  if (!a) {
    c.innerHTML = `<div class="card"><div class="empty">
      <span class="icon">🌟</span>
      No hay subasta activa.<br>
      La próxima empieza a las <b>8:00 AM (MX)</b>.
    </div></div>`;
    return;
  }

  const bids = Object.values(a.bids || {}).sort((x, y) => y.amount - x.amount);
  const given = a.copiesGivenBefore || 0;
  const copyNum = given + 1;

  let html = `<div class="card">
    <div class="auction-hero">
      <div class="auction-tag">${a.testMode ? '🧪 Prueba' : '🌟 En vivo'} · Copia ${copyNum}/${a.maxCopies || 3}</div>
      <div class="auction-name">${esc(a.waifuName)}</div>
      <div class="countdown" id="auction-countdown">--:--</div>
    </div>

    <div class="stats-grid">
      <div class="stat"><div class="num">${bids.length}</div><div class="lbl">📊 Pujas</div></div>
      <div class="stat"><div class="num">${bids[0] ? fmt(bids[0].amount) : 0}</div><div class="lbl">🏆 Mejor puja</div></div>
    </div>

    <div class="section-title">🏆 Top postores</div>`;

  if (bids.length === 0) {
    html += `<div class="empty">Sin pujas aún. ¡Sé el primero desde el bot!</div>`;
  } else {
    for (let i = 0; i < Math.min(bids.length, 5); i++) {
      const b = bids[i];
      const cls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
      const display = b.username ? '@' + esc(b.username) : esc(b.name || ('Usuario ' + b.userId));
      html += `<div class="row">
        <div class="left"><div class="rank ${cls}">${medal}</div><div class="info"><div class="name">${display}</div></div></div>
        <div class="right">${fmt(b.amount)} 🪙</div>
      </div>`;
    }
  }
  html += `<p class="hint" style="text-align:left;margin-top:14px">💡 Para pujar, usa los botones del mensaje en el grupo.</p></div>`;
  c.innerHTML = html;

  const cdEl = $('auction-countdown');
  if (!cdEl) return;
  const updateCd = () => {
    const rem = Math.max(0, a.endTime - Date.now());
    const h = Math.floor(rem / 3600000);
    const m = Math.floor((rem % 3600000) / 60000);
    const s = Math.floor((rem % 60000) / 1000);
    cdEl.textContent = h > 0
      ? `${h}h ${String(m).padStart(2,'0')}m`
      : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (rem < 5 * 60 * 1000) cdEl.classList.add('urgent');
    else cdEl.classList.remove('urgent');
  };
  updateCd();
  auctionTimer = setInterval(updateCd, 1000);
}

/* ============================================================
   LOGOUT
   ============================================================ */
$('btn-logout').addEventListener('click', async () => {
  unsubs.forEach(u => { try { u(); } catch {} });
  unsubs.length = 0;
  imageUnsubs.forEach(u => { try { u(); } catch {} });
  imageUnsubs.clear();
  actionUnsubs.forEach(u => { try { u(); } catch {} });
  actionUnsubs.clear();
  if (auctionTimer) { clearInterval(auctionTimer); auctionTimer = null; }

  if (session?.token) { try { await remove(ref(db, `sessions/${session.token}`)); } catch {} }
  localStorage.removeItem('jinx_session');
  session = userDoc = userData = null;
  if (unsubRequest) { unsubRequest(); unsubRequest = null; }

  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('show');
  navigateTo('profile');

  show('screen-login');
  inputEl.value = '';
  $('btn-request').disabled = false;
  $('btn-request').textContent = '▶ Enviar código';
  codeInputs.forEach(i => i.value = '');
});

/* ============================================================
   AUTOLOGIN
   ============================================================ */
(async () => {
  const token = localStorage.getItem('jinx_session');
  if (!token) return;
  try { await startSession(token); }
  catch { localStorage.removeItem('jinx_session'); }
})();
