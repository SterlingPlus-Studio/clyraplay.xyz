﻿<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jinx Waifus Web</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --pink:#ff2d92; --purple:#8b5cf6; --cyan:#22d3ee; --gold:#fbbf24;
    --bg:#07030f; --panel:#0d0620; --panel2:#150b26;
    --border:#3d2561; --border2:#5b3fa0;
    --text:#e9e2ff; --muted:#8a7bb0;
    --comun:#ffb6c1; --rara:#ff8383; --epica:#a78bfa; --legendaria:#fbbf24; --exclusiva:#22d3ee;
    --sidebar-w: 250px;
    --ok:#22c55e; --err:#ef4444;
    --app-vh: 1vh;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0%{background-position: -200% 0} 100%{background-position: 200% 0} }
  @keyframes glowPulse { 0%,100%{box-shadow:0 0 20px rgba(139,92,246,.35)} 50%{box-shadow:0 0 35px rgba(255,45,146,.55)} }
  @keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }
  @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pop { 0%{transform:scale(.9);opacity:0} 60%{transform:scale(1.03)} 100%{transform:scale(1);opacity:1} }
  @keyframes modalFade { from{opacity:0} to{opacity:1} }
  @keyframes toastIn { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(-10px)} }
  @keyframes chatPop { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes stickerPop { 0%{opacity:0;transform:scale(.85)} 60%{transform:scale(1.03)} 100%{opacity:1;transform:scale(1)} }
  @keyframes resultIn{ 0%{opacity:0;transform:scale(.7) translateY(15px)} 60%{opacity:1;transform:scale(1.05) translateY(0)} 100%{transform:scale(1)} }
  @keyframes reelSymbol { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes playShine{ 0%{left:-60%} 50%,100%{left:130%} }
  @keyframes winPulse {
    0%,100% { box-shadow: 0 0 25px rgba(251,191,36,.6), inset 0 0 25px rgba(251,191,36,.25); }
    50%     { box-shadow: 0 0 55px rgba(251,191,36,1), inset 0 0 40px rgba(251,191,36,.5); }
  }
  @keyframes boxShake{
    0%,100%{ transform: rotate(-5deg) scale(1); }
    50%    { transform: rotate(5deg) scale(1.07); }
  }

  html { background: #07030f; width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    color: var(--text); background: #07030f; min-height: 100vh; width: 100%;
    max-width: 100vw; overflow-x: hidden; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; position: relative;
  }
  body.modal-open { overflow: hidden; }
  .ic { display: inline-block; vertical-align: middle; flex-shrink: 0; }

  .bg-layers {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,45,146,.15), transparent 45%),
      radial-gradient(circle at 85% 25%, rgba(139,92,246,.22), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(34,211,238,.15), transparent 45%),
      linear-gradient(180deg, #07030f, #0a0518 50%, #07030f);
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: -1; opacity: .30; pointer-events: none;
    background-image:
      linear-gradient(rgba(139,92,246,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 100%);
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 100%);
  }
  .scanline {
    position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
    background: linear-gradient(transparent 0%, rgba(139,92,246,.06) 50%, transparent 100%);
    height: 20vh; width: 100%; animation: scanline 8s linear infinite; opacity: .4;
  }

  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: rgba(13,6,32,.6); border-radius: 10px; }
  *::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--pink), var(--purple), var(--cyan));
    border-radius: 10px; border: 2px solid rgba(13,6,32,.9);
    box-shadow: inset 0 0 6px rgba(255,45,146,.5);
  }
  * { scrollbar-width: thin; scrollbar-color: var(--purple) rgba(13,6,32,.8); }

  #toast-wrap{
    position: fixed; top: max(20px, env(safe-area-inset-top, 20px));
    left: 50%; transform: translateX(-50%); z-index: 99999;
    display:flex; flex-direction:column; gap: 8px;
    align-items: center; pointer-events: none; padding: 0 12px; width: 100%; max-width: 500px;
  }
  .toast{
    padding: 14px 22px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(21,11,38,.98), rgba(13,6,32,.98));
    border: 1px solid var(--purple); color: var(--text);
    font-size: 13px; font-weight: 700; letter-spacing: .5px;
    box-shadow: 0 0 30px rgba(139,92,246,.5), inset 0 1px 0 rgba(255,255,255,.1);
    animation: toastIn .3s ease; width: fit-content; max-width: 100%; text-align: center;
    pointer-events: auto; display: flex; align-items: center; gap: 8px; justify-content: center;
  }
  .toast.ok{ border-color: var(--ok); box-shadow: 0 0 30px rgba(34,197,94,.45); }
  .toast.err{ border-color: var(--err); box-shadow: 0 0 30px rgba(239,68,68,.45); }
  .toast.hide{ animation: toastOut .3s ease forwards; }

  .layout{ display: flex; min-height: 100vh; position: relative; width: 100%; overflow-x: clip; }

  .sidebar{
    width: var(--sidebar-w);
    background: linear-gradient(180deg, rgba(13,6,32,.98), rgba(7,3,15,.98));
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0;
    z-index: 100; transition: transform .3s ease;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .sidebar::before{
    content:''; position:absolute; top:0; right:0; width:2px; height:100%;
    background: linear-gradient(180deg, transparent, var(--purple), var(--pink), transparent);
    opacity:.5;
  }
  .sidebar-brand{ padding: 24px 20px 20px; border-bottom: 1px solid var(--border); position: relative; }
  .sidebar-brand .logo{
    font-size: 22px; font-weight: 900; letter-spacing: 1.5px;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan), var(--pink));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite; text-transform: uppercase; line-height: 1.1;
  }
  .sidebar-brand .sub{ font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .sidebar-brand .badge-dot{
    position:absolute; top: 24px; right: 20px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
    animation: pulse 2s infinite;
  }
  .sidebar-user{
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; font-size: 12px;
  }
  .sidebar-user .avatar-sm{
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 15px;
    border: 1.5px solid rgba(255,255,255,.15);
    box-shadow: 0 0 15px rgba(139,92,246,.4);
    flex-shrink: 0; overflow: hidden;
  }
  .sidebar-user .avatar-sm img{ width:100%; height:100%; object-fit: cover; display:block; }
  .sidebar-user .uinfo{ min-width: 0; flex: 1; }
  .sidebar-user .uname{ font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .sidebar-user .utag{ color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-nav{
    flex: 1; padding: 14px 12px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .nav-item{
    display: flex; align-items: center; justify-content: flex-start;
    gap: 12px;
    padding: 12px 14px; border-radius: 10px;
    color: var(--muted); font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; border: 1px solid transparent;
    background: transparent; transition: .2s;
    text-align: left; font-family: inherit; width: 100%;
    position: relative;
  }
  .nav-item .icon{
    font-size: 16px;
    width: 22px;
    min-width: 22px;
    text-align: center;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-item > span:last-child{
    flex: 1;
    text-align: left;
  }
  .nav-item:hover:not(.active){ color: var(--text); background: rgba(139,92,246,.08); border-color: rgba(139,92,246,.25); }
  .nav-item.active{
    color: var(--text);
    background: linear-gradient(90deg, rgba(255,45,146,.18), rgba(139,92,246,.15));
    border-color: var(--purple);
    box-shadow: inset 0 0 20px rgba(139,92,246,.2), 0 0 15px rgba(139,92,246,.2);
  }
  .nav-item.active::before{
    content:''; position:absolute; left: -12px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 60%;
    background: linear-gradient(180deg, var(--pink), var(--cyan));
    border-radius: 3px; box-shadow: 0 0 10px var(--pink);
  }
  .sidebar-footer{ padding: 14px 12px; padding-bottom: max(14px, env(safe-area-inset-bottom, 14px)); }
  .btn-logout{
    width: 100%; display: flex; align-items: center; justify-content: flex-start; gap: 10px;
    padding: 12px 14px; border-radius: 10px;
    background: transparent; border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    font-family: inherit; transition: .2s;
  }
  .btn-logout:hover{ background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.6); box-shadow: 0 0 20px rgba(239,68,68,.25); }
  .btn-logout .icon{ font-size: 15px; display:flex; align-items:center; width: 22px; min-width: 22px; justify-content: center; }

  .main{
    flex: 1; margin-left: var(--sidebar-w);
    padding: 26px 24px 60px;
    min-width: 0; width: 100%; max-width: 100%;
  }
  .main-inner{ max-width: 1080px; margin: 0 auto; width: 100%; }

  .topbar{
    display: none; align-items: center; gap: 12px;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top, 12px));
    background: rgba(13,6,32,.95);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 90;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .hamburger{
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(139,92,246,.15); border: 1px solid var(--border);
    color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; box-shadow: none; flex-shrink: 0;
  }
  .hamburger:hover{ background: rgba(139,92,246,.25); transform: none; }
  .topbar-title{
    font-size: 14px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--pink), var(--cyan));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    text-transform: uppercase; flex: 1; text-align: right;
  }

  .overlay{ display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 95; }
  .overlay.show{ display: block; }

  /* ============================================================
     CARD — solo para Login (los modales usan su propio estilo)
     ============================================================ */
  .card{
    background: linear-gradient(180deg, rgba(21,11,38,.85), rgba(13,6,32,.95));
    border: 1px solid var(--border); border-radius: 16px;
    padding: 22px 20px; position:relative;
    box-shadow: 0 0 30px rgba(139,92,246,.15), inset 0 1px 0 rgba(255,255,255,.04);
    margin-bottom: 16px; width: 100%;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(90deg, transparent, var(--purple), var(--pink), transparent);
    pointer-events: none;
  }
  .card::after{
    content:''; position:absolute; top:8px; right:8px; width:14px; height:14px;
    border-top:2px solid var(--cyan); border-right:2px solid var(--cyan);
    opacity:.6; pointer-events: none;
  }

  /* Wrapper SIN recuadro exterior — se usa en TODAS las pestañas del panel */
  .page-wrap{
    display: block;
    width: 100%;
    margin-bottom: 16px;
  }

  .screen{ display:none; width: 100%; }
  .screen.active{ display:block; animation: slideUp .4s ease; }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; animation: slideUp .3s ease; }

  label { display:block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
  input{
    width:100%; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: #0a0420; color: var(--text);
    font-size: 16px; outline: none; transition: .2s; font-family: inherit;
    -webkit-appearance: none;
  }
  input:focus{ border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,92,246,.25), 0 0 20px rgba(139,92,246,.3); }

  button{
    padding: 14px 18px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    color: white; font-size: 14px; font-weight: 800;
    cursor: pointer; transition: .2s;
    text-transform: uppercase; letter-spacing: 1px;
    font-family: inherit;
    box-shadow: 0 0 20px rgba(255,45,146,.35), inset 0 1px 0 rgba(255,255,255,.15);
    -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button:hover:not(:disabled){ transform: translateY(-1px); box-shadow: 0 0 30px rgba(255,45,146,.55), inset 0 1px 0 rgba(255,255,255,.2); }
  button:active:not(:disabled){ transform: translateY(0) scale(.98); }
  button:disabled{ opacity: .5; cursor: not-allowed; box-shadow:none; }
  .btn-full{ width:100%; margin-top: 16px; }
  .btn-ghost{ background: transparent; border: 1px solid var(--border); color: var(--muted); box-shadow:none; }
  .btn-ghost:hover{ color: var(--text); border-color: var(--purple); box-shadow: 0 0 15px rgba(139,92,246,.3); }

  .msg{ margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 13px; display: none; font-weight: 500; }
  .msg.err{ display:block; background: rgba(239,68,68,.12); color:#fca5a5; border:1px solid rgba(239,68,68,.4); }
  .msg.ok { display:block; background: rgba(34,211,238,.12); color:#7ae6f5; border:1px solid rgba(34,211,238,.4); }

  .tabs{ display:flex; gap:6px; margin-bottom: 18px; background: rgba(13,6,32,.7); padding:5px; border-radius:12px; border:1px solid var(--border); flex-wrap: wrap; }
  .tab{
    flex:1; min-width: 80px; padding:10px 6px; border-radius: 8px;
    cursor:pointer; font-size: 11px; color: var(--muted);
    text-align:center; background: transparent; border:none;
    text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    transition: .2s; font-family: inherit; box-shadow:none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tab:hover:not(.active){ color: var(--text); }
  .tab.active{ background: linear-gradient(90deg, rgba(255,45,146,.25), rgba(139,92,246,.25)); color: var(--text); box-shadow: inset 0 0 20px rgba(139,92,246,.3), 0 0 15px rgba(139,92,246,.25); }

  .subtabs{ display:flex; gap:8px; margin-bottom: 20px; flex-wrap:wrap; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .subtab{
    padding: 10px 18px; border-radius: 20px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 11px; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    font-family: inherit; transition: .2s; box-shadow: none;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .subtab:hover:not(.active){ color: var(--text); border-color: var(--border2); box-shadow: none; transform: none; }
  .subtab.active{ background: linear-gradient(90deg, rgba(255,45,146,.25), rgba(139,92,246,.25)); color: var(--text); border-color: var(--purple); box-shadow: inset 0 0 20px rgba(139,92,246,.25), 0 0 15px rgba(139,92,246,.3); }

  .profile{
    display:flex; align-items:center; gap:16px;
    padding: 16px; border-radius: 14px;
    background: rgba(10,4,32,.7); border: 1px solid var(--border);
    margin-bottom: 16px; position:relative;
  }
  .avatar{
    width: 64px; height: 64px; border-radius: 12px; flex-shrink:0;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items:center; justify-content:center;
    font-size: 26px; font-weight: 900;
    border: 2px solid rgba(255,255,255,.15);
    box-shadow: 0 0 25px rgba(139,92,246,.5);
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit: cover; display:block; }
  .profile-info{ flex:1; min-width:0; }
  .profile-info .name{ font-size: 17px; font-weight: 800; letter-spacing: .3px; word-break: break-word; }
  .profile-info .tag{ font-size: 12px; color: var(--muted); margin-top: 3px; }
  .plus-badge{
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; padding: 3px 10px; border-radius: 20px;
    background: linear-gradient(90deg, #f59e0b, #ec4899);
    color: white; font-weight: 800; margin-left: 8px; letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stats-grid{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px; margin-bottom: 16px;
  }
  .stat{
    padding: 14px 10px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(21,11,38,.85), rgba(10,4,32,.9));
    border: 1px solid var(--border); text-align: center;
    position:relative; overflow:hidden;
  }
  .stat::before{
    content:''; position:absolute; bottom:0; left:10%; right:10%; height:2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:.6;
  }
  .stat .num{ font-size: 22px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 15px rgba(34,211,238,.6); font-variant-numeric: tabular-nums; }
  .stat .lbl{
    font-size: 10px; color: var(--muted); margin-top: 5px;
    text-transform: uppercase; letter-spacing: 1.2px; font-weight:600;
    display: inline-flex; align-items: center; gap: 5px; justify-content: center;
  }

  .rarity-bar{
    display:flex; height: 6px; border-radius: 20px; overflow: hidden;
    margin-bottom: 16px; background: rgba(10,4,32,.9);
    border: 1px solid var(--border);
  }
  .rarity-bar > div{ height: 100%; transition: width .5s ease; }

  .section-title{
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); margin: 20px 0 12px; font-weight:700;
    display:flex; align-items:center; gap:10px;
  }
  .section-title::before{
    content:''; width: 3px; height: 14px;
    background: linear-gradient(180deg, var(--pink), var(--cyan));
    border-radius: 3px; box-shadow: 0 0 10px var(--pink);
  }
  .section-title::after{ content:''; flex:1; height:1px; background: linear-gradient(90deg, var(--border), transparent); }

  .filters{ display:flex; gap:6px; margin-bottom: 14px; flex-wrap:wrap; }
  .filters button{
    font-size: 10px; padding: 7px 12px; border-radius: 20px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 700; box-shadow:none;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .filters button:hover{ color: var(--text); box-shadow: 0 0 12px rgba(139,92,246,.25); }
  .filters button.active{
    background: linear-gradient(90deg, rgba(255,45,146,.3), rgba(139,92,246,.3));
    color: var(--text); border-color: var(--purple);
    box-shadow: 0 0 15px rgba(139,92,246,.4);
  }

  .grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .wcard{
    background: linear-gradient(180deg, rgba(21,11,38,.9), rgba(10,4,32,.95));
    border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; position:relative; cursor: pointer;
    transition: transform .2s, box-shadow .3s, border-color .3s;
    animation: pop .3s ease;
    content-visibility: auto;
    contain-intrinsic-size: 200px 260px;
  }
  .wcard:hover{ transform: translateY(-3px); box-shadow: 0 12px 30px rgba(139,92,246,.35); border-color: var(--border2); }
  .wcard .img{
    width: 100%; aspect-ratio: 3/4;
    background: linear-gradient(135deg, #1a0a33, #0a0420);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .wcard .img img{ width:100%; height:100%; object-fit: cover; display:block; }
  .wcard .img .placeholder{
    font-size: 42px; font-weight: 900;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    opacity:.7;
  }

};
function ico(name, size = 16) {
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[name] || ''}</svg>`;
}
function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => {
    const name = el.dataset.icon;
    const size = parseInt(el.dataset.iconSize || '16', 10);
    const svg = ico(name, size);
    const iconSpan = el.querySelector('.icon');
    if (iconSpan) iconSpan.innerHTML = svg;
    else if (el.tagName === 'BUTTON' && !el.querySelector('svg')) el.insertAdjacentHTML('afterbegin', svg);
  });
}

function showToast(text, kind = 'ok', duration = 3500, iconName = null) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  const ic = iconName || (kind === 'err' ? 'x' : 'check');
  el.innerHTML = ico(ic, 15) + '<span>' + esc(text) + '</span>';
  $('toast-wrap').appendChild(el);
  setTimeout(() => {
    el.classList.add('hide');
    setTimeout(() => el.remove(), 300);
  }, duration);
}

function groupWaifusByRarity(waifus) {
  const map = new Map();
  for (const w of waifus) {
    if (!w?.name) continue;
    const k = String(w.name);
    const rar = w.rarity || 'comun';
    if (!map.has(k)) map.set(k, { name: k, rarity: rar, count: 0 });
    const entry = map.get(k);
    if ((RARITY_RANK[rar] ?? 99) < (RARITY_RANK[entry.rarity] ?? 99)) entry.rarity = rar;
    entry.count++;
  }
  const order = { exclusiva: 0, legendaria: 1, epica: 2, rara: 3, comun: 4 };
  return [...map.values()].sort((a, b) => {
    const d = (order[a.rarity] ?? 9) - (order[b.rarity] ?? 9);
    return d !== 0 ? d : a.name.localeCompare(b.name);
  });
}

function countRarityFromGroups(groups) {
  const rc = { comun: 0, rara: 0, epica: 0, legendaria: 0, exclusiva: 0 };
  for (const g of groups) if (rc[g.rarity] != null) rc[g.rarity] += g.count;
  return rc;
}

async function startSession(token) {
  const sessSnap = await get(ref(db, `sessions/${token}`));
  const sess = sessSnap.val();
  if (!sess) throw new Error('Sesión no válida.');
  session = { token, ...sess };

  show('screen-panel');
  await loadAll();
  subscribeRealtime();
  renderAll();
}

async function loadAll() {
  const uid = session.userId;
  const [uSnap, dSnap, cSnap, rSnap, sSnap, aSnap] = await Promise.all([
    get(ref(db, `users/${uid}`)),
    get(ref(db, `users/${uid}/data`)),
    get(ref(db, `catalog`)),
    get(ref(db, `ranking`)),
    get(ref(db, `sales`)),
    get(ref(db, `auction`))
  ]);
  userDoc  = uSnap.val()  || {};
  userData = dSnap.val()  || {};
  catalog  = cSnap.val()  || { pool: {}, series: {} };
  ranking  = rSnap.val()  || { top: [], totalUsers: 0, totalWaifus: 0 };
  sales    = sSnap.val()  || {};
  auction  = aSnap.val()  || { active: null };
}

function subscribeRealtime() {
  const uid = session.userId;
  unsubs.push(onValue(ref(db, `users/${uid}/data`), (s) => {
    userData = s.val() || {};
    renderProfile(); renderSidebarUser();
    if (currentTab === 'collection') renderCollection();
    if (currentTab === 'shop')       renderShop();
    if (currentTab === 'minigames' && !gameRunning) renderMinigames();
    if (modalOpenUserId && String(modalOpenUserId) === String(uid)) renderModalProfile();
  }));
  unsubs.push(onValue(ref(db, `users/${uid}`), (s) => {
    userDoc = s.val() || {};
    renderProfile(); renderSidebarUser();
    if (modalOpenUserId && String(modalOpenUserId) === String(uid)) renderModalProfile();
  }));
  unsubs.push(onValue(ref(db, `catalog`), (s) => {
    catalog = s.val() || { pool: {}, series: {} };
    if (currentTab === 'shop') renderShop();
  }));
  unsubs.push(onValue(ref(db, `sales`),   (s) => { sales = s.val() || {}; if (currentTab === 'shop') renderShop(); }));
  unsubs.push(onValue(ref(db, `ranking`), (s) => {
    ranking = s.val() || { top: [] };
    if (currentTab === 'ranking') renderRanking();
  }));
  unsubs.push(onValue(ref(db, `auction`), (s) => { auction = s.val() || { active: null }; if (currentTab === 'auction') renderAuction(); }));
}

function watchImage(name, targetMap = imageUnsubs) {
  if (!name || targetMap.has(name)) return;
  const key = imageKey(name);
  const unsub = onValue(ref(db, `characterImages/${key}/url`), (snap) => {
    const url = snap.val();
    if (typeof url === 'string' && url) {
      imageUrls[name] = url;
      document.querySelectorAll(`[data-img="${CSS.escape(name)}"]`).forEach(target => {
        const holder = target.querySelector('.img') || target;
        let img = holder.querySelector('img');
        if (!img) {
          holder.innerHTML = `<img src="${esc(url)}" alt="" loading="lazy" style="opacity:0;transition:opacity .4s" onload="this.style.opacity='1'">`;
        } else if (img.src !== url) {
          img.src = url; img.style.opacity = '1';
        }
      });
    }
  });
  targetMap.set(name, unsub);
}

    tipo, bet, choice: choice || null,
    userId: session.userId, sessionToken: session.token,
    status: 'pending', createdAt: Date.now()
  });

  return new Promise((resolve, reject) => {
    let done = false;
    const unsub = onValue(ref(db, `gameRequests/${reqId}`), (snap) => {
      const r = snap.val();
      if (!r || done) return;
      if (r.status === 'done') {
        done = true;
        try { unsub(); } catch {}
        resolve(r);
      } else if (r.status === 'error') {
        done = true;
        try { unsub(); } catch {}
        reject(new Error(r.error || 'Error en el juego'));
      }
    });
    setTimeout(() => {
      if (done) return;
      done = true;
      try { unsub(); } catch {}
      reject(new Error('El servidor no respondió'));
    }, 15000);
  });
}

function chatFormatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts); const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (sameDay) return `${hh}:${mm}`;
  const dd = String(d.getDate()).padStart(2, '0');
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mo} ${hh}:${mm}`;
}

function chatFormatText(text) {
  const safe = esc(text);
  return safe.replace(/(https?:\/\/[^\s<]+)/g, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

function chatCreateMessageElement(msg, { grouped = false } = {}) {
  const div = document.createElement('div');
  const isSelf = String(msg.userId) === String(session.userId);
  div.className = 'chat-msg' + (isSelf ? ' me' : '') + (grouped ? ' grouped' : '');
  div.dataset.uid = msg.userId;

  const name = msg.name || (msg.username ? '@' + msg.username : `Usuario ${msg.userId}`);
  const initial = (name || '?').charAt(0).toUpperCase();
  const avatarInner = msg.photoUrl ? `<img src="${esc(msg.photoUrl)}" alt="" loading="lazy">` : initial;

  const isSticker = !!msg.sticker;
  const bubbleContent = isSticker
    ? `<img src="${esc(msg.sticker)}" alt="" loading="lazy">`
    : chatFormatText(msg.text || '');

  div.innerHTML = `
    <div class="chat-avatar" title="Ver perfil">${avatarInner}</div>
    <div class="chat-body">
      <div class="chat-meta">
        <span class="chat-name">${esc(name)}</span>
        <span class="chat-time">${chatFormatTime(msg.timestamp)}</span>
      </div>
      <div class="chat-bubble${isSticker ? ' sticker' : ''}">${bubbleContent}</div>
    </div>
  `;

  if (isSticker) {
    div.classList.add('chat-msg-sticker');
    if (!isSelf) div.classList.add('chat-msg-sticker-left');
  }

  const openProfile = () => {
    const uid = parseInt(msg.userId, 10);
    if (!isNaN(uid)) openUserModal(uid);
  };
  div.querySelector('.chat-avatar')?.addEventListener('click', openProfile);
  div.querySelector('.chat-name')?.addEventListener('click', openProfile);

  return div;
}

function chatScrollToBottom(smooth = false) {
  const box = document.querySelector('.chat-messages');
  if (!box) return;
  box.scrollTo({ top: box.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
}

function chatIsNearBottom() {
  const box = document.querySelector('.chat-messages');
  if (!box) return true;
  return (box.scrollHeight - box.scrollTop - box.clientHeight) < 80;
}

function chatShowNewBtn(show) {

}

function unsubscribeChat() {

}

function bindChatEvents() {
  const input   = $('chat-input');
  const sendBtn = $('chat-send');
  const counter = $('chat-counter');
  const newBtn  = $('chat-new-btn');
  const box     = $('chat-messages');

  input.addEventListener('input', () => {
    const len = input.value.length;
    counter.textContent = `${len}/${CHAT_MAX_LEN}`;
    counter.classList.toggle('show', len > 0);
    counter.classList.toggle('warn', len > CHAT_MAX_LEN * 0.85);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
  });

  sendBtn.addEventListener('click', sendChatMessage);

  box.addEventListener('scroll', () => {
    chatAutoScroll = chatIsNearBottom();
    if (chatAutoScroll) chatShowNewBtn(false);
  }, { passive: true });

  newBtn.addEventListener('click', () => {
    chatAutoScroll = true;
    chatShowNewBtn(false);
    chatScrollToBottom(true);
  });

  const stickerBtn = $('chat-sticker-btn');
  const stickerClose = $('chat-stickers-close');
  stickerBtn?.addEventListener('click', (e) => {
    e.stopPropagation();
    const panel = $('chat-stickers');
    if (panel && !panel.hidden) closeStickers();
    else openStickers();
  });
  stickerClose?.addEventListener('click', closeStickers);

  document.addEventListener('click', (e) => {
    const panel = $('chat-stickers');
    if (!panel || panel.hidden) return;
    if (panel.contains(e.target)) return;
    if (e.target === stickerBtn || stickerBtn?.contains(e.target)) return;
    closeStickers();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeStickers();
  });
}

async function sendChatMessage() {
  const input = $('chat-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  if (Date.now() - chatLastSentAt < CHAT_COOLDOWN_MS) {
    const wait = Math.ceil((CHAT_COOLDOWN_MS - (Date.now() - chatLastSentAt)) / 1000);
    showToast(`Espera ${wait}s antes de enviar otro mensaje`, 'err', 2000, 'clock');
    return;
  }
  if (text.length > CHAT_MAX_LEN) {
    showToast(`Máximo ${CHAT_MAX_LEN} caracteres`, 'err', 2500, 'x');
    return;
  }

  const sendBtn = $('chat-send');
  sendBtn.disabled = true;

  try {
    const payload = {
      userId: session.userId,
      name: userDoc?.firstName
        ? [userDoc.firstName, userDoc.lastName].filter(Boolean).join(' ')
        : (userDoc?.username || 'Usuario'),
      username: userDoc?.username || null,
      photoUrl: userDoc?.photoUrl || null,
      text, timestamp: Date.now()
    };
    await push(ref(db, 'chat'), payload);

    chatLastSentAt = Date.now();
    input.value = '';
    const counter = $('chat-counter');
    counter.textContent = `0/${CHAT_MAX_LEN}`;
    counter.classList.remove('show', 'warn');

    chatAutoScroll = true;
    chatShowNewBtn(false);
    setTimeout(() => chatScrollToBottom(true), 80);
  } catch (e) {
    showToast('Error al enviar: ' + (e.message || e), 'err', 4000, 'x');
  } finally {
    sendBtn.disabled = false;
  }
}

function subscribeChat() {
  if (chatSubscribed) return;
  chatSubscribed = true;

  const messagesRef = query(ref(db, 'chat'), limitToLast(100));
  const box = $('chat-messages');
  if (!box) return;

  chatUnsub = onChildAdded(messagesRef, (snap) => {
    const msg = snap.val();
    if (!msg || typeof msg !== 'object') return;
    if (!msg.text && !msg.sticker) return;

    const empty = box.querySelector('.chat-empty');
    if (empty) empty.remove();

    const wasAtBottom = chatAutoScroll || chatIsNearBottom();
    const lastEl = box.lastElementChild;
    const lastUid = lastEl?.dataset?.uid;
    let grouped = false;
    if (lastEl && lastUid && String(lastUid) === String(msg.userId)) grouped = true;

    const el = chatCreateMessageElement(msg, { grouped });
    box.appendChild(el);

    if (wasAtBottom) { chatScrollToBottom(true); chatShowNewBtn(false); }
    else { chatShowNewBtn(true); }
  }, (err) => { console.warn('Chat listener error:', err); });
}

function openStickers() {
  const panel = $('chat-stickers');
  if (!panel) return;
  panel.hidden = false;
  subscribeStickers();
}
function closeStickers() {
  const panel = $('chat-stickers');
  if (panel) panel.hidden = true;
  unsubscribeStickers();
}
function unsubscribeStickers() {
  if (stickerUnsub) { try { stickerUnsub(); } catch {} stickerUnsub = null; }
}
function subscribeStickers() {
  if (stickerUnsub) return;
  const grid = $('chat-stickers-grid');
  if (!grid) return;
  grid.innerHTML = `<div class="chat-stickers-empty">Cargando stickers…</div>`;
  stickerUnsub = onValue(ref(db, 'stickers'), (snap) => {
    const data = snap.val() || {};
    const list = Object.values(data)
      .filter(s => s && s.url)
      .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    if (list.length === 0) {
      grid.innerHTML = `<div class="chat-stickers-empty">
        Aún no hay stickers.<br>
        <b>Envía un sticker al bot por DM</b> y aparecerá aquí.
      </div>`;
      return;
    }
    grid.innerHTML = list.map(s => `
      <button class="chat-sticker-item" data-sticker="${esc(s.url)}" title="${esc(s.emoji || '')}">
        <img src="${esc(s.url)}" alt="" loading="lazy">
      </button>
    `).join('');
    grid.querySelectorAll('.chat-sticker-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const url = btn.dataset.sticker;
        if (url) sendStickerMessage(url);
      });
    });
  });
}

async function sendStickerMessage(stickerUrl) {
  if (!stickerUrl) return;
  if (Date.now() - chatLastSentAt < CHAT_COOLDOWN_MS) {
    const wait = Math.ceil((CHAT_COOLDOWN_MS - (Date.now() - chatLastSentAt)) / 1000);
    showToast(`Espera ${wait}s antes de enviar`, 'err', 2000, 'clock');
    return;
  }
  try {
    const payload = {
      userId: session.userId,
      name: userDoc?.firstName
        ? [userDoc.firstName, userDoc.lastName].filter(Boolean).join(' ')
        : (userDoc?.username || 'Usuario'),
      username: userDoc?.username || null,
      photoUrl: userDoc?.photoUrl || null,
      sticker: stickerUrl,
      timestamp: Date.now()
    };
    await push(ref(db, 'chat'), payload);
    chatLastSentAt = Date.now();
    closeStickers();
    chatAutoScroll = true;
    chatShowNewBtn(false);
    setTimeout(() => chatScrollToBottom(true), 80);
  } catch (e) {
    showToast('Error: ' + (e.message || e), 'err', 3000, 'x');
  }
}

    ];

      html += `<button class="mg-opt ${currentChoice === o.k ? 'active' : ''}" data-choice="${o.k}" data-color="${o.color}">
        <span class="mg-opt-icon" style="background: ${o.bg}; color: ${o.fg};">${o.icon}</span>
        <span class="mg-opt-label">${o.label}</span>
        <span class="mg-opt-sub">x2</span>
      </button>`;
    }

  } else {
    html += `<div class="section-title">${ico('target',11)} Sin elección</div>

      </p>`;
  }

  html += `<div class="section-title">${ico('coin',11)} Apuesta</div>
    <div class="mg-bets" id="mg-bets">`;
  for (const b of GAME_BETS) {
    const pct = myCoins > 0 ? Math.round((b / myCoins) * 100) : 0;
    html += `<button class="mg-bet ${currentBet === b ? 'active' : ''}" data-bet="${b}">
      <span class="mg-bet-amt">${ico('coin',12)} ${fmt(b)}</span>
      <span class="mg-bet-pct">${pct}%</span>
    </button>`;
  }
  html += `</div>`;

  const canPlay = !gameRunning && myCoins >= currentBet;
  const minWin = currentBet * 2;

  html += `<button class="mg-play" id="mg-play" ${canPlay ? '' : 'disabled'}>
    ${ico('play',20)} ${gameRunning ? 'JUGANDO…' : 'JUGAR ' + fmt(currentBet)}
  </button>`;
  if (canPlay) {
    html += `<p class="hint" style="margin-top:12px">Ganas mínimo el doble: <b>+${fmt(minWin)}</b> monedas</p>`;
  }

  content.innerHTML = html;

  content.querySelectorAll('.mg-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (gameRunning) return;
      currentChoice = btn.dataset.choice;
      renderMinigames();
    });
  });
  content.querySelectorAll('.mg-bet').forEach(btn => {
    btn.addEventListener('click', () => {
      if (gameRunning) return;
      currentBet = parseInt(btn.dataset.bet, 10);
      renderMinigames();
    });
  });
  $('mg-play')?.addEventListener('click', playCurrentGame);
}

function renderGameResultVisual(r) {
  const win = (r.net || 0) > 0;
  const tie = (r.net || 0) === 0;
  const sign = win ? '+' : '';
  const gainClass = win ? 'win' : (tie ? 'neutral' : 'lose');

  let inner = `<div class="mg-result">`;

  if (r.tipo === 'ruleta' && r.result) {
    const emoji = r.result === 'rojo' ? '🔴' : r.result === 'negro' ? '⚫' : '🟢';
    const centerBg = r.result === 'rojo' ? '#dc2626' : r.result === 'negro' ? '#1f2937' : '#16a34a';
    const matches = [];
    ROULETTE_ORDER.forEach((c, i) => { if (c === r.result) matches.push(i); });
    const targetIdx = matches[0];
    const segAngle = 360 / ROULETTE_ORDER.length;
    const finalAngle = -targetIdx * segAngle;

    inner += `
      <div class="mg-wheel-wrap">
        <div class="mg-wheel-rim"></div>
        <div class="mg-wheel-pointer"></div>
        <div class="mg-wheel" style="transform: rotate(${finalAngle}deg);"></div>
        <div class="mg-wheel-center" style="background: ${centerBg}; color: #fff; font-size: 24px; box-shadow: 0 0 35px ${centerBg}; border-color: ${centerBg};">${emoji}</div>
      </div>
      <div class="mg-result-name ${win ? 'win' : 'lose'}">${r.result}</div>
    `;
  } else if (r.tipo === 'slots' && Array.isArray(r.reels)) {
    const allSame = r.reels[0] === r.reels[1] && r.reels[1] === r.reels[2];
    inner += `
      <div class="mg-slots-wrap">
        ${r.reels.map(s => `<div class="mg-reel ${allSame ? 'win' : ''}"><span class="mg-reel-symbol">${s}</span></div>`).join('')}
      </div>
      <div class="mg-result-name ${win ? 'win' : 'lose'}">${r.mult > 0 ? 'x' + r.mult : 'SIN SUERTE'}</div>
    `;
  } else if (r.tipo === 'caracruz' && r.result) {
    const finalAngle = r.result === 'cara' ? 0 : 180;
    inner += `
      <div class="mg-coin-wrap">
        <div class="mg-coin-3d" style="transform: rotateY(${finalAngle}deg);">
          <div class="mg-coin-face cara">👑</div>
          <div class="mg-coin-face cruz">⚔️</div>
        </div>
      </div>
      <div class="mg-result-name ${win ? 'win' : 'lose'}">${r.result}</div>
    `;
  }

  inner += `<div class="mg-result-gain ${gainClass}">${ico('coin',18)} ${sign}${fmt(r.net || 0)}</div>`;
  inner += `</div>`;
  return inner;
}

/* ============================================================
   SPIN — Ruleta
   ============================================================ */
function startRouletteSpin() {
  const wheel = $('mg-wheel-live') || document.querySelector('.mg-wheel');
  if (!wheel) return;
  wheel.style.transition = 'none';
  wheel.style.animation = 'none';

  let lastT = performance.now();
  const SPEED = 1200;

  function tick(now) {
    if (!wheel.isConnected) { rouletteRaf = null; return; }
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    rouletteAngle += SPEED * dt;
    if (rouletteAngle > 1e7) rouletteAngle = rouletteAngle % 360;
    wheel.style.transform = `rotate(${rouletteAngle}deg)`;
    rouletteRaf = requestAnimationFrame(tick);
  }
  rouletteRaf = requestAnimationFrame(tick);
}

async function stopRouletteSpin(result) {
  const wheel = $('mg-wheel-live') || document.querySelector('.mg-wheel');
  if (rouletteRaf) { cancelAnimationFrame(rouletteRaf); rouletteRaf = null; }
  if (!wheel || !result) return;

  const matches = [];
  ROULETTE_ORDER.forEach((c, i) => { if (c === result) matches.push(i); });
  const targetIdx = matches[Math.floor(Math.random() * matches.length)];

  const segAngle = 360 / ROULETTE_ORDER.length;
  const segCenter = targetIdx * segAngle;
  const jitter = (Math.random() - 0.5) * (segAngle * 0.55);
  const desiredMod = ((-segCenter + jitter) % 360 + 360) % 360;
  const currentMod = (rouletteAngle % 360 + 360) % 360;

  let delta = desiredMod - currentMod;
  if (delta < 0) delta += 360;

  const extraSpins = 4 + Math.floor(Math.random() * 4);
  const totalDelta = extraSpins * 360 + delta;
  const finalAngle = rouletteAngle + totalDelta;

  wheel.style.transition = 'transform 4s cubic-bezier(0.12, 0.85, 0.15, 1)';
  void wheel.offsetWidth;
  wheel.style.transform = `rotate(${finalAngle}deg)`;
  rouletteAngle = finalAngle;

  await new Promise(res => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      wheel.removeEventListener('transitionend', finish);
      res();
    };
    wheel.addEventListener('transitionend', finish);
    setTimeout(finish, 4300);
  });
}

/* ============================================================
   SPIN — Slots
   ============================================================ */
function startSlotsSpin() {
  const reels = document.querySelectorAll('.mg-reel');
  slotIntervals = [];
  reels.forEach((reel, i) => {
    reel.classList.add('spinning');
    const symbolEl = reel.querySelector('.mg-reel-symbol');
    if (!symbolEl) return;
    const interval = setInterval(() => {
      if (!reel.isConnected) { clearInterval(interval); return; }
      symbolEl.textContent = SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)];
    }, 55 + i * 18);
    slotIntervals[i] = interval;
  });
}

async function stopSlotsSpin(finalReels) {
  const reels = document.querySelectorAll('.mg-reel');
  if (!finalReels) {
    reels.forEach((reel, i) => {
      if (slotIntervals[i]) { clearInterval(slotIntervals[i]); slotIntervals[i] = null; }
      reel.classList.remove('spinning');
    });
    return;
  }
  for (let i = 0; i < reels.length; i++) {
    const reel = reels[i];
    if (!reel) continue;
    if (i > 0) await new Promise(res => setTimeout(res, 280));
    if (slotIntervals[i]) { clearInterval(slotIntervals[i]); slotIntervals[i] = null; }
    reel.classList.remove('spinning');
    const symbolEl = reel.querySelector('.mg-reel-symbol');
    if (symbolEl) {
      symbolEl.textContent = finalReels[i];
      reel.classList.add('settled');
      setTimeout(() => reel.classList.remove('settled'), 400);
    }
  }
  await new Promise(res => setTimeout(res, 250));
}

/* ============================================================
   SPIN — Cara o Cruz
   ============================================================ */
function startCoinSpin() {
  const coin = $('mg-coin-live') || document.querySelector('.mg-coin-3d');
  if (!coin) return;
  coin.style.transition = 'none';
  coin.style.animation = 'none';

  let lastT = performance.now();
  const SPEED = 900;

  function tick(now) {
    if (!coin.isConnected) { coinRaf = null; return; }
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    coinAngle += SPEED * dt;
    if (coinAngle > 1e7) coinAngle = coinAngle % 360;
    coin.style.transform = `rotateY(${coinAngle}deg) rotateX(12deg)`;
    coinRaf = requestAnimationFrame(tick);
  }
  coinRaf = requestAnimationFrame(tick);
}

async function stopCoinSpin(result) {
  const coin = $('mg-coin-live') || document.querySelector('.mg-coin-3d');
  if (coinRaf) { cancelAnimationFrame(coinRaf); coinRaf = null; }
  if (!coin || !result) return;

  const desiredMod = result === 'cara' ? 0 : 180;
  const currentMod = (coinAngle % 360 + 360) % 360;

  let delta = desiredMod - currentMod;
  if (delta < 0) delta += 360;

  const extraSpins = 3 + Math.floor(Math.random() * 2);
  const totalDelta = extraSpins * 360 + delta;
  const finalAngle = coinAngle + totalDelta;

  coin.style.transition = 'transform 2.2s cubic-bezier(0.12, 0.85, 0.15, 1)';
  void coin.offsetWidth;
  coin.style.transform = `rotateY(${finalAngle}deg) rotateX(0deg)`;
  coinAngle = finalAngle;

  await new Promise(res => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      coin.removeEventListener('transitionend', finish);
      res();
    };
    coin.addEventListener('transitionend', finish);
    setTimeout(finish, 2500);
  });
}

/* ============================================================
   PLAY FLOW
   ============================================================ */
async function playCurrentGame() {
  if (gameRunning) return;
  const myCoins = Number(userData?.coins) || 0;

  if (myCoins < currentBet) {
    showToast(`Necesitas ${fmt(currentBet)} monedas`, 'err', 3000, 'x');
    return;
  }
  if (currentGame === 'ruleta' && !currentChoice) {
    showToast('Elige un color primero', 'err', 2500, 'x');
    return;
  }
  if (currentGame === 'caracruz' && !currentChoice) {
    showToast('Elige cara o cruz', 'err', 2500, 'x');
    return;
  }

  gameRunning = true;
  gameLastResult = null;
  renderMinigames();

  const playBtn = $('mg-play');
  if (playBtn) {
    playBtn.disabled = true;
    playBtn.innerHTML = `${ico('clock',20)} JUGANDO…`;
  }
  document.querySelectorAll('.mg-opt, .mg-bet').forEach(b => {
    b.style.pointerEvents = 'none';
    b.style.opacity = '0.55';
  });

  const spinStart = Date.now();
  if (currentGame === 'ruleta')        startRouletteSpin();
  else if (currentGame === 'slots')    startSlotsSpin();
  else if (currentGame === 'caracruz') startCoinSpin();

  let result = null, error = null;
  try {
    result = await requestGame(currentGame, currentBet, currentChoice);
  } catch (e) {
    error = e;
  }

  const MIN_SPIN = currentGame === 'ruleta' ? 2600
                 : currentGame === 'caracruz' ? 2200
                 : 1800;
  const elapsed = Date.now() - spinStart;
  if (elapsed < MIN_SPIN) {
    await new Promise(res => setTimeout(res, MIN_SPIN - elapsed));
  }

  if (result) {
    if (currentGame === 'ruleta')      await stopRouletteSpin(result.result);
    else if (currentGame === 'slots')  await stopSlotsSpin(result.reels);
    else if (currentGame === 'caracruz') await stopCoinSpin(result.result);
    gameLastResult = result;
    if ((result.net || 0) > 0) gameTotalWon += result.net;
    await new Promise(res => setTimeout(res, 400));
  } else {
    if (currentGame === 'ruleta')        await stopRouletteSpin(null);
    else if (currentGame === 'slots')    await stopSlotsSpin(null);
    else if (currentGame === 'caracruz') await stopCoinSpin(null);
    if (error) showToast(error.message || 'Error', 'err', 4000, 'x');
  }

  gameRunning = false;
  renderMinigames();
}

        </div>
      </div>
      <div class="chev">${ico('chevron',18)}</div>
    </div>`;
  }

  html += `</div>
    <p class="hint" style="text-align:left;margin-top:14px">Toca cualquier jugador para ver su perfil completo.</p>
  </div>`;
  c.innerHTML = html;

  c.querySelectorAll('.rank-card').forEach(card => {
    card.addEventListener('click', () => {
      const uid = parseInt(card.dataset.uid, 10);
      const place = parseInt(card.dataset.place, 10);
      if (!isNaN(uid)) openUserModal(uid, { place, total: totalUsers });
    });
  });
}

function renderShop() {
  const c = $('tab-shop');
  const myCoins = Number(userData?.coins) || 0;

  let html = `<div class="page-wrap">
    <div class="stats-grid">
      <div class="stat"><div class="num">${fmt(myCoins)}</div><div class="lbl">${ico('coin',12)} Tu saldo</div></div>
      <div class="stat"><div class="num">${Object.keys(sales || {}).length}</div><div class="lbl">${ico('store',12)} En venta</div></div>
    </div>

    <div class="subtabs" id="shop-subtabs">
      <button class="subtab ${shopSubTab === 'waifus' ? 'active' : ''}" data-sub="waifus">${ico('store',13)}Waifus</button>
      <button class="subtab ${shopSubTab === 'boxes' ? 'active' : ''}" data-sub="boxes">${ico('gift',13)}Cajas misteriosas</button>
    </div>

    <div id="shop-content"></div>
  </div>`;

  c.innerHTML = html;

  c.querySelectorAll('#shop-subtabs .subtab').forEach(btn => {
    btn.addEventListener('click', () => { shopSubTab = btn.dataset.sub; renderShop(); });
  });

  const content = $('shop-content');
  if (shopSubTab === 'waifus') renderShopWaifus(content);
  if (shopSubTab === 'boxes')  renderShopBoxes(content);
}

function renderShopWaifus(container) {
  const allSales = Object.values(sales || {});
  const myCoins = Number(userData?.coins) || 0;
  const myId = session.userId;

  if (allSales.length === 0) {
    container.innerHTML = `<div class="empty"><span class="icon">${ico('store',44)}</span>No hay waifus en venta ahora mismo.</div>`;
    return;
  }

  allSales.sort((a, b) => a.price - b.price);

  let html = `<div class="grid">`;
  for (const s of allSales.slice(0, 90)) {
    const wname = s.waifu?.name || '?';
    const rarity = s.waifu?.rarity || 'comun';
    watchImage(wname);
    const url = imageUrls[wname] || '';
    const initial = (wname || '?').charAt(0).toUpperCase();
    const seller = s.sellerUsername ? '@' + esc(s.sellerUsername) : esc(s.sellerName || 'Anónimo');
    const isMine = String(s.sellerId) === String(myId);
    const canAfford = myCoins >= (s.price || 0);
    const disabled = isMine || !canAfford;
    const btnText = isMine ? 'Tu venta' : (canAfford ? `Comprar ${fmt(s.price)}` : `Faltan ${fmt((s.price||0)-myCoins)}`);

    html += `<div class="wcard" data-r="${rarity}" data-img="${esc(wname)}">
      <div class="img">
        ${url ? `<img src="${esc(url)}" alt="" loading="lazy">` : `<span class="placeholder">${initial}</span>`}
      </div>
      <div class="info">
        <div class="name" title="${esc(wname)}">${esc(wname)}</div>
        <div class="meta">
          <span class="rarity">${RARITY_LABEL[rarity] || rarity}</span>
          <span class="count">${fmt(s.price)}${ico('coin',10)}</span>
        </div>
        <div class="seller-line">${seller}</div>
        <button class="btn-buy-card" data-buy="${esc(s.saleId)}" ${disabled ? 'disabled' : ''}>
          ${esc(btnText)}
        </button>
      </div>
    </div>`;
  }
  html += `</div>`;

  container.innerHTML = html;

  container.querySelectorAll('.btn-buy-card').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const saleId = btn.dataset.buy;
      if (!saleId || btn.disabled) return;
      btn.disabled = true;
      const original = btn.textContent;
      btn.innerHTML = '<span class="loading"></span>';
      try { await requestBuy(saleId); }
      catch (err) { showToast(err.message || 'Error', 'err', 4000, 'x'); }
      finally { setTimeout(() => { btn.disabled = false; btn.innerHTML = original; }, 5000); }
    });
  });
}

function renderShopBoxes(container) {
  const myCoins = Number(userData?.coins) || 0;

  let html = `<div class="section-title">${ico('gift',13)} Cajas misteriosas</div>
    <div class="boxes-grid">`;

  for (const key of ['comun', 'premium', 'legendaria']) {
    const box = CAJAS[key];
    const canAfford = myCoins >= box.price;
    const disabled = !canAfford;
    html += `<div class="box-card" data-box="${key}" data-can="${disabled ? 0 : 1}">
      <div class="bicon"><img src="${esc(box.img)}" alt="${esc(box.name)}" loading="lazy"></div>
      <div class="bname">${box.name}</div>
      <div class="bdesc">${box.desc}</div>
      <div class="bprice">${fmt(box.price)} ${ico('coin',14)}</div>
    </div>`;
  }

  html += `</div>
    <p class="hint" style="text-align:left;margin-top:18px">
      Toca una caja para abrirla al instante.<br>
      El bot procesará la apertura, te avisará por DM con las imágenes y las waifus aparecerán en tu colección en segundos.<br>
      Cada apertura consume las monedas correspondientes.
    </p>`;

  container.innerHTML = html;

  container.querySelectorAll('.box-card').forEach(card => {
    const key = card.dataset.box;
    const canOpen = card.dataset.can === '1';
    if (!canOpen) { card.style.opacity = '.55'; card.style.cursor = 'not-allowed'; return; }
    card.addEventListener('click', async () => {
      if (card.dataset.opening) return;
      card.dataset.opening = '1';
      const original = card.innerHTML;
      card.style.opacity = '.6';
      card.style.pointerEvents = 'none';
      try { await requestBox(key); }
      catch (err) { showToast(err.message || 'Error', 'err', 4000, 'x'); }
      finally {
        setTimeout(() => {
          card.innerHTML = original;
          card.style.opacity = '1';
          card.style.pointerEvents = '';
          delete card.dataset.opening;
        }, 5000);
      }
    });
  });
}

function renderAuction() {
  if (auctionTimer) { clearInterval(auctionTimer); auctionTimer = null; }
  const c = $('tab-auction');
  const a = auction?.active;

  if (!a) {
    c.innerHTML = `<div class="page-wrap"><div class="empty">
      <span class="icon">${ico('star',44)}</span>
      No hay subasta activa.<br>
      La próxima empieza a las <b>8:00 AM (MX)</b>.
    </div></div>`;
    return;
  }

  const bids = Object.values(a.bids || {}).sort((x, y) => y.amount - x.amount);
  const given = a.copiesGivenBefore || 0;
  const copyNum = given + 1;

  let html = `<div class="page-wrap">
    <div class="auction-hero">
      <div class="auction-tag">${a.testMode ? ico('shield',12) + ' Prueba' : ico('star',12) + ' En vivo'} · Copia ${copyNum}/${a.maxCopies || 3}</div>
      <div class="auction-name">${esc(a.waifuName)}</div>
      <div class="countdown" id="auction-countdown">--:--</div>
    </div>

    <div class="stats-grid">
      <div class="stat"><div class="num">${bids.length}</div><div class="lbl">${ico('chart',12)} Pujas</div></div>
      <div class="stat"><div class="num">${bids[0] ? fmt(bids[0].amount) : 0}</div><div class="lbl">${ico('trophy',12)} Mejor puja</div></div>
    </div>

    <div class="section-title">Top postores</div>`;

  if (bids.length === 0) {
    html += `<div class="empty">Sin pujas aún. ¡Sé el primero desde el bot!</div>`;
  } else {
    for (let i = 0; i < Math.min(bids.length, 5); i++) {
      const b = bids[i];
      const cls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const display = b.username ? '@' + esc(b.username) : esc(b.name || ('Usuario ' + b.userId));
      html += `<div class="row">
        <div class="left"><div class="rank ${cls}">${i < 3 ? ico('award',16) : (i + 1)}</div><div class="info"><div class="name">${display}</div></div></div>
        <div class="right">${fmt(b.amount)} ${ico('coin',12)}</div>
      </div>`;
    }
  }
  html += `<p class="hint" style="text-align:left;margin-top:14px">Para pujar, usa los botones del mensaje en el grupo.</p></div>`;
  c.innerHTML = html;

  const cdEl = $('auction-countdown');
  if (!cdEl) return;
  const updateCd = () => {
    const rem = Math.max(0, a.endTime - Date.now());
    const h = Math.floor(rem / 3600000);
    const m = Math.floor((rem % 3600000) / 60000);
    const s = Math.floor((rem % 60000) / 1000);
    cdEl.textContent = h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (rem < 5 * 60 * 1000) cdEl.classList.add('urgent');
    else cdEl.classList.remove('urgent');
  };
  updateCd();
  auctionTimer = setInterval(updateCd, 1000);
}

/* ============================================================
   LOGOUT
   ============================================================ */
$('btn-logout').addEventListener('click', async () => {
  unsubs.forEach(u => { try { u(); } catch {} });
  unsubs.length = 0;
  imageUnsubs.forEach(u => { try { u(); } catch {} });
  imageUnsubs.clear();
  actionUnsubs.forEach(u => { try { u(); } catch {} });
  actionUnsubs.clear();
  if (auctionTimer) { clearInterval(auctionTimer); auctionTimer = null; }
  if (rouletteRaf) { cancelAnimationFrame(rouletteRaf); rouletteRaf = null; }
  if (coinRaf) { cancelAnimationFrame(coinRaf); coinRaf = null; }
  slotIntervals.forEach(i => { if (i) clearInterval(i); });
  slotIntervals = [];
  closeUserModal();
  closeBoxModal();
  unsubscribeChat();
  unsubscribeStickers();
  chatInitialized = false;

  if (session?.token) { try { await remove(ref(db, `sessions/${session.token}`)); } catch {} }
  localStorage.removeItem('jinx_session');
  session = userDoc = userData = null;
  if (unsubRequest) { unsubRequest(); unsubRequest = null; }

  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('show');
  navigateTo('profile');

  show('screen-login');
  inputEl.value = '';
  $('btn-request').disabled = false;
  $('btn-request').innerHTML = ico('play',15) + 'Enviar código';
  codeInputs.forEach(i => i.value = '');
});

hydrateIcons();

(async () => {
  const token = localStorage.getItem('jinx_session');
  if (!token) return;
  try { await startSession(token); }
  catch { localStorage.removeItem('jinx_session'); }
})();
</script>
